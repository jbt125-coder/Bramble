// Close-X box, drawn top-right of a popup card; tap region matches
// exactly what each overlay's tap handler checks. `closeXRect()` is the
// standard-size popup's close-X; `closeXRectAt` lets a differently-sized
// popup (like the equip picker) compute its own in the same corner.
var CLOSE_X_SIZE = 26;
function closeXRectAt(bx, bw, by) {
  return { x: bx + bw - CLOSE_X_SIZE - 6, y: by + 6, w: CLOSE_X_SIZE, h: CLOSE_X_SIZE };
}
function closeXRect() {
  return closeXRectAt(20, LW - 40, 60);
}
function equipCloseXRect() {
  return closeXRectAt(30, LW - 60, 140);
}
function drawCloseX(r) {
  r = r || closeXRect();
  ctx.strokeStyle = PAL.red;
  ctx.lineWidth = 2;
  ctx.strokeRect(r.x, r.y, r.w, r.h);
  ctx.beginPath();
  ctx.moveTo(r.x + 5, r.y + 5); ctx.lineTo(r.x + r.w - 5, r.y + r.h - 5);
  ctx.moveTo(r.x + r.w - 5, r.y + 5); ctx.lineTo(r.x + 5, r.y + r.h - 5);
  ctx.stroke();
}

// ============================================================
// MOVEMENT / INTERACTION
// ============================================================
function tryEncounter() {
  if (state.mode !== "overworld" && state.mode !== "dungeon" && state.mode !== "island") return;
  // the Archwizard's floor is quiet — no wandering monsters on level 8
  if (state.mode === "dungeon" && state.dungeonLevel === 8) return;
  // once the trident has proven itself against the Kraken King, the seas
  // respect the party — no more ambient sea-creature encounters at all
  if (state.sailing && hasTrident && (hasKrakenSkull || hasLegPart)) return;
  // while actively hunting sea creatures for the leg hut, they come
  // looking for you much more aggressively
  var huntingSeaCreatures = state.sailing && legQuestActivated && !hasTrident;
  var cap = state.mode === "dungeon" ? 3 : huntingSeaCreatures ? 4 : 2;
  var chance = huntingSeaCreatures ? 0.12 : 0.05;
  var already = mapMonsters.filter(entityIsHere).length;
  if (already < cap && Math.random() < chance) spawnMapMonster(state.mode);
}

// ============================================================
// ARENA — a bounded skirmish grid, same tile size/viewport as the
// overworld. Monsters start near the top edge, party near the
// bottom edge, and everyone (including monsters) has a live x/y
// position they move around during the fight.
// ============================================================
var ARENA_W = VIEW_TILES, ARENA_H = VIEW_TILES;

function buildArenaGrid(theme) {
  if (theme === "dungeon" || theme === "castle") {
    // brick-walled room — dungeon fights, and the rare castle/guard encounter
    var g = mkMap(ARENA_W, ARENA_H, T.FLOOR);
    for (var c = 0; c < ARENA_W; c++) { g[0][c] = T.WALL; g[ARENA_H - 1][c] = T.WALL; }
    for (var r = 0; r < ARENA_H; r++) { g[r][0] = T.WALL; g[r][ARENA_W - 1] = T.WALL; }
    return g;
  }
  if (theme === "coastal") {
    // beach at the bottom (where the party stands), open water at the top
    // with the ship anchored in it, matching a shoreline skirmish
    var g3 = mkMap(ARENA_W, ARENA_H, T.GRASS);
    var waterRows = Math.floor(ARENA_H * 0.45);
    for (var row3 = 0; row3 < waterRows; row3++) {
      for (var col3 = 0; col3 < ARENA_W; col3++) g3[row3][col3] = T.WATER;
    }
    // sandy transition strip right at the waterline
    for (var col4 = 0; col4 < ARENA_W; col4++) g3[waterRows][col4] = T.SAND;
    // the ship sits anchored in the water, roughly centered
    var shipCol = Math.floor(ARENA_W / 2);
    var shipRow = Math.max(1, waterRows - 2);
    g3[shipRow][shipCol] = T.SHIP;
    return g3;
  }
  // default "field" theme: open grass with a scatter of trees around the
  // edges, matching the overworld look instead of a dungeon room
  var g2 = mkMap(ARENA_W, ARENA_H, T.GRASS);
  var seed = Math.floor(Math.random() * 100000);
  function rand() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  for (var row = 0; row < ARENA_H; row++) {
    for (var col = 0; col < ARENA_W; col++) {
      var edgeDist = Math.min(row, col, ARENA_H - 1 - row, ARENA_W - 1 - col);
      if (edgeDist === 0 && rand() < 0.4) g2[row][col] = T.FOREST;
    }
  }
  return g2;
}

function placeMonstersInArena(group) {
  var usedTiles = {};
  var cx = Math.floor(ARENA_W / 2);
  var shipTile = null;
  if (combat.theme === "coastal") {
    for (var r = 0; r < ARENA_H; r++) {
      for (var c = 0; c < ARENA_W; c++) {
        if (combat.arenaGrid[r][c] === T.SHIP) { shipTile = { x: c, y: r }; }
      }
    }
  }
  group.forEach(function (m, i) {
    var tries = 0;
    var mx, my;
    do {
      mx = Math.max(1, Math.min(ARENA_W - 2, cx - Math.floor(group.length / 2) + i + (Math.floor(Math.random() * 3) - 1)));
      my = 1 + Math.floor(Math.random() * 2); // top two rows
      tries++;
    } while ((usedTiles[mx + "," + my] || (shipTile && mx === shipTile.x && my === shipTile.y)) && tries < 10);
    usedTiles[mx + "," + my] = true;
    m.x = mx; m.y = my;
  });
}

function placePartyInArena() {
  var cx = Math.floor(ARENA_W / 2);
  var positions = [
    { x: cx - 1, y: ARENA_H - 2 },
    { x: cx + 1, y: ARENA_H - 2 },
    { x: cx - 2, y: ARENA_H - 3 },
    { x: cx + 2, y: ARENA_H - 3 }
  ];
  party.forEach(function (p, i) {
    p.ax = positions[i].x;
    p.ay = positions[i].y;
  });
}

function rollGroupSize() {
  // weighted toward smaller groups: 1-6, but 1-2 much more common than 5-6
  var r = Math.random();
  if (r < 0.30) return 1;
  if (r < 0.55) return 2;
  if (r < 0.75) return 3;
  if (r < 0.88) return 4;
  if (r < 0.96) return 5;
  return 6;
}

function buildMonsterGroup(seedDef, pureGroup) {
  var count = rollGroupSize();
  var group = [];
  for (var i = 0; i < count; i++) {
    // pureGroup encounters (pirates, guards) are all the same type; mixed
    // wandering-monster packs draw the rest randomly from the general pool
    var def = (i === 0 || pureGroup) ? seedDef : MONSTER_DEFS[Math.floor(Math.random() * MONSTER_DEFS.length)];
    group.push(makeMonsterInstance(def, 0, 0));
  }
  return group;
}

function enterArena(group, returnMode, encounterKind, forceTheme) {
  var isDungeonFight = returnMode === "dungeon";
  var arenaTheme = forceTheme ? forceTheme
    : isDungeonFight ? "dungeon"
    : encounterKind === "guard" ? "castle"
    : encounterKind === "pirate" ? "coastal"
    : "field";
  combat = {
    monsters: group, returnMode: returnMode, arenaGrid: buildArenaGrid(arenaTheme),
    kind: encounterKind || null, theme: arenaTheme
  };
  placeMonstersInArena(group);
  placePartyInArena();
  state.mode = "combat";
  pushLog("-----Conflict!!-----");
  pushLog(">" + group.length + " monster" + (group.length > 1 ? "s" : "") + " approach!");
  renderAll();
}

function startCombatWithMonster(mapMonster, screenKey) {
  var def = findMonsterDef(mapMonster.name);
  if (!def) return;
  var group = buildMonsterGroup(def, !!def.aquatic); // aquatic packs stay pure (all Sea Serpents/Krakens)
  // aquatic encounters use the coastal arena theme (water + ship visuals)
  // rather than the plain grass "field" default
  enterArena(group, screenKey, def.aquatic ? "pirate" : null);
}

// Looks up a monster definition by name across every pool — the general
// land pool plus the special aquatic/pirate/guard defs.
var SPECIAL_MONSTER_DEFS = [
  SEA_SERPENT_DEF, PIRATE_DEF, GUARD_DEF, WILD_HORSE_DEF, WIZARD_DEF,
  BAT_DEF, GIANT_WASP_DEF, GIANT_EAGLE_DEF, MONKEY_DEF, YETI_DEF, KRAKEN_DEF, ALIEN_DEF,
  PHOENIX_DEF, ELITE_GUARD_DEF, ARCHWIZARD_DEF, MERMAN_DEF, CYBER_ZOMBIE_DEF,
  KRAKEN_KING_DEF, SHARK_DEF
];
function findMonsterDef(name) {
  for (var i = 0; i < MONSTER_DEFS.length; i++) {
    if (MONSTER_DEFS[i].name === name) return MONSTER_DEFS[i];
  }
  for (var j = 0; j < SPECIAL_MONSTER_DEFS.length; j++) {
    if (SPECIAL_MONSTER_DEFS[j].name === name) return SPECIAL_MONSTER_DEFS[j];
  }
  return null;
}

function startCombat() {
  // used for the classic ambush case (bumping straight into an encounter
  // without a wandering monster sprite already on screen)
  var seedDef = MONSTER_DEFS[Math.floor(Math.random() * MONSTER_DEFS.length)];
  var group = buildMonsterGroup(seedDef);
  enterArena(group, state.mode);
}

var lastKillerIdx = null; // tracks whoever landed the most recent kill, for reward attribution
function registerKill(monster, killerIdx) {
  lastKillerIdx = killerIdx;
  monsterKillCounts[monster.baseName] = (monsterKillCounts[monster.baseName] || 0) + 1;
  var killer = party[killerIdx];
  if (killer && killer.alive) {
    killer.xp += monster.xp;
    var xpNeeded = killer.lvl * 20;
    if (killer.xp >= xpNeeded) {
      killer.xp -= xpNeeded;
      killer.lvl += 1;
      killer.maxHp += 6;
      killer.hp = killer.maxHp;
      pushLog(killer.name + " reached level " + killer.lvl + "!");
    }
  }
  // loot drop, placed at the monster's death tile in the screen we return to
  var loot = rollLootForMonster(monster.tier);
  if (loot) {
    var dropX = monster.x, dropY = monster.y;
    if (loot.category === "potion") {
      addGroundItem(combat.returnMode, dropX, dropY, { kind: "item", category: "potion", item: loot.item });
    } else {
      addGroundItem(combat.returnMode, dropX, dropY, { kind: "item", category: loot.category, item: loot.item });
    }
    pushLog(monster.name + " dropped " + loot.item.name + "!");
  }
}

function endCombatVictory() {
  var g = 0;
  combat.monsters.forEach(function (m) { g += rollRange(m.gold); });
  sharedGold += g;
  pushLog("Victory! +" + g + "g");
  if (combat.kind === "pirate" && !ship.owned) {
    ship.owned = true;
    ship.screen = combat.returnMode;
    ship.x = state.x; ship.y = state.y; // docked right where you fought them
    pushLog("You claim the pirates' ship! It awaits at the shore.");
  }
  if (combat.kind === "alien" && !alienQuestComplete) {
    alienEncountersWon += 1;
    pushLog("Alien encounter defeated! (" + alienEncountersWon + "/3)");
    if (alienEncountersWon >= 3) {
      alienQuestComplete = true;
      var hero = (lastKillerIdx !== null && party[lastKillerIdx]) ? party[lastKillerIdx] : party[0];
      hero.title = "Alien Slayer";
      hero.weaponBonus = Math.max(hero.weaponBonus, QUEST_REWARD_ITEM.dmgBonus);
      var bonusGold = 150;
      sharedGold += bonusGold;
      pushLog("-----Quest Complete!-----");
      pushLog(hero.name + " is named \"" + hero.title + "\"!");
      pushLog(hero.name + " is given the " + QUEST_REWARD_ITEM.name + "!");
      pushLog("+" + bonusGold + "g bounty from the moon settlers.");
      pushLog("The Lunar Armory will now trade with you.");
    }
  }
  // sea-creature bounty for the leg hut — counts by encounter, not by
  // individual monster, same convention as the alien quest above
  if (legQuestActivated && !hasTrident) {
    var seaCreatureNames = ["Sea Serpent", "Kraken", "Merman"];
    var wasSeaCreatureFight = combat.monsters.some(function (m) { return seaCreatureNames.indexOf(m.baseName) !== -1; });
    if (wasSeaCreatureFight) {
      seaCreatureKillsForQuest += 1;
      pushLog("Sea creature defeated! (" + Math.min(seaCreatureKillsForQuest, 10) + "/10)");
    }
  }
  if (combat.kind === "krakenBoss") {
    hasKrakenSkull = true;
    // word travels fast — any sea creatures still out there scatter
    mapMonsters = mapMonsters.filter(function (m) { return !m.aquatic; });
    pushLog("-----The Kraken King falls!-----");
    pushLog("You claim its skull — a grim trophy indeed.");
    pushLog("Received the Kraken Skull 💀!");
    pushLog("The seas grow calm — the deep respects the trident now.");
  }
  if (combat.kind === "sharkBattle") {
    hasPirateFlag = true;
    tornadoes = tornadoes.filter(function (t) { return !t.isQuestTornado; });
    pushLog("-----You win the Pirate Flag!-----");
    pushLog("The tornado dissipates, leaving calm water behind.");
  }
  if (combat.kind === "phoenix") {
    party[0].weaponBonus = Math.max(party[0].weaponBonus, FIRE_BOW.dmgBonus);
    party[0].equippedWeapon = FIRE_BOW;
    pushLog("The Phoenix's ashes reveal a Fire Bow!");
    pushLog(party[0].name + " equips the Fire Bow!");
  }
  if (combat.kind === "wizardBoss") {
    hasWizardsWand = true;
    addToInventory("weapon", WIZARDS_WAND);
    // clear the boss tile on level 8 so he can't be re-fought
    var level8 = ensureDungeonLevel(8);
    var bossSpot = findTileOnGrid(level8, T.BOSS);
    if (bossSpot) level8[bossSpot.y][bossSpot.x] = T.FLOOR;
    pushLog("-----The Archwizard falls!-----");
    pushLog("You claim the " + WIZARDS_WAND.name + "!");
    pushLog("The King in Bramble will want to see this.");
  }
  state.mode = combat.returnMode;
  combat = null;
  renderAll();
}

function partyAlive() { return party.some(function (p) { return p.alive; }); }

// After a defeat, drop the party back at a safe starting spot appropriate
// to whichever map they were on — not just the mainland's start tile.
// Finds the given landmark tile type on a grid and returns it (or null).
function findTileOnGrid(grid, tileType) {
  for (var r = 0; r < grid.length; r++) {
    for (var c = 0; c < grid[0].length; c++) {
      if (grid[r][c] === tileType) return { x: c, y: r };
    }
  }
  return null;
}

// After a full party defeat, only the leader wakes up — teleported to
// the nearest hospital/healer, not just dropped back where they were.
// The other 3 party members stay dead until revived (and paid for) at
// a healer, same as any other time someone falls.
function respawnAfterDefeat() {
  if (state.mode === "island" || state.mode === "islandTown") {
    state.mode = "islandTown";
    state.x = 12; state.y = 15; // just below/adjacent to the island healer at (12,14)
    // make sure the exit door drops the player just outside THIS town's
    // gate, not wherever they happened to enter the island from before
    var islandGate = findTileOnGrid(islandGrid, T.TOWN);
    if (islandGate) state.fromIsland = adjacentWalkableTile(islandGrid, islandGate);
  } else {
    // mainland, dungeon, moon, and moon town all funnel to the mainland
    // hospital — the only other healer (the moon has none at all)
    state.mode = "town";
    state.x = 36; state.y = 33; // just below/adjacent to the mainland healer at (36,32)
    var mainlandGate = findTileOnGrid(overworldGrid, T.TOWN);
    if (mainlandGate) state.fromOverworld = adjacentWalkableTile(overworldGrid, mainlandGate);
  }
}

// Picks a walkable tile next to a landmark (the gate) — matches the
// convention the normal entry flow uses, where "from" is the tile you
// were standing on right before stepping onto the town marker itself,
// not the marker tile.
function adjacentWalkableTile(grid, spot) {
  var deltas = [[0, 1], [0, -1], [1, 0], [-1, 0]];
  for (var i = 0; i < deltas.length; i++) {
    var x = spot.x + deltas[i][0], y = spot.y + deltas[i][1];
    var row = grid[y];
    if (row && (row[x] === T.GRASS || row[x] === T.ROAD || row[x] === T.SAND)) return { x: x, y: y };
  }
  return spot; // fallback: standing on the marker itself is harmless anyway
}

// Pairs each living party member with their "nearest" living monster by
// formation slot index (closest-index matching, wrapping if the groups are
// ============================================================
// SPATIAL COMBAT HELPERS
// ============================================================
function dist(ax, ay, bx, by) { return Math.abs(ax - bx) + Math.abs(ay - by); }

function livingMonsters() { return combat.monsters.filter(function (m) { return m.hp > 0; }); }
function alivePartyIdx() {
  var out = [];
  for (var i = 0; i < party.length; i++) if (party[i].alive) out.push(i);
  return out;
}

function arenaTileFree(x, y, exceptEntity) {
  if (x <= 0 || y <= 0 || x >= ARENA_W - 1 || y >= ARENA_H - 1) return false;
  var occupied = false;
  party.forEach(function (p) {
    if (p !== exceptEntity && p.alive && p.ax === x && p.ay === y) occupied = true;
  });
  combat.monsters.forEach(function (m) {
    if (m !== exceptEntity && m.hp > 0 && m.x === x && m.y === y) occupied = true;
  });
  return !occupied;
}

// One step toward a target tile, or null if already adjacent/blocked.
function stepToward(fromX, fromY, toX, toY, exceptEntity) {
  var dx = toX - fromX, dy = toY - fromY;
  if (Math.abs(dx) + Math.abs(dy) <= 1) return null; // already adjacent
  var stepX = dx === 0 ? 0 : (dx > 0 ? 1 : -1);
  var stepY = dy === 0 ? 0 : (dy > 0 ? 1 : -1);
  // prefer the axis with the larger gap; fall back to the other if blocked
  if (Math.abs(dx) >= Math.abs(dy) && stepX !== 0 && arenaTileFree(fromX + stepX, fromY, exceptEntity)) {
    return { x: fromX + stepX, y: fromY };
  }
  if (stepY !== 0 && arenaTileFree(fromX, fromY + stepY, exceptEntity)) {
    return { x: fromX, y: fromY + stepY };
  }
  if (stepX !== 0 && arenaTileFree(fromX + stepX, fromY, exceptEntity)) {
    return { x: fromX + stepX, y: fromY };
  }
  return null;
}

// ---------- monster AI: prefer the lowest-HP reachable party member,
// and mildly avoid stacking onto a tile another monster is already
// heading for (a light "spread out" tendency) ----------
function chooseMonsterTarget(m) {
  var idxs = alivePartyIdx();
  if (idxs.length === 0) return null;
  var best = null, bestScore = Infinity;
  idxs.forEach(function (i) {
    var p = party[i];
    var d = dist(m.x, m.y, p.ax, p.ay);
    var hpFactor = p.hp / p.maxHp; // lower current HP fraction = juicier target
    var score = d * 1.0 + hpFactor * 3.0;
    if (score < bestScore) { bestScore = score; best = i; }
  });
  return best;
}

function monsterAct(m) {
  var targetIdx = chooseMonsterTarget(m);
  if (targetIdx === null) return;
  var p = party[targetIdx];
  var def = findMonsterDef(m.baseName || m.name);
  var isRanged = def && def.ranged;
  var range = isRanged ? 4 : 1;
  var d = dist(m.x, m.y, p.ax, p.ay);
  if (d <= range) {
    var dmg = Math.max(0, rollRange(m.dmg) - p.armorBonus);
    p.hp -= dmg;
    pushLog(m.name + (isRanged ? " casts a bolt at " : " attacks ") + p.name + "!");
    pushLog(p.name + " takes " + dmg + " dmg");
    if (p.hp <= 0) {
      p.hp = 0; p.alive = false;
      pushLog(p.name + " has fallen!");
    }
    // ranged monsters hold their ground once in range rather than closing
    // in further, keeping their distance like a real caster
  } else {
    var step = stepToward(m.x, m.y, p.ax, p.ay, m);
    if (step) { m.x = step.x; m.y = step.y; }
  }
}

// ---------- auto party member AI: walk toward nearest monster, attack
// when adjacent ----------
function nearestMonsterTo(x, y) {
  var living = livingMonsters();
  if (living.length === 0) return null;
  var best = null, bestD = Infinity;
  living.forEach(function (m) {
    var d = dist(x, y, m.x, m.y);
    if (d < bestD) { bestD = d; best = m; }
  });
  return best;
}

function partyMemberAct(p, idx) {
  var target = nearestMonsterTo(p.ax, p.ay);
  if (!target) return;
  // a ranged weapon (Bow/Boomerang/Fire Bow) lets this party member fight
  // from its full range instead of closing to melee — same idea as how
  // ranged monsters already hold their ground in monsterAct
  var w = p.equippedWeapon;
  var range = (w && w.ranged) ? w.range : 1;
  if (dist(p.ax, p.ay, target.x, target.y) <= range) {
    var dmg = 1 + Math.floor(Math.random() * 5) + p.weaponBonus;
    var hit = Math.random() < 0.75;
    if (range > 1) spawnProjectile(p.ax, p.ay, target.x, target.y);
    if (!hit) {
      pushLog(p.name + " misses " + target.name + ".");
    } else {
      target.hp -= dmg;
      pushLog(p.name + (range > 1 ? " shoots " : " hits ") + target.name + " for " + dmg + ".");
      flashMonster(target, range > 1 ? VFX_PROJECTILE_MS : 0);
      if (target.hp <= 0) {
        pushLog(target.name + " destroyed!");
        registerKill(target, idx);
      }
    }
  } else {
    var step = stepToward(p.ax, p.ay, target.x, target.y, p);
    if (step) { p.ax = step.x; p.ay = step.y; }
  }
}

// Runs one full combat tick: auto party members act, then every living
// monster acts, then checks for victory/defeat. Called after the player's
// own move/attack each keypress, so the whole skirmish advances together.
function combatTick(actingIdx) {
  if (!combat) return;
  for (var i = 0; i < party.length; i++) {
    if (i === actingIdx) continue; // player already acted this tick
    if (!party[i].alive) continue;
    partyMemberAct(party[i], i);
  }
  if (livingMonsters().length === 0) { endCombatVictory(); return; }
  livingMonsters().forEach(function (m) { monsterAct(m); });
  if (!partyAlive()) {
    pushLog("-----Party defeated-----");
    // Only the leader is restored — everyone else stays dead until
    // revived (and paid for) at a healer, same as any other fall.
    party[0].alive = true;
    party[0].hp = party[0].maxHp;
    sharedGold = Math.floor(sharedGold * 0.5);
    state.mode = combat.returnMode;
    combat = null;
    respawnAfterDefeat();
    pushLog("You wake at the hospital. Half your gold is gone.");
    if (party.some(function (p, i) { return i > 0 && !p.alive; })) {
      pushLog("The rest of your party lies fallen. Revive them here.");
    }
    renderAll();
    return;
  }
  renderAll();
}

// ---------- player movement/attack within the arena ----------
function arenaMove(dx, dy) {
  if (!combat || confirmingRun || awaitingShotDirection) return;
  var leader = party[0];
  var nx = leader.ax + dx, ny = leader.ay + dy;

  // bump-to-attack: if a living monster occupies the destination tile,
  // attack it instead of moving
  var bumped = combat.monsters.find(function (m) { return m.hp > 0 && m.x === nx && m.y === ny; });
  if (bumped) {
    var dmg = 2 + Math.floor(Math.random() * 6) + leader.weaponBonus;
    var hit = Math.random() < 0.8;
    pushLog("-----" + leader.name + "-----");
    pushLog("Attacks " + bumped.name + "!");
    if (!hit) {
      pushLog("Missed!");
    } else {
      bumped.hp -= dmg;
      pushLog("Hit! Dam:" + dmg);
      flashMonster(bumped);
      if (bumped.hp <= 0) {
        pushLog(bumped.name + " destroyed!");
        registerKill(bumped, 0);
      }
    }
    combatTick(0);
    return;
  }

  if (arenaTileFree(nx, ny, leader)) {
    leader.ax = nx; leader.ay = ny;
  }
  combatTick(0);
}

// Leader "attacks" via the ATTACK button without needing a bump — swings
// at whichever monster is already adjacent, if any.
function combatPlayerAttack() {
  if (!combat || confirmingRun || awaitingShotDirection) return;
  var leader = party[0];
  // If a ranged weapon (Bow/Boomerang) is equipped, ATTACK works the same
  // as SHOOT — no need to force a separate button for it.
  if (leader.equippedWeapon && leader.equippedWeapon.ranged) {
    cmdShoot();
    return;
  }
  var target = combat.monsters.find(function (m) {
    return m.hp > 0 && dist(leader.ax, leader.ay, m.x, m.y) <= 1;
  });
  if (!target) { pushLog("No one in reach."); renderAll(); return; }
  var dmg = 2 + Math.floor(Math.random() * 6) + leader.weaponBonus;
  var hit = Math.random() < 0.8;
  pushLog("-----" + leader.name + "-----");
  pushLog("Attacks " + target.name + "!");
  if (!hit) {
    pushLog("Missed!");
  } else {
    target.hp -= dmg;
    pushLog("Hit! Dam:" + dmg);
    flashMonster(target);
    if (target.hp <= 0) {
      pushLog(target.name + " destroyed!");
      registerKill(target, 0);
    }
  }
  combatTick(0);
}

// Triggers the "which way?" prompt for a ranged weapon shot (Bow or
// Boomerang) — only available while that weapon is actually equipped and
// a fight is underway.
function cmdShoot() {
  if (!combat || confirmingRun || townScreen) return;
  var leader = party[0];
  var w = leader.equippedWeapon;
  if (!w || !w.ranged) { pushLog("No ranged weapon equipped."); renderAll(); return; }
  awaitingShotDirection = true;
  pushLog("Take aim! Choose a direction (arrow keys).");
  renderAll();
}

// Resolves a Bow or Boomerang shot: scans up to `range` tiles in a
// straight line from the leader's arena position, hits the first living
// monster found. A Boomerang that connects hits twice (out and back).
function fireRangedWeapon(dir) {
  awaitingShotDirection = false;
  if (!combat) { renderAll(); return; }
  var leader = party[0];
  var w = leader.equippedWeapon;
  var deltas = { N: [0, -1], S: [0, 1], E: [1, 0], W: [-1, 0] };
  var d = deltas[dir];
  if (!d || !w) { renderAll(); return; }

  var hitMonster = null;
  for (var step = 1; step <= w.range; step++) {
    var cx = leader.ax + d[0] * step, cy = leader.ay + d[1] * step;
    var found = combat.monsters.find(function (m) { return m.hp > 0 && m.x === cx && m.y === cy; });
    if (found) { hitMonster = found; break; }
  }
  pushLog("-----" + leader.name + "-----");
  pushLog("Fires the " + w.name + " " + facingWord(dir) + "!");
  if (!hitMonster) {
    spawnProjectile(leader.ax, leader.ay, leader.ax + d[0] * w.range, leader.ay + d[1] * w.range);
    pushLog("The shot flies wide.");
    combatTick(0);
    return;
  }
  spawnProjectile(leader.ax, leader.ay, hitMonster.x, hitMonster.y);
  var shots = w.returns ? 2 : 1; // Boomerang hits going out AND coming back
  for (var s = 0; s < shots; s++) {
    if (hitMonster.hp <= 0) break;
    var dmg = 2 + Math.floor(Math.random() * 6) + w.dmgBonus;
    hitMonster.hp -= dmg;
    pushLog((s === 0 ? "Hit! " : "It returns and hits again! ") + "Dam:" + dmg);
    flashMonster(hitMonster, VFX_PROJECTILE_MS);
  }
  if (hitMonster.hp <= 0) {
    pushLog(hitMonster.name + " destroyed!");
    registerKill(hitMonster, 0);
  }
  combatTick(0);
}

function facingWord(f) {
  return { N: "North", S: "South", E: "East", W: "West" }[f] || "South";
}

// Handles ONE dpad press while sailing on open water, applying wind speed.
// Returns true if it fully handled the input (caller should stop), or
// false to let the normal single-tile logic in move() run instead — used
// for edge cases like disembarking onto land or reaching a landmark,
// which stay single-tile events regardless of wind.
function sailingMove(dx, dy, facing) {
  var firstX = state.x + dx, firstY = state.y + dy;
  var firstTile = tileAt(firstX, firstY);
  // Only take over for a pure open-water step. Anything else (disembarking
  // onto land, reaching the island marker, sailing off the island's edge)
  // falls through to the normal single-tile handling in move().
  if (firstTile !== T.WATER) return false;

  var speed = sailSpeedFor(facing);
  maybeShiftWind();

  if (speed.blocked) {
    pushLog(speed.tiles === 0 ? "Dead calm. The ship drifts." : "Sailing against the wind — no progress.");
    stepMapMonsters();
    renderAll();
    return true;
  }

  var moved = false;
  for (var i = 0; i < speed.tiles; i++) {
    var nx2 = state.x + dx, ny2 = state.y + dy;
    var t2 = tileAt(nx2, ny2);
    if (t2 !== T.WATER) break; // stop before leaving open water — let a
    // follow-up press handle the actual landfall/disembark tile-by-tile
    var wrapped2 = wrapPos(nx2, ny2);
    state.x = wrapped2.x; state.y = wrapped2.y;
    moved = true;
    // stop dead on the Thief King's tornado rather than sailing straight
    // through it on a favorable-wind multi-tile move
    if (PIRATE_TORNADO_POS && state.x === PIRATE_TORNADO_POS.x && state.y === PIRATE_TORNADO_POS.y) break;
  }
  if (moved) {
    pushLog(facingWord(facing) + (speed.tiles > 1 ? " (favorable wind!)" : ""));
  } else {
    pushLog("Blocked.");
  }

  // Rare ocean hazards: a tornado or tsunami can strike while sailing,
  // dealing 50% of current HP to the whole party. The tornado also
  // wanders randomly on its own (visualized on the map), while the
  // tsunami is a one-off wave with no persistent presence.
  tryOceanHazard();
  tryPirateFlagTornado();

  // wandering sea creatures (Sea Serpent/Kraken/Merman) only ever spawn
  // through here — sailing bypasses move()'s own tryEncounter() call
  tryEncounter();
  tryPirateEncounter();
  stepMapMonsters();
  renderAll();
  return true;
}

// Finds a water tile just off the island's coastline (near the top of
// the map, so arriving still reads as "sailing in from the north") —
// used because the island's landmass is centered in a much larger grid
// now, so a fixed top-row arrival point would usually be far out at sea.
function findIslandArrivalSpot() {
  var midC = Math.floor(ISLAND_W / 2);
  for (var r = 1; r < ISLAND_H - 1; r++) {
    for (var dc = 0; dc < ISLAND_W; dc++) {
      var c = midC + (dc % 2 === 0 ? dc / 2 : -(dc + 1) / 2);
      if (c < 1 || c >= ISLAND_W - 1) continue;
      if (islandGrid[r][c] !== T.WATER) continue;
      // require it to actually be adjacent to land — real coastline, not
      // just any patch of open ocean
      var deltas = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      for (var i = 0; i < deltas.length; i++) {
        var rr = r + deltas[i][0], cc = c + deltas[i][1];
        if (islandGrid[rr] && islandGrid[rr][cc] === T.GRASS) return { x: c, y: r };
      }
    }
  }
  return { x: midC, y: 1 }; // fallback, shouldn't normally be hit
}

function move(dx, dy) {
  if (state.mode === "combat" || state.mode === "spaceflight" || townScreen || awaitingCannonDirection || confirmingCyberDrive) return;
  var facing = dx === -1 ? "W" : dx === 1 ? "E" : dy === -1 ? "N" : dy === 1 ? "S" : state.facing;
  state.facing = facing;

  // Sailing on open water: wind governs how far (and whether) this press
  // actually moves you. Land movement, boarding, and disembarking are
  // untouched — this only applies once you're already sailing.
  if (state.sailing) {
    var handled = sailingMove(dx, dy, facing);
    if (handled) return;
  }

  var nx = state.x + dx, ny = state.y + dy;
  var t = tileAt(nx, ny);

  if (t === T.DOOR) {
    if (state.mode === "town" || state.mode === "dungeon") {
      state.mode = "overworld";
      state.x = state.fromOverworld.x;
      state.y = state.fromOverworld.y;
      pushLog(facingWord(facing));
      renderAll();
      return;
    }
    if (state.mode === "islandTown") {
      state.mode = "island";
      state.x = state.fromIsland.x;
      state.y = state.fromIsland.y;
      pushLog(facingWord(facing));
      renderAll();
      return;
    }
    if (state.mode === "moonTown") {
      state.mode = "moon";
      state.x = state.fromMoon.x;
      state.y = state.fromMoon.y;
      pushLog(facingWord(facing));
      renderAll();
      return;
    }
    if (state.mode === "hutInterior" || state.mode === "churchInterior") {
      state.mode = state.fromBuilding.mode;
      state.x = state.fromBuilding.x;
      state.y = state.fromBuilding.y;
      pushLog(facingWord(facing));
      renderAll();
      return;
    }
  }
  // Auto-dismount at any town/castle gate — horses aren't allowed inside,
  // so park it right at the threshold (the tile you're standing on) and
  // walk in on foot.
  if (t === T.TOWN && state.mounted) {
    state.mounted = false;
    horse.owned = true;
    horse.screen = state.mode;
    horse.x = state.x; horse.y = state.y;
    pushLog("You leave your horse outside and enter on foot.");
  }

  if (t === T.TOWN && state.mode === "overworld") {
    state.fromOverworld = { x: state.x, y: state.y };
    state.mode = "town";
    state.x = 22; state.y = 38; // just inside the south gate
    pushLog("Enter town");
    autosave();
    renderAll();
    return;
  }
  if (t === T.TOWN && state.mode === "island") {
    state.fromIsland = { x: state.x, y: state.y };
    state.mode = "islandTown";
    state.x = 11; state.y = 16; // just inside the south gate
    pushLog("Enter town");
    autosave();
    renderAll();
    return;
  }
  if (t === T.PORTAL && state.mode === "island") {
    state.fromIsland = { x: state.x, y: state.y };
    state.mode = "moon";
    var moonMidR = Math.floor(MOON_H / 2), moonMidC = Math.floor(MOON_W / 2);
    state.x = moonMidC; state.y = moonMidR + 4;
    pushLog("The portal pulls you through... you arrive on a grey moon.");
    renderAll();
    return;
  }
  if (t === T.MOON_PORTAL && state.mode === "moon") {
    state.mode = "island";
    state.x = state.fromIsland.x; state.y = state.fromIsland.y;
    pushLog("The portal returns you to the island.");
    renderAll();
    return;
  }
  if (t === T.TOWN && state.mode === "moon") {
    state.fromMoon = { x: state.x, y: state.y };
    state.mode = "moonTown";
    state.x = 7; state.y = 10;
    pushLog("Enter Luna Station");
    autosave();
    renderAll();
    return;
  }
  if (t === T.DUNGEON && state.mode === "overworld") {
    state.fromOverworld = { x: state.x, y: state.y };
    state.mode = "dungeon";
    state.dungeonLevel = 1; // always re-enter at the top — walking out resets your depth
    var entryLevel = ensureDungeonLevel(1);
    var doorSpot = findTileOnGrid(entryLevel, T.DOOR);
    state.x = doorSpot.x; state.y = doorSpot.y;
    pushLog("Descend");
    autosave();
    renderAll();
    return;
  }
  if (t === T.STAIRS_DOWN && state.mode === "dungeon") {
    state.dungeonLevel += 1;
    var nextLevel = ensureDungeonLevel(state.dungeonLevel);
    var upSpot = findTileOnGrid(nextLevel, T.STAIRS_UP);
    state.x = upSpot.x; state.y = upSpot.y;
    pushLog("You descend to dungeon level " + state.dungeonLevel + ".");
    autosave();
    renderAll();
    return;
  }
  if (t === T.STAIRS_UP && state.mode === "dungeon") {
    state.dungeonLevel -= 1;
    var prevLevel = ensureDungeonLevel(state.dungeonLevel);
    var downSpot = findTileOnGrid(prevLevel, T.STAIRS_DOWN) || findTileOnGrid(prevLevel, T.DOOR);
    state.x = downSpot.x; state.y = downSpot.y;
    pushLog("You climb back to dungeon level " + state.dungeonLevel + ".");
    renderAll();
    return;
  }
  if (t === T.BOSS && state.mode === "dungeon") { openArchwizardBoss(); return; }
  if (t === T.ISLAND && state.mode === "overworld") {
    state.fromOverworld = { x: state.x, y: state.y };
    state.mode = "island";
    // arrive somewhere sailable near the island's own coastline (its
    // landmass is centered in a much bigger grid now, so the old fixed
    // "row 1" arrival point would usually land in open ocean)
    var arrival = findIslandArrivalSpot();
    state.x = arrival.x; state.y = arrival.y;
    pushLog("Landfall! A new island.");
    renderAll();
    return;
  }
  // Sailing off the edge of the island's own small grid takes you back out
  // to the open ocean of the main overworld, docking right at the spot
  // where you first made landfall.
  if (t === null && state.mode === "island" && state.sailing) {
    state.mode = "overworld";
    ship.owned = true;
    ship.screen = "overworld";
    ship.x = state.fromOverworld.x;
    ship.y = state.fromOverworld.y;
    state.x = state.fromOverworld.x;
    state.y = state.fromOverworld.y;
    state.sailing = true; // still aboard — arriving back on the open sea
    pushLog("You sail back out to open water.");
    renderAll();
    return;
  }
  if (t === T.SHOPKEEP) { openShop("weapon"); return; }
  if (t === T.ARMORY) { openShop("armor"); return; }
  if (t === T.KING) { openKing(); return; }
  if (t === T.CHEST) { openVaultChest(nx, ny); return; }
  if (t === T.HUT_NPC) { openHutGift(); return; }
  if (t === T.QUEST_BOY) { openQuestBoy(); return; }
  if (t === T.MOON_KING) { openMoonKing(); return; }
  if (state.mode === "hutInterior" && nx === HUT_PROP_TILE.x && ny === HUT_PROP_TILE.y) {
    // the dog itself is just a sighting, not something you can grab —
    // give the hut's kindly stranger a gift (see giveHutGift) to earn it
    if (state.inDogHut && !hasRescuedDog) {
      pushLog("A frightened dog watches you from the corner.");
      renderAll();
      return;
    }
  }
  if (t === T.STABLE) { openStable(); return; }
  if (t === T.MOON_SHOP) { openMoonShop(); return; }
  if (t === T.HUT) {
    state.fromBuilding = { mode: state.mode, x: state.x, y: state.y };
    state.inDogHut = state.mode === "overworld" && !!dogHutPos && nx === dogHutPos.x && ny === dogHutPos.y;
    state.inGearHut = state.mode === "overworld" && !!gearHutPos && nx === gearHutPos.x && ny === gearHutPos.y;
    state.inArmHut = state.mode === "overworld" && !!armHutPos && nx === armHutPos.x && ny === armHutPos.y;
    state.inLegHut = state.mode === "island" && !!legHutPos && nx === legHutPos.x && ny === legHutPos.y;
    state.mode = "hutInterior";
    state.x = 4; state.y = 6; // just inside the door
    pushLog("You step into the hut.");
    autosave();
    renderAll();
    return;
  }
  if (t === T.CHURCH) {
    state.fromBuilding = { mode: state.mode, x: state.x, y: state.y };
    state.mode = "churchInterior";
    state.x = 5; state.y = 7;
    pushLog("You step into the church.");
    autosave();
    renderAll();
    return;
  }
  if (t === T.GARDEN_FOUNTAIN) { drinkGardenFountain(); return; }
  if (t === T.MOAI) { pushLog("An ancient moai gazes back at you, weathered and silent."); renderAll(); return; }
  if (t === T.SHRINE) { pushLog("A small shrine. You bow your head for a moment of quiet."); renderAll(); return; }
  if (t === T.GRAVE) {
    if (nx === JESTER_GRAVE_POS.x && ny === JESTER_GRAVE_POS.y) {
      if (hasTeddyBear) {
        pushLog("The jester's grave. The soil here has been freshly turned.");
      } else if (hasShovel) {
        pushLog("A cracked headstone: \"HERE LIES THE ROYAL JESTER —");
        pushLog("HE WHO LAUGHED LAST.\" The ground looks freshly disturbed.");
        pushLog("(Dig here with ACTION.)");
      } else {
        pushLog("A cracked headstone: \"HERE LIES THE ROYAL JESTER —");
        pushLog("HE WHO LAUGHED LAST.\"");
      }
    } else {
      pushLog("A worn headstone. You can't make out the name.");
    }
    renderAll();
    return;
  }
  if (t === T.RED_TREE) {
    if (hasTreeHeart) {
      pushLog("A red stump, hollowed out where its heart once was.");
    } else if (hasAxe) {
      pushLog("A strange tree, its leaves a deep, unnatural red.");
      pushLog("(Chop it down with ACTION.)");
    } else {
      pushLog("A strange tree, its leaves a deep, unnatural red.");
    }
    renderAll();
    return;
  }
  if (t === T.ROBOT_KING) { openRobotKing(); return; }
  if (t === T.CYBER_DISC) { pushLog("A shattered optical disc glints in the light."); renderAll(); return; }
  if (t === T.CYBER_PHONE) { pushLog("An old touchscreen phone, its battery long dead."); renderAll(); return; }
  if (t === T.CYBER_TV) { pushLog("A boxy television flickers with static."); renderAll(); return; }
  if (t === T.CYBER_ANTENNA) { pushLog("A satellite dish tracks something far overhead."); renderAll(); return; }
  if (t === T.CYBER_PAGER) { pushLog("A pager beeps once, then falls silent."); renderAll(); return; }
  if (t === T.CYBER_DIAL) { pushLog("A trackball dial, worn smooth from use."); renderAll(); return; }
  if (t === T.CYBER_SLIDER) { pushLog("A slider control, stuck halfway."); renderAll(); return; }
  if (t === T.CYBER_PRINTER) { pushLog("An old printer hums, jammed mid-page."); renderAll(); return; }
  if (t === T.CYBER_CD) { pushLog("A stack of dusty CDs, unlabeled."); renderAll(); return; }
  if (t === T.INNKEEPER) {
    if (sharedGold >= 10) {
      sharedGold -= 10;
      party.forEach(function (p) { if (p.alive) p.hp = p.maxHp; });
      pushLog("Rested. -10G");
    } else {
      pushLog("Not enough gold");
    }
    renderAll();
    return;
  }
  if (t === T.TAVERN) { openTavern(); return; }
  if (t === T.FOUNTAIN) { openFountain(); return; }
  if (t === T.HEALER) { openHealer(); return; }
  if (t === T.HORSE) {
    pushLog("A wild horse! Get close and TAME it.");
    renderAll();
    return;
  }
  // Remounting any parked vehicle (horse/car/helicopter): check its
  // tracked position directly, same pattern as the ship.
  var remountCheck = [
    { type: "horse", obj: horse },
    { type: "car", obj: car },
    { type: "helicopter", obj: helicopter }
  ].find(function (v) {
    return v.obj.owned && !state.mounted && v.obj.screen === state.mode && v.obj.x === nx && v.obj.y === ny;
  });
  if (remountCheck) {
    state.mounted = true;
    state.vehicleType = remountCheck.type;
    var wrappedVeh = wrapPos(nx, ny);
    state.x = wrappedVeh.x; state.y = wrappedVeh.y;
    pushLog("You hop back on the " + remountCheck.type + ".");
    renderAll();
    return;
  }
  // Boarding the parked rocket: flies between the moon and Cyber World —
  // instant travel, no direction/movement involved like the ship. There's
  // only ever the one rocket, granted by the Moon King (see turnInRobotParts).
  if (rocket.owned && rocket.screen === state.mode && rocket.x === nx && rocket.y === ny) {
    if (state.mode === "cyber") {
      state.mode = "moon";
      state.x = ROCKET_MOON_PAD.x; state.y = ROCKET_MOON_PAD.y;
      rocket.screen = "moon";
      rocket.x = ROCKET_MOON_PAD.x; rocket.y = ROCKET_MOON_PAD.y;
      pushLog("The rocket carries you back to the moon.");
    } else {
      // outbound leg only — asks first, then plays the cyber-drive
      // flight sequence (see confirmCyberDriveYes) before actually
      // landing in Cyber World
      confirmingCyberDrive = true;
    }
    renderAll();
    return;
  }
  // Boarding your own ship: check its tracked position directly, since
  // the ship is drawn as a dynamic overlay and is never actually written
  // into the map grid itself.
  if (ship.owned && !state.sailing && ship.screen === state.mode && ship.x === nx && ship.y === ny) {
    state.sailing = true;
    var wrappedB = wrapPos(nx, ny);
    state.x = wrappedB.x; state.y = wrappedB.y;
    pushLog("You board the ship and set sail!");
    renderAll();
    return;
  }
  if (t === T.SHIP) {
    // any wild ship is freely boardable on sight — claim it into the
    // dynamic ship object and set sail immediately. Clear the static
    // landmark tile back to grass so it doesn't stay boardable forever
    // (this was creating infinite duplicate ships).
    var wrappedS = wrapPos(nx, ny);
    currentGrid()[wrappedS.y][wrappedS.x] = T.GRASS;
    ship.owned = true;
    ship.screen = state.mode;
    ship.x = wrappedS.x; ship.y = wrappedS.y;
    state.sailing = true;
    state.x = wrappedS.x; state.y = wrappedS.y;
    pushLog("You board the abandoned ship and set sail!");
    renderAll();
    return;
  }
  if (!isWalkable(t)) { pushLog(facingWord(facing)); renderAll(); return; }

  // Forest has a chance to "slip" — the step fails and you stay put,
  // same rule applies to wandering monsters for symmetry.
  if (t === T.FOREST && Math.random() < 0.5) {
    pushLog("Thick brush! " + facingWord(facing) + " (no progress)");
    if (state.mode === "overworld" || state.mode === "dungeon" || state.mode === "island") stepMapMonsters();
    renderAll();
    return;
  }

  // Disembarking: you're sailing and about to step onto solid ground —
  // the ship stays behind, parked at your current (water) tile, exactly
  // where you left it.
  if (state.sailing && t !== T.WATER && t !== T.ISLAND) {
    ship.owned = true;
    ship.screen = state.mode;
    ship.x = state.x; ship.y = state.y;
    state.sailing = false;
    pushLog("You disembark. The ship waits at the shore.");
  }

  var wrappedMove = wrapPos(nx, ny);
  state.x = wrappedMove.x; state.y = wrappedMove.y;
  pushLog(facingWord(facing));

  // mounted: on open ground (not forest, which is unreachable while
  // mounted anyway) take a second step in the same direction if possible
  if (state.mounted && (state.mode === "overworld" || state.mode === "island")) {
    var extraSteps = Math.floor(vehicleSpeed(state.vehicleType || "horse")) - 1; // total tiles minus the one already taken above
    for (var vs = 0; vs < extraSteps; vs++) {
      var nx2 = state.x + dx, ny2 = state.y + dy;
      var t2 = tileAt(nx2, ny2);
      var landsOnOwnedShip = ship.owned && !state.sailing && ship.screen === state.mode && ship.x === nx2 && ship.y === ny2;
      var landsOnOwnedVehicle = [horse, car, helicopter].some(function (v) {
        return v.owned && v.screen === state.mode && v.x === nx2 && v.y === ny2;
      });
      if (t2 !== null && isWalkable(t2) && !landsOnOwnedShip && !landsOnOwnedVehicle && t2 !== T.TOWN && t2 !== T.DUNGEON && t2 !== T.DOOR && t2 !== T.HORSE && t2 !== T.SHIP && t2 !== T.ISLAND) {
        var wrappedMount = wrapPos(nx2, ny2);
        state.x = wrappedMount.x; state.y = wrappedMount.y;
      } else {
        break; // stop early if blocked, don't skip past an obstacle
      }
    }
  }

  // ground item auto-notice (still requires ACTION to actually pick up)
  var here = groundItemAt(state.mode, state.x, state.y);
  if (here) {
    pushLog(here.kind === "gold" ? "Chest here. ACTION" : here.item.name + " here. ACTION");
  }

  if (state.mode === "overworld" || state.mode === "dungeon" || state.mode === "island") {
    tryEncounter();
    tryPirateEncounter();
    trySpawnWildHorse();
    tryVolcanoBurn();
    stepMapMonsters();
  } else if (state.mode === "moon") {
    tryAlienEncounter();
    tryVolcanoBurn();
  } else if (state.mode === "cyber") {
    tryZombieEncounter();
  } else if (state.mode === "town" || state.mode === "islandTown") {
    stepAllRoamingEntities();
    // the tavern keeper talks to you as soon as you're next to (or bump
    // into) them — no need to press ACTION, unlike the other shopkeepers
    var tavernNpc = roamingNpcAdjacent();
    if (tavernNpc && tavernNpc.kind === "tavern") { openTavern(); return; }
  }
  renderAll();
}

// Guards only show up for an actual reason now — stealing from the
// vault (openVaultChest) or attacking a townsperson (see the ATTACK
// button below) — never as a random ambient encounter.
function triggerGuards() {
  pushLog("Guards rush in!");
  var group = buildMonsterGroup(GUARD_DEF, true);
  enterArena(group, state.mode, "guard");
}

// ============================================================
// COMMANDS
// ============================================================
// ACTION replaces the old single-purpose GET button: it looks at
// everything possible right here (talk to an adjacent shopkeeper, get an
// item/open a chest underfoot) and either just does the one thing that's
// possible, or — if more than one applies — pops up a small choice list.
function pickUpGroundItem() {
  var here = groundItemAt(state.mode, state.x, state.y);
  if (!here) return;
  if (here.kind === "gold") {
    var g = 5 + Math.floor(Math.random() * 20);
    sharedGold += g;
    pushLog("Found " + g + " gold!");
  } else if (here.category === "potion" || here.category === "weapon" || here.category === "armor") {
    addToInventory(here.category, here.item);
  }
  removeGroundItem(here);
  renderAll();
}

function talkToNpc(npc) {
  if (npc.kind === "tavern") { openTavern(); return; }
  openShop(npc.kind === "armory" ? "armor" : "weapon");
}

function cmdAction() {
  if (townScreen || confirmingRun) return;
  var choices = [];
  var npc = roamingNpcAdjacent();
  if (npc) {
    var npcLabel = npc.kind === "tavern" ? "Talk to the tavern keeper"
      : npc.kind === "armory" ? "Talk to the armorer"
      : "Talk to the weaponsmith";
    choices.push({ label: npcLabel, fn: function () { talkToNpc(npc); } });
  }
  if (isAdjacentToJesterGrave() && hasShovel && !hasTeddyBear) {
    choices.push({ label: "Dig at the grave", fn: digJesterGrave });
  }
  if (isAdjacentToRedTree() && hasAxe && !hasTreeHeart) {
    choices.push({ label: "Chop the red tree", fn: chopRedTree });
  }
  var here = groundItemAt(state.mode, state.x, state.y);
  if (here) {
    var itemLabel = here.kind === "gold" ? "Open chest" : "Get " + here.item.name;
    choices.push({ label: itemLabel, fn: pickUpGroundItem });
  }
  if (choices.length === 0) { pushLog("Nothing to do here."); renderAll(); return; }
  if (choices.length === 1) { choices[0].fn(); return; }
  actionChoices = choices;
  renderAll();
}

// ============================================================
// ACTION CHOICE POPUP — shown only when more than one thing is
// possible right here; a single available action just happens directly.
// ============================================================
function actionChoiceRects() {
  var n = actionChoices.length;
  var boxW = 260, rowH = 32, padTop = 40, padBottom = 16;
  var boxH = padTop + n * rowH + padBottom;
  var boxX = LW / 2 - boxW / 2, boxY = LH / 2 - boxH / 2;
  var rows = [];
  for (var i = 0; i < n; i++) {
    rows.push({ x: boxX + 16, y: boxY + padTop + i * rowH, w: boxW - 32, h: rowH - 8 });
  }
  return {
    box: { x: boxX, y: boxY, w: boxW, h: boxH },
    close: { x: boxX + boxW - 30, y: boxY + 6, w: 24, h: 24 },
    rows: rows
  };
}

function renderActionChoiceOverlay() {
  var r = actionChoiceRects();
  px(r.box.x, r.box.y, r.box.w, r.box.h, "#0a0a0a");
  ctx.strokeStyle = PAL.purple;
  ctx.lineWidth = 3;
  ctx.strokeRect(r.box.x, r.box.y, r.box.w, r.box.h);

  drawCloseX(r.close);

  ctx.textAlign = "center";
  ctx.fillStyle = PAL.white;
  ctx.font = "bold 13px 'Courier New', monospace";
  ctx.fillText("What do you want to do?", r.box.x + r.box.w / 2, r.box.y + 24);
  ctx.font = "12px 'Courier New', monospace";

  actionChoices.forEach(function (c, i) {
    var row = r.rows[i];
    ctx.strokeStyle = PAL.purple;
    ctx.lineWidth = 1;
    ctx.strokeRect(row.x, row.y, row.w, row.h);
    ctx.fillStyle = PAL.white;
    ctx.fillText(c.label, row.x + row.w / 2, row.y + row.h / 2 + 4);
  });
  ctx.textAlign = "left";
}

function handleActionChoiceTap(lx, ly) {
  var r = actionChoiceRects();
  if (inRect(lx, ly, r.close)) { actionChoices = null; renderAll(); return; }
  for (var i = 0; i < r.rows.length; i++) {
    if (inRect(lx, ly, r.rows[i])) {
      var fn = actionChoices[i].fn;
      actionChoices = null;
      fn();
      return;
    }
  }
}

function cmdCast() {
  if (townScreen || confirmingRun) return;
  var wiz = party[2];
  if (!wiz.alive || wiz.mana < 3) { pushLog(wiz.name + " cannot cast"); renderAll(); return; }
  if (state.mode === "combat" && combat) {
    wiz.mana -= 3;
    var target = nearestMonsterTo(wiz.ax, wiz.ay);
    if (target) {
      var dmg = 4 + Math.floor(Math.random() * 6);
      target.hp -= dmg;
      pushLog(wiz.name + " casts Missile at " + target.name + "!");
      pushLog(target.name + " takes " + dmg + " dmg");
      if (target.hp <= 0) {
        pushLog(target.name + " destroyed!");
        registerKill(target, 2);
      }
      combatTick(2);
    }
  } else {
    wiz.mana -= 3;
    pushLog(wiz.name + " casts Light");
    renderAll();
  }
}

function cmdMenu() {
  if (townScreen || confirmingRun || characterSheetIndex !== null || state.mode === "spaceflight") return;
  menuScreen = "main";
  renderAll();
}

// ============================================================
// SAVE / LOAD — 3 named browser-storage slots, plus a silent autosave
// to whichever slot was last used, triggered on entering any building
// or dungeon. There's no server or real filesystem here, so "a file the
// player names" becomes a named localStorage slot instead.
// ============================================================
var currentSlot = null; // null | 1 | 2 | 3 — last slot manually saved/loaded
var SAVE_KEY_PREFIX = "bramble_save_";

function slotKey(n) { return SAVE_KEY_PREFIX + n; }

function readSlot(n) {
  try {
    var raw = localStorage.getItem(slotKey(n));
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function gatherSaveData() {
  return {
    party: party, sharedGold: sharedGold, inventory: inventory,
    state: state, ship: ship, horse: horse, car: car, helicopter: helicopter, rocket: rocket,
    tavernRecruit: tavernRecruit, monsterKillCounts: monsterKillCounts, wind: wind,
    alienEncountersWon: alienEncountersWon, alienQuestComplete: alienQuestComplete,
    hasWizardsWand: hasWizardsWand, wizardQuestComplete: wizardQuestComplete,
    dogQuestStarted: dogQuestStarted, dogQuestComplete: dogQuestComplete, hasRescuedDog: hasRescuedDog,
    gearQuestActivated: gearQuestActivated, hasGearPart: hasGearPart,
    hasShovel: hasShovel, hasTeddyBear: hasTeddyBear,
    armQuestActivated: armQuestActivated, hasArmPart: hasArmPart,
    hasAxe: hasAxe, hasTreeHeart: hasTreeHeart,
    legQuestActivated: legQuestActivated, hasLegPart: hasLegPart,
    seaCreatureKillsForQuest: seaCreatureKillsForQuest, hasTrident: hasTrident, hasKrakenSkull: hasKrakenSkull,
    thiefKingQuestStarted: thiefKingQuestStarted, hasPirateFlag: hasPirateFlag,
    futureManComplete: futureManComplete, hasCyberRocket: hasCyberRocket,
    cyberWeaponsGiven: cyberWeaponsGiven
  };
}

function applySaveData(d) {
  party = d.party;
  sharedGold = d.sharedGold;
  inventory = d.inventory || [];
  // Old saves (from before potions moved into the shared inventory)
  // carry a flat potionCount instead of potion entries — convert it so
  // those potions aren't just lost.
  if (d.potionCount) {
    for (var pc = 0; pc < d.potionCount; pc++) {
      inventory.push({ category: "potion", item: { name: "Potion", heal: 20 } });
    }
  }
  state = d.state;
  ship = d.ship; horse = d.horse; car = d.car; helicopter = d.helicopter; rocket = d.rocket;
  tavernRecruit = d.tavernRecruit || null;
  monsterKillCounts = d.monsterKillCounts || {};
  wind = d.wind || { dir: "N", movesLeft: 5 };
  alienEncountersWon = d.alienEncountersWon || 0;
  alienQuestComplete = !!d.alienQuestComplete;
  hasWizardsWand = !!d.hasWizardsWand;
  wizardQuestComplete = !!d.wizardQuestComplete;
  dogQuestStarted = !!d.dogQuestStarted;
  dogQuestComplete = !!d.dogQuestComplete;
  hasRescuedDog = !!d.hasRescuedDog;
  gearQuestActivated = !!d.gearQuestActivated;
  hasGearPart = !!d.hasGearPart;
  hasShovel = !!d.hasShovel;
  hasTeddyBear = !!d.hasTeddyBear;
  armQuestActivated = !!d.armQuestActivated;
  hasArmPart = !!d.hasArmPart;
  hasAxe = !!d.hasAxe;
  hasTreeHeart = !!d.hasTreeHeart;
  legQuestActivated = !!d.legQuestActivated;
  hasLegPart = !!d.hasLegPart;
  seaCreatureKillsForQuest = d.seaCreatureKillsForQuest || 0;
  hasTrident = !!d.hasTrident;
  hasKrakenSkull = !!d.hasKrakenSkull;
  thiefKingQuestStarted = !!d.thiefKingQuestStarted;
  hasPirateFlag = !!d.hasPirateFlag;
  // the quest tornado isn't itself persisted (see `tornadoes`, which
  // isn't saved at all) — re-add it here so it's still findable on load
  if (thiefKingQuestStarted && !hasPirateFlag && PIRATE_TORNADO_POS) {
    tornadoes.push({ x: PIRATE_TORNADO_POS.x, y: PIRATE_TORNADO_POS.y, screen: "overworld", isQuestTornado: true });
  }
  futureManComplete = !!d.futureManComplete;
  hasCyberRocket = !!d.hasCyberRocket;
  cyberWeaponsGiven = !!d.cyberWeaponsGiven;
  // Old saves (from before the 8-level dungeon rework) have no
  // dungeonLevel at all. Most of the time that's harmless — it just
  // gets set to 1 the next time they walk into the dungeon tile — but a
  // save made WHILE standing in the old single-room dungeon would leave
  // state.mode === "dungeon" with dungeonLevel undefined, which
  // generates a level with no door back out. Snap that case back to a
  // safe, valid spot instead of trapping them.
  if (state.mode === "dungeon" && !state.dungeonLevel) {
    state.dungeonLevel = 1;
    var legacyLevel1 = ensureDungeonLevel(1);
    var legacyDoor = findTileOnGrid(legacyLevel1, T.DOOR);
    state.x = legacyDoor.x; state.y = legacyDoor.y;
    pushLog("(Your old save's dungeon depth wasn't tracked — placed you back at the entrance.)");
  }
}

function saveToSlot(n, name) {
  var payload = { name: name, savedAt: Date.now(), data: gatherSaveData() };
  try {
    localStorage.setItem(slotKey(n), JSON.stringify(payload));
    currentSlot = n;
    pushLog("Saved to slot " + n + " (\"" + name + "\").");
  } catch (e) {
    pushLog("Save failed — your browser may be blocking storage.");
  }
  renderAll();
}

function loadFromSlot(n) {
  var payload = readSlot(n);
  if (!payload) { pushLog("Slot " + n + " is empty."); renderAll(); return; }
  applySaveData(payload.data);
  currentSlot = n;
  menuScreen = null;
  pushLog("Loaded \"" + payload.name + "\" from slot " + n + ".");
  renderAll();
}

function promptSaveSlot(n) {
  var existing = readSlot(n);
  var defaultName = existing ? existing.name : ("Save " + n);
  var name = window.prompt("Name this save:", defaultName);
  if (name === null) return; // cancelled
  name = name.trim() || defaultName;
  saveToSlot(n, name);
}

// Silent autosave into whichever slot the player last saved/loaded —
// does nothing until they've saved at least once, so it never forces a
// naming prompt mid-adventure.
function autosave() {
  if (currentSlot === null) return;
  var existing = readSlot(currentSlot);
  var name = existing ? existing.name : "Autosave";
  var payload = { name: name, savedAt: Date.now(), data: gatherSaveData() };
  try { localStorage.setItem(slotKey(currentSlot), JSON.stringify(payload)); } catch (e) { /* ignore */ }
}

// MENU OVERLAY — save/load, 3 slots

function renderMenuOverlay() {

function handleMenuTap(lx, ly) {

var confirmingRun = false;
var awaitingCannonDirection = false; // true while the "which way?" prompt is up
var awaitingShotDirection = false; // same idea, but for the Bow/Boomerang inside combat

function cmdFire() {
  if (townScreen || confirmingRun) return;
  if (state.mode === "spaceflight") { spaceFire(); return; }
  if (!state.sailing || state.mode === "combat") { pushLog("No cannon to fire here."); renderAll(); return; }
  awaitingCannonDirection = true;
  pushLog("Fire! Choose a direction (arrow keys).");
  renderAll();
}

function cmdDismount() {
  if (townScreen || confirmingRun || state.mode === "combat") return;
  if (!state.mounted) { pushLog("Not mounted."); renderAll(); return; }
  var vType = state.vehicleType || "horse";
  var vObj = vehicleObj(vType);
  state.mounted = false;
  state.vehicleType = null;
  vObj.owned = true;
  vObj.screen = state.mode;
  vObj.x = state.x; vObj.y = state.y;
  pushLog("You dismount. The " + vType + " waits here.");
  renderAll();
}

// Fires the cannon in the given direction: 6-tile range, hits the first
// wandering monster in a straight line (only aquatic monsters/pirates are
// ever actually out on the water to hit), heavy damage.
function fireCannon(dir) {
  awaitingCannonDirection = false;
  var deltas = { N: [0, -1], S: [0, 1], E: [1, 0], W: [-1, 0] };
  var d = deltas[dir];
  if (!d) { renderAll(); return; }
  var hitMonster = null;
  for (var step = 1; step <= 6; step++) {
    var cx = state.x + d[0] * step, cy = state.y + d[1] * step;
    var found = mapMonsters.find(function (m) {
      return m.screen === state.mode && m.x === cx && m.y === cy;
    });
    if (found) { hitMonster = found; break; }
  }
  pushLog("BOOM! Cannon fires " + facingWord(dir) + ".");
  if (!hitMonster) {
    pushLog("The shot splashes into the sea.");
    renderAll();
    return;
  }
  if (hitMonster.name === "Kraken") {
    var wieldingTrident = party[0].equippedWeapon && party[0].equippedWeapon.name === TRIDENT.name;
    if (!wieldingTrident) {
      pushLog("The cannonball bounces harmlessly off its ancient hide!");
      renderAll();
      return;
    }
    pushLog("You hurl the trident instead — a direct hit!");
    mapMonsters = mapMonsters.filter(function (m) { return m !== hitMonster; });
    enterArena([makeMonsterInstance(KRAKEN_KING_DEF, 0, 0)], state.mode, "krakenBoss", "coastal");
    return;
  }
  // resolve as an instant, decisive kill-oriented hit: pull it straight
  // into a one-monster arena fight, already heavily damaged, so a good
  // cannon shot can end the fight in a hit or two
  var def = findMonsterDef(hitMonster.name);
  if (!def) { renderAll(); return; }
  var instance = makeMonsterInstance(def, 0, 0);
  var cannonDmg = 14 + Math.floor(Math.random() * 10);
  instance.hp -= cannonDmg;
  pushLog("Direct hit! " + hitMonster.name + " takes " + cannonDmg + " cannon damage!");
  // remove it from the wandering list either way — it's now either dead
  // or about to fight you at point-blank range
  mapMonsters = mapMonsters.filter(function (m) { return m !== hitMonster; });
  if (instance.hp <= 0) {
    pushLog(hitMonster.name + " is destroyed by the blast!");
    var g = rollRange(instance.gold);
    sharedGold += g;
    pushLog("+" + g + "g salvaged from the wreck.");
    renderAll();
    return;
  }
  enterArena([instance], state.mode, null, hitMonster.aquatic ? "coastal" : null);
}

function cmdRun() {
  if (townScreen) return;
  if (state.mode !== "combat") { pushLog("Nothing to run from"); renderAll(); return; }
  confirmingRun = true;
  renderAll();
}

function confirmRunYes() {
  confirmingRun = false;
  if (Math.random() < 0.6) {
    var tier = combat.monsters[0] ? combat.monsters[0].tier : 0;
    var lootPct = 0.10 + Math.min(0.10, tier * 0.03); // 10-20%+ scaling with tier
    var lost = Math.floor(sharedGold * lootPct);
    sharedGold -= lost;
    pushLog("Escaped! Monsters loot " + lost + "g.");
    state.mode = combat.returnMode;
    combat = null;
  } else {
    pushLog("Cannot escape!");
    combatTick(-1); // -1: no party member "acted" this tick, everyone auto-acts
    return;
  }
  renderAll();
}

function confirmRunNo() {
  confirmingRun = false;
  renderAll();
}

// ============================================================
// CYBER DRIVE — boarding the rocket on the moon asks first, then plays a
// short flash transition and a real (but unloseable) space-flight
// mini-game — fly + dodge/shoot asteroids — before actually landing in
// Cyber World. The return trip (cyber -> moon) stays instant, as before.
// ============================================================
var confirmingCyberDrive = false;
var spaceTransition = null; // { startedAt } while the flash-transition effect plays
var CYBER_FLASH_MS = 900;

var spaceship = null;      // { x, y, angle, vx, vy, thrustFlashUntil, hitFlashUntil }
var spaceAsteroids = [];
var spaceBullets = [];
var spaceStars = [];
var spaceTimeLeft = 0;
var spaceRunning = false;
var lastSpaceTick = 0;
var spaceLastFire = 0;
var SPACEFLIGHT_MS = 13000;
var SHIP_TURN = 0.32;
var SHIP_THRUST = 0.9;
var SHIP_DRAG = 0.985;
var SHIP_MAX_SPEED = 4.2;
var SPACE_FIRE_COOLDOWN_MS = 220;

function renderCyberDriveConfirmDialog() {
  var r = runConfirmRects();
  px(r.box.x, r.box.y, r.box.w, r.box.h, "#0a0a0a");
  ctx.strokeStyle = PAL.purple;
  ctx.lineWidth = 3;
  ctx.strokeRect(r.box.x, r.box.y, r.box.w, r.box.h);

  ctx.strokeStyle = PAL.red;
  ctx.lineWidth = 2;
  ctx.strokeRect(r.close.x, r.close.y, r.close.w, r.close.h);
  ctx.beginPath();
  ctx.moveTo(r.close.x + 5, r.close.y + 5); ctx.lineTo(r.close.x + r.close.w - 5, r.close.y + r.close.h - 5);
  ctx.moveTo(r.close.x + r.close.w - 5, r.close.y + 5); ctx.lineTo(r.close.x + 5, r.close.y + r.close.h - 5);
  ctx.stroke();

  ctx.textAlign = "center";
  ctx.fillStyle = PAL.white;
  ctx.font = "bold 13px 'Courier New', monospace";
  ctx.fillText("Engage the cyber drive?", r.box.x + r.box.w / 2, r.box.y + 34);
  ctx.font = "11px 'Courier New', monospace";
  ctx.fillStyle = PAL.gray;
  ctx.fillText("A wild flight through space to Cyber World.", r.box.x + r.box.w / 2, r.box.y + 54);

  ctx.strokeStyle = PAL.green;
  ctx.strokeRect(r.yes.x, r.yes.y, r.yes.w, r.yes.h);
  ctx.fillStyle = PAL.green;
  ctx.font = "bold 13px 'Courier New', monospace";
  ctx.fillText("YES", r.yes.x + r.yes.w / 2, r.yes.y + 21);

  ctx.strokeStyle = PAL.red;
  ctx.strokeRect(r.no.x, r.no.y, r.no.w, r.no.h);
  ctx.fillStyle = PAL.red;
  ctx.fillText("NO", r.no.x + r.no.w / 2, r.no.y + 21);
  ctx.textAlign = "left";
}

function handleCyberDriveConfirmTap(lx, ly) {
  var r = runConfirmRects();
  if (inRect(lx, ly, r.close) || inRect(lx, ly, r.no)) { confirmCyberDriveNo(); return; }
  if (inRect(lx, ly, r.yes)) { confirmCyberDriveYes(); return; }
}

function confirmCyberDriveNo() {
  confirmingCyberDrive = false;
  renderAll();
}

function confirmCyberDriveYes() {
  confirmingCyberDrive = false;
  pushLog("Engaging the cyber drive...");
  initSpaceflightState();
  spaceTransition = { startedAt: performance.now() };
  requestAnimationFrame(cyberFlashTick);
}

// Strobes between the world you're leaving (rendered normally beneath
// this, every other frame) and a static preview of the space scene —
// literally "flashing between the current world and the new world."
function cyberFlashTick() {
  var elapsed = performance.now() - spaceTransition.startedAt;
  if (elapsed >= CYBER_FLASH_MS) {
    spaceTransition = null;
    enterSpaceflight();
    return;
  }
  renderAll();
  requestAnimationFrame(cyberFlashTick);
}

function renderCyberFlash() {
  var elapsed = performance.now() - spaceTransition.startedAt;
  var showSpace = Math.floor(elapsed / 90) % 2 === 1;
  if (showSpace) renderSpaceflightScreen();
}

function initSpaceflightState() {
  spaceship = { x: LW / 2, y: LH - 60, angle: -Math.PI / 2, vx: 0, vy: 0, thrustFlashUntil: 0, hitFlashUntil: 0 };
  spaceAsteroids = [];
  for (var i = 0; i < 7; i++) spaceAsteroids.push(makeSpaceAsteroid());
  spaceBullets = [];
  spaceTimeLeft = SPACEFLIGHT_MS;
  spaceStars = [];
  for (var s = 0; s < 40; s++) {
    spaceStars.push({ x: Math.random() * LW, y: Math.random() * LH, r: Math.random() < 0.2 ? 2 : 1 });
  }
}

function makeSpaceAsteroid(size) {
  size = size || "large";
  var r = size === "large" ? 26 : size === "medium" ? 16 : 9;
  var jag = [];
  for (var j = 0; j < 8; j++) jag.push(0.75 + Math.random() * 0.4);
  var ang = Math.random() * Math.PI * 2;
  var spd = 0.3 + Math.random() * 0.5;
  return {
    x: Math.random() * LW, y: Math.random() * (LH * 0.6),
    vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
    r: r, size: size, jag: jag, spin: (Math.random() - 0.5) * 0.02, rot: 0
  };
}

function spaceTurnLeft() { if (state.mode === "spaceflight" && spaceship) spaceship.angle -= SHIP_TURN; }
function spaceTurnRight() { if (state.mode === "spaceflight" && spaceship) spaceship.angle += SHIP_TURN; }

function spaceThrust() {
  if (state.mode !== "spaceflight" || !spaceship) return;
  spaceship.vx += Math.cos(spaceship.angle) * SHIP_THRUST;
  spaceship.vy += Math.sin(spaceship.angle) * SHIP_THRUST;
  spaceship.thrustFlashUntil = performance.now() + 200;
}

function spaceFire() {
  if (state.mode !== "spaceflight" || !spaceship) return;
  var now = performance.now();
  if (now - spaceLastFire < SPACE_FIRE_COOLDOWN_MS) return;
  spaceLastFire = now;
  spaceBullets.push({
    x: spaceship.x + Math.cos(spaceship.angle) * 14,
    y: spaceship.y + Math.sin(spaceship.angle) * 14,
    vx: Math.cos(spaceship.angle) * 7 + spaceship.vx,
    vy: Math.sin(spaceship.angle) * 7 + spaceship.vy,
    startedAt: now
  });
}

function enterSpaceflight() {
  state.mode = "spaceflight";
  spaceRunning = true;
  lastSpaceTick = performance.now();
  pushLog("You blast off into the void toward Cyber World!");
  requestAnimationFrame(spaceflightTick);
}

function spaceflightTick(now) {
  if (!spaceRunning) return;
  var dt = Math.min(now - lastSpaceTick, 50);
  lastSpaceTick = now;
  spaceTimeLeft -= dt;

  spaceship.vx *= SHIP_DRAG; spaceship.vy *= SHIP_DRAG;
  var sp = Math.sqrt(spaceship.vx * spaceship.vx + spaceship.vy * spaceship.vy);
  if (sp > SHIP_MAX_SPEED) { spaceship.vx = spaceship.vx / sp * SHIP_MAX_SPEED; spaceship.vy = spaceship.vy / sp * SHIP_MAX_SPEED; }
  spaceship.x += spaceship.vx * (dt / 16.67);
  spaceship.y += spaceship.vy * (dt / 16.67);
  if (spaceship.x < 0) spaceship.x += LW; else if (spaceship.x > LW) spaceship.x -= LW;
  if (spaceship.y < 0) spaceship.y += LH; else if (spaceship.y > LH) spaceship.y -= LH;

  spaceAsteroids.forEach(function (a) {
    a.x += a.vx * (dt / 16.67); a.y += a.vy * (dt / 16.67);
    a.rot += a.spin * dt;
    if (a.x < -a.r) a.x = LW + a.r; else if (a.x > LW + a.r) a.x = -a.r;
    if (a.y < -a.r) a.y = LH + a.r; else if (a.y > LH + a.r) a.y = -a.r;
  });

  spaceBullets = spaceBullets.filter(function (b) { return now - b.startedAt < 900; });
  spaceBullets.forEach(function (b) {
    b.x += b.vx * (dt / 16.67); b.y += b.vy * (dt / 16.67);
  });

  for (var bi = spaceBullets.length - 1; bi >= 0; bi--) {
    var b = spaceBullets[bi];
    for (var ai = spaceAsteroids.length - 1; ai >= 0; ai--) {
      var a2 = spaceAsteroids[ai];
      var dx = b.x - a2.x, dy = b.y - a2.y;
      if (dx * dx + dy * dy < a2.r * a2.r) {
        spaceBullets.splice(bi, 1);
        breakSpaceAsteroid(ai);
        break;
      }
    }
  }

  // ship-asteroid contact just bounces you off — a real hazard to dodge,
  // but never a fail state or lost hp
  spaceAsteroids.forEach(function (a) {
    var dx = spaceship.x - a.x, dy = spaceship.y - a.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var minDist = a.r + 8;
    if (dist < minDist && dist > 0.01) {
      var nx = dx / dist, ny = dy / dist;
      spaceship.x += nx * (minDist - dist); spaceship.y += ny * (minDist - dist);
      spaceship.vx = nx * 2.5; spaceship.vy = ny * 2.5;
      if (now > (spaceship.hitFlashUntil || 0)) pushLog("You clip an asteroid — the ship shudders!");
      spaceship.hitFlashUntil = now + 500;
    }
  });

  while (spaceAsteroids.length < 5) spaceAsteroids.push(makeSpaceAsteroid());

  renderAll();

  if (spaceTimeLeft <= 0) {
    spaceRunning = false;
    finishSpaceflight();
    return;
  }
  requestAnimationFrame(spaceflightTick);
}

function breakSpaceAsteroid(idx) {
  var a = spaceAsteroids[idx];
  spaceAsteroids.splice(idx, 1);
  if (a.size === "large") {
    spaceAsteroids.push(makeSpaceAsteroid("medium"));
    spaceAsteroids.push(makeSpaceAsteroid("medium"));
  } else if (a.size === "medium") {
    spaceAsteroids.push(makeSpaceAsteroid("small"));
    spaceAsteroids.push(makeSpaceAsteroid("small"));
  }
}

function finishSpaceflight() {
  state.mode = "cyber";
  state.x = CYBER_LANDING_PAD.x; state.y = CYBER_LANDING_PAD.y;
  rocket.screen = "cyber";
  rocket.x = CYBER_LANDING_PAD.x; rocket.y = CYBER_LANDING_PAD.y;
  pushLog("You break atmosphere and land safely in Cyber World!");
  renderAll();
}

function renderSpaceflightScreen() {
  px(0, 0, LW, LH, "#04040c");
  ctx.fillStyle = "#ffffff";
  spaceStars.forEach(function (st) { ctx.fillRect(st.x, st.y, st.r, st.r); });

  spaceAsteroids.forEach(drawSpaceAsteroid);

  ctx.fillStyle = "#ffe066";
  spaceBullets.forEach(function (b) { ctx.fillRect(b.x - 1, b.y - 1, 3, 3); });

  drawSpaceship(spaceship);

  ctx.textAlign = "center";
  ctx.fillStyle = "#39ff88";
  ctx.font = "bold 13px 'Courier New', monospace";
  ctx.fillText("ENGAGING CYBER DRIVE", LW / 2, 20);
  ctx.font = "11px 'Courier New', monospace";
  ctx.fillStyle = "#aaaaaa";
  var secs = Math.max(0, Math.ceil((spaceTimeLeft || 0) / 1000));
  ctx.fillText("Arriving in " + secs + "s -- dodge & shoot the asteroids!", LW / 2, 36);
  ctx.textAlign = "left";
}

function drawSpaceAsteroid(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rot);
  ctx.fillStyle = "#8a7a6a";
  ctx.strokeStyle = "#4a3f36";
  ctx.lineWidth = 1;
  ctx.beginPath();
  var n = a.jag.length;
  for (var i = 0; i < n; i++) {
    var ang = (i / n) * Math.PI * 2;
    var rr = a.r * a.jag[i];
    var jx = Math.cos(ang) * rr, jy = Math.sin(ang) * rr;
    if (i === 0) ctx.moveTo(jx, jy); else ctx.lineTo(jx, jy);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawSpaceship(sh) {
  if (!sh) return;
  ctx.save();
  ctx.translate(sh.x, sh.y);
  ctx.rotate(sh.angle + Math.PI / 2);
  var flashing = performance.now() < (sh.hitFlashUntil || 0);
  ctx.fillStyle = flashing ? "#ff5555" : "#66ccff";
  ctx.beginPath();
  ctx.moveTo(0, -10);
  ctx.lineTo(7, 9);
  ctx.lineTo(0, 5);
  ctx.lineTo(-7, 9);
  ctx.closePath();
  ctx.fill();
  if (performance.now() < (sh.thrustFlashUntil || 0)) {
    ctx.fillStyle = "#ff9933";
    ctx.beginPath();
    ctx.moveTo(-3, 9); ctx.lineTo(3, 9); ctx.lineTo(0, 16);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// ============================================================
// TOWN SERVICES — shop, tavern (recruit/retire), fountain (heal/revive)
// ============================================================
var townScreen = null; // null | "shop" | "tavern" | "fountain"
var characterSheetIndex = null; // null | index into party[] — set to open the character sheet overlay
var equipPickerFor = null; // null | { idx, category: "weapon"|"armor" } — drills down from the character sheet
var potionPickerFor = null; // null | idx into party[] — drills down from the character sheet, picks a potion to drink
var menuScreen = null; // null | "main" — the save/load menu opened from the MENU button
var actionChoices = null; // null | [{ label, fn }] — the small popup the ACTION button shows when more than one thing is possible here
var tavernRecruit = null;

// Shared party inventory — weapons/armor/potions go here on pickup or
// purchase instead of auto-equipping/auto-using; any character can equip
// gear or drink a potion from their own character sheet.
var inventory = []; // [{ category: "weapon"|"armor"|"potion", item }]
inventory.push({ category: "potion", item: { name: "Potion", heal: 20 } });
inventory.push({ category: "potion", item: { name: "Potion", heal: 20 } });

var RACES = ["Human", "Elf", "Dwarf", "Halfling", "Gnome"];
var CLASSES = [
  { code: "FTR", label: "Fighter" },
  { code: "CLR", label: "Cleric" },
  { code: "WIZ", label: "Wizard" },
  { code: "THF", label: "Thief" },
  { code: "BRB", label: "Barbarian" },
  { code: "RNG", label: "Ranger" }
];
function classLabel(code) {
  for (var i = 0; i < CLASSES.length; i++) if (CLASSES[i].code === code) return CLASSES[i].label;
  return code;
}

// spells known per class — flavor + the mana cost of each cast action
var SPELLS = {
  FTR: [],
  CLR: [{ name: "Bless", cost: 4 }, { name: "Mend Wounds", cost: 6 }],
  WIZ: [{ name: "Missile", cost: 3 }, { name: "Light", cost: 3 }],
  THF: [],
  BRB: [],
  RNG: [{ name: "Hunter's Mark", cost: 5 }]
};

// class icon shown on the character sheet, gender-matched; Cleric splits
// between a devotional (turban) and a meditative (lotus) look at random,
// picked once per character rather than re-rolled on every render
function pickClassEmoji(cls, gender) {
  var isFemale = gender === "f";
  if (cls === "CLR") {
    return Math.random() < 0.5
      ? (isFemale ? "👳‍♀️" : "👳‍♂️")
      : (isFemale ? "🧘‍♀️" : "🧘‍♂️");
  }
  var table = {
    FTR: { m: "🤼‍♂️", f: "🤼‍♀️" },
    WIZ: { m: "🧙‍♂️", f: "🧙‍♀️" },
    THF: { m: "🥷", f: "🥷" },
    BRB: { m: "🏋️‍♂️", f: "🏋️‍♀️" },
    RNG: { m: "🦸‍♂️", f: "🦸‍♀️" }
  };
  var entry = table[cls];
  return entry ? (isFemale ? entry.f : entry.m) : "";
}

var NAME_POOL = ["Alaric", "Brynn", "Corwin", "Dara", "Edric", "Fenna", "Garrick", "Hale", "Isolde", "Jorah"];

function generateRecruit() {
  var cls = CLASSES[Math.floor(Math.random() * CLASSES.length)];
  var race = RACES[Math.floor(Math.random() * RACES.length)];
  var name = NAME_POOL[Math.floor(Math.random() * NAME_POOL.length)];
  var gender = Math.random() < 0.5 ? "m" : "f";
  var isCaster = cls.code === "CLR" || cls.code === "WIZ";
  var maxHp = 14 + Math.floor(Math.random() * 14);
  return {
    name: name, cls: cls.code, clsLabel: cls.label, race: race, gender: gender,
    clsEmoji: pickClassEmoji(cls.code, gender),
    mana: isCaster ? 10 + Math.floor(Math.random() * 10) : 0,
    lvl: 1, xp: 0, hp: maxHp, maxHp: maxHp, food: 73,
    color: "#cc88ff", alive: true, reviveCost: 20, weaponBonus: 0, armorBonus: 0
  };
}

function openShop(category) {
  townScreen = category === "armor" ? "armory" : "shop";
  pushLog(category === "armor" ? "-----Armory-----" : "-----Weaponsmith-----");
  pushLog(category === "armor" ? "Armor for sale." : "Weapons and potions for sale.");
  renderAll();
}
function openKing() {
  townScreen = "king";
  pushLog("-----Throne Room-----");
  if (state.mode === "islandTown") {
    if (hasPirateFlag) {
      pushLog("\"That's my flag!\" the old pirate grins. \"Knew you had it in you.\"");
    } else if (thiefKingQuestStarted) {
      pushLog("\"Still looking for that tornado? It's out there,");
      pushLog("somewhere past the harbor. Dive in if you dare.\"");
    } else {
      thiefKingQuestStarted = true;
      if (PIRATE_TORNADO_POS) {
        tornadoes.push({ x: PIRATE_TORNADO_POS.x, y: PIRATE_TORNADO_POS.y, screen: "overworld", isQuestTornado: true });
      }
      pushLog("\"Truth is, I'm no harbor master — I'm the Thief King.");
      pushLog("Lost my colors to a tornado out past these waters.");
      pushLog("Sail into it, if you've got the nerve, and win it back.\"");
    }
  } else if (wizardQuestComplete) {
    pushLog("\"Well met, hero. The realm still remembers your deed.\"");
  } else if (hasWizardsWand) {
    pushLog("\"You return... is that the Archwizard's Wand?\"");
  } else {
    pushLog("\"An Archwizard has fouled our dungeon's deepest hall.");
    pushLog("Slay him and bring me his wand — 500 gold awaits.\"");
  }
  renderAll();
}
// Turns in the wand for the King's reward — removes it from wherever
// it currently sits, whether it's still loose in inventory or someone
// actually equipped it as a weapon in the meantime.
function turnInWizardsWand() {
  if (!hasWizardsWand || wizardQuestComplete) return;
  // matched by name, not object identity — a save/load round-trip
  // deserializes a structurally-identical but distinct copy of the item
  var idx = inventory.findIndex(function (e) { return e.item && e.item.name === WIZARDS_WAND.name; });
  if (idx !== -1) inventory.splice(idx, 1);
  party.forEach(function (p) {
    if (p.equippedWeapon && p.equippedWeapon.name === WIZARDS_WAND.name) { p.equippedWeapon = null; p.weaponBonus = 0; }
  });
  wizardQuestComplete = true;
  sharedGold += 500;
  pushLog("-----Quest Complete!-----");
  pushLog("The King rewards you with 500 gold!");
  townScreen = null;
  renderAll();
}
function openMoonKing() {
  townScreen = "moonKing";
  pushLog("-----The Moon King-----");
  if (!alienQuestComplete) {
    pushLog("\"Prove yourself against the aliens, traveler.\"");
  } else if (futureManComplete) {
    pushLog("\"My old friend flies true again, thanks to you.\"");
  } else if (hasGearPart && hasArmPart && hasLegPart) {

  } else {

    pushLog("I sent him to Earth on an errand, and never heard");
    pushLog("from him again. If you find any trace of him...\"");
