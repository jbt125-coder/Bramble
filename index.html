<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ultima-Style RPG</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden;
    font-family: 'Courier New', monospace; color: #fff; user-select: none;
  }
  #app {
    width: 100%; height: 100vh; max-width: 700px; margin: 0 auto;
    display: flex; flex-direction: column; background: #000;
  }
  #canvasWrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: #000; min-height: 0; overflow: hidden;
  }
  #gameCanvas {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }
  #controlsRow {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 8px; background: #000; border-top: 1px solid #333; flex-shrink: 0;
    gap: 6px;
  }
  #dpadWrap {
    display: grid;
    grid-template-areas: ". n ." "w c e" ". s .";
    grid-template-columns: 48px 48px 48px;
    grid-template-rows: 48px 48px 48px;
    gap: 3px;
  }
  .dpadBtn {
    background: #000; border: 2px solid #6666ff; color: #6666ff;
    font-size: 18px; cursor: pointer; touch-action: manipulation; font-family: inherit;
  }
  .dpadBtn:active { background: #111144; }
  #cmdBtns {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px;
    flex: 1; align-content: center; justify-content: flex-end;
  }
  .cmdBtn {
    background: #000; border: 2px solid #ff5555; color: #ff5555;
    font-size: 11px; padding: 9px 10px; cursor: pointer; touch-action: manipulation;
    font-family: inherit; font-weight: bold; min-width: 64px;
  }
  .cmdBtn:active { background: #331111; }
  #errBox {
    position: fixed; bottom: 0; left: 0; right: 0; background: #400; color: #fdd;
    font-size: 11px; padding: 8px; z-index: 999; display: none; white-space: pre-wrap;
    max-height: 40vh; overflow: auto;
  }
</style>
</head>
<body>

<div id="app">
  <div id="canvasWrap">
    <canvas id="gameCanvas" width="380" height="620"></canvas>
  </div>
  <div id="controlsRow">
    <div id="dpadWrap">
      <button class="dpadBtn" style="grid-area:n" id="btnN">^</button>
      <button class="dpadBtn" style="grid-area:w" id="btnW">&lt;</button>
      <div style="grid-area:c"></div>
      <button class="dpadBtn" style="grid-area:e" id="btnE">&gt;</button>
      <button class="dpadBtn" style="grid-area:s" id="btnS">v</button>
    </div>
    <div id="cmdBtns">
      <button class="cmdBtn" id="btnAttack">ATTACK</button>
      <button class="cmdBtn" id="btnCast">CAST</button>
      <button class="cmdBtn" id="btnGet">GET</button>
      <button class="cmdBtn" id="btnStats">STATS</button>
      <button class="cmdBtn" id="btnRun">RUN</button>
      <button class="cmdBtn" id="btnFire" style="display:none;">FIRE</button>
      <button class="cmdBtn" id="btnDismount" style="display:none;">DISMOUNT</button>
      <button class="cmdBtn" id="btnTame" style="display:none;">TAME</button>
      <button class="cmdBtn" id="btnShoot" style="display:none;">SHOOT</button>
    </div>
  </div>
</div>

<div id="errBox"></div>

<script>
window.onerror = function (msg, src, line, col, err) {
  var box = document.getElementById('errBox');
  box.style.display = 'block';
  box.textContent = 'JS ERROR: ' + msg + '\n@ line ' + line + ':' + col + '\n' + (err && err.stack ? err.stack : '');
};

(function () {
"use strict";

// ============================================================
// LOGICAL CANVAS LAYOUT
// Matches the reference: a big square map viewport on the left
// (~60% width) with a decorative border, and a party-card panel
// on the right (~40% width), stacked cards with divider bars.
// ============================================================
var LW = 380, LH = 620; // fixed logical resolution — tall/narrow to match phone portrait, minimizing letterbox black bars

// ---------- layout: party strips top & bottom, map fills the space between ----------
var TOPBAR_H = 56;      // top party strip (2 members side by side) — flush to y=0
var BOTBAR_H = 56;      // bottom party strip (2 members side by side)
var LOG_H = 70;         // description/log text area, below everything
var BORDER = 8;
var COORD_GAP = 20;     // room for the "(x)(y)" readout above the map border
var LOC_GAP = 20;       // room for the location-name banner below the map border

var MAP_X0 = 6;
var MAP_OUTER_W = LW - 12;
var MAP_Y0 = TOPBAR_H + COORD_GAP;
var MAP_OUTER_H = LH - TOPBAR_H - COORD_GAP - LOC_GAP - BOTBAR_H - LOG_H;

var MAP_INNER_X0 = MAP_X0 + BORDER;
var MAP_INNER_Y0 = MAP_Y0 + BORDER;
var MAP_INNER_W = MAP_OUTER_W - BORDER * 2;
var MAP_INNER_H = MAP_OUTER_H - BORDER * 2;

var VIEW_TILES = 11;    // tile viewport count (width-limited since LW < LH now)
var TILE = Math.floor(Math.min(MAP_INNER_W / VIEW_TILES, MAP_INNER_H / VIEW_TILES));

var LOCLABEL_Y = MAP_Y0 + MAP_OUTER_H;
var BOTBAR_Y0 = LOCLABEL_Y + LOC_GAP;
var LOG_Y0 = BOTBAR_Y0 + BOTBAR_H;

// ---------- palette ----------
var PAL = {
  black: "#000000",
  purple: "#6666ee",
  purpleDark: "#3a3aa0",
  green: "#22cc44",
  greenDark: "#116622",
  white: "#ffffff",
  brick: "#aa2222",
  brickDark: "#661111",
  water: "#2244aa",
  waterLight: "#3a66cc",
  gray: "#888888",
  yellow: "#ffee55",
  red: "#ff4444",
  skin: "#e0a878",
  gold: "#ffcc33"
};

// ============================================================
// TILE TYPES
// ============================================================
var T = {
  GRASS: 0, WATER: 1, FOREST: 2, MOUNTAIN: 3, ROAD: 4,
  TOWN: 5, DUNGEON: 6, FLOOR: 7, WALL: 8, DOOR: 9, CHEST: 10, INNKEEPER: 11, SHOPKEEP: 12,
  TAVERN: 13, FOUNTAIN: 14, HEALER: 15, HORSE: 16, SHIP: 17, ISLAND: 18, ARMORY: 19, KING: 20,
  STABLE: 21, PORTAL: 22, MOON_GRASS: 23, MOON_SHOP: 24, MOON_PORTAL: 25, ROCKET: 26,
  HUT: 27, MOAI: 28, SHRINE: 29, CHURCH: 30, GARDEN_FOUNTAIN: 31, VOLCANO: 32, ASIA_CASTLE: 33,
  GRAVE: 34, BRIDGE: 35, BED: 36, MOURNER: 37, HUT_NPC: 38
};

function mkMap(w, h, fill) {
  var g = [];
  for (var r = 0; r < h; r++) {
    var row = [];
    for (var c = 0; c < w; c++) row.push(fill);
    g.push(row);
  }
  return g;
}

var OW_W = 100, OW_H = 90;
// the player's starting position matches the safe-zone carved at the
// continent's center in buildOverworld() — a few tiles west of the town
var OW_START_X = Math.floor(OW_W / 2) - 12, OW_START_Y = Math.floor(OW_H / 2);
// ---------- clustered terrain generation ----------
// Instead of rolling each tile independently (which scatters single tiles
// everywhere), we seed a handful of "blob centers" per feature type and
// grow each outward with falling probability, so forests clump into
// patches, water clumps into lakes/coastline, and mountains form ranges.
function growBlob(g, w, h, startR, startC, tileType, size, rand, overwritable) {
  var frontier = [{ r: startR, c: startC }];
  var placed = 0;
  var seen = {};
  seen[startR + "," + startC] = true;
  while (frontier.length && placed < size) {
    var idx = Math.floor(rand() * frontier.length);
    var cell = frontier.splice(idx, 1)[0];
    if (cell.r <= 0 || cell.c <= 0 || cell.r >= h - 1 || cell.c >= w - 1) continue;
    if (!overwritable(g[cell.r][cell.c])) continue;
    g[cell.r][cell.c] = tileType;
    placed++;
    var neighbors = [[cell.r - 1, cell.c], [cell.r + 1, cell.c], [cell.r, cell.c - 1], [cell.r, cell.c + 1]];
    neighbors.forEach(function (n) {
      var key = n[0] + "," + n[1];
      if (!seen[key] && rand() < 0.72) { // fall-off chance keeps blobs roughly round, not perfect squares
        seen[key] = true;
        frontier.push({ r: n[0], c: n[1] });
      }
    });
  }
}

function buildOverworld() {
  // Much larger world: start as one big ocean, then grow a single
  // compact continent roughly in the middle, leaving a lot of open sea
  // around it in every direction — matching "much larger ocean" rather
  // than just a bigger map overall.
  var g = mkMap(OW_W, OW_H, T.WATER);
  var seed = 11;
  function rand() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  var isOpenWater = function (t) { return t === T.WATER; };
  var isOpenLand = function (t) { return t === T.GRASS; };

  // the continent: one big grass blob, centered, sized to leave generous
  // ocean margins on every side
  var contCenterR = Math.floor(OW_H / 2), contCenterC = Math.floor(OW_W / 2);
  growBlob(g, OW_W, OW_H, contCenterR, contCenterC, T.GRASS, Math.floor(OW_W * OW_H * 0.09), rand, isOpenWater);

  // a few inland lakes, scaled up for the bigger continent
  for (var lk = 0; lk < 5; lk++) {
    var lr = contCenterR - 20 + Math.floor(rand() * 40);
    var lc = contCenterC - 25 + Math.floor(rand() * 50);
    growBlob(g, OW_W, OW_H, lr, lc, T.WATER, 10 + Math.floor(rand() * 20), rand, isOpenLand);
  }

  // mountain ranges
  for (var mr = 0; mr < 4; mr++) {
    var startRow = contCenterR - 20 + Math.floor(rand() * 40);
    var startCol = contCenterC - 25 + Math.floor(rand() * 50);
    var chainLen = 4 + Math.floor(rand() * 4);
    for (var seg = 0; seg < chainLen; seg++) {
      growBlob(g, OW_W, OW_H, startRow, startCol, T.MOUNTAIN, 5 + Math.floor(rand() * 6), rand, isOpenLand);
      startRow += Math.floor(rand() * 3) - 1;
      startCol += Math.floor(rand() * 3) - 1;
    }
  }

  // the main road to town: a clean straight line from the start zone to
  // the town gate, laid down BEFORE forests grow so nothing can cut
  // across it later — trees are then grown to line either side of it,
  // rather than scattered randomly and occasionally overwriting it
  var roadRow = contCenterR;
  var roadStartC = contCenterC - 12, roadEndC = contCenterC + 2;
  for (var rc = roadStartC; rc <= roadEndC; rc++) {
    g[roadRow][rc] = T.ROAD;
  }
  // tree-lined edges: a row of forest directly above and below the road
  for (var tc = roadStartC; tc <= roadEndC; tc++) {
    if (g[roadRow - 1][tc] === T.GRASS && Math.random() < 0.8) g[roadRow - 1][tc] = T.FOREST;
    if (g[roadRow + 1][tc] === T.GRASS && Math.random() < 0.8) g[roadRow + 1][tc] = T.FOREST;
  }
  // the town gate sits exactly at the road's end, so the road always
  // visibly leads straight to it
  placeOnNearestGrass(g, roadRow, roadEndC + 1, T.TOWN, rand);

  // forest patches — kept away from the road corridor (and its tree-lined
  // edges) so they never grow across and break the straight line
  for (var fp = 0; fp < 16; fp++) {
    var fr = contCenterR - 22 + Math.floor(rand() * 44);
    var fc = contCenterC - 27 + Math.floor(rand() * 54);
    if (Math.abs(fr - roadRow) <= 2 && fc >= roadStartC - 2 && fc <= roadEndC + 2) continue; // skip anything that would encroach on the road
    growBlob(g, OW_W, OW_H, fr, fc, T.FOREST, 6 + Math.floor(rand() * 10), rand, isOpenLand);
  }

  placeOnNearestGrass(g, contCenterR - 12, contCenterC + 15, T.DUNGEON, rand);

  // safe starting zone right at the continent's center
  g[contCenterR - 1][contCenterC - 12] = T.GRASS;
  g[contCenterR][contCenterC - 12] = T.GRASS;
  g[contCenterR + 1][contCenterC - 12] = T.GRASS;

  placeHorseAndShip(g, rand);
  placeExtraWildShips(g, rand);
  placeScatteredLandmarks(g, rand, contCenterR, contCenterC + 3);
  placeVolcanoes(g, rand, OW_W, OW_H, 2);
  return g;
}

// Scatters the smaller flavor landmarks (huts, moai, shrine, grave) at
// random grass spots — cheap one-tile features, no special generation
// needed beyond "somewhere reasonable on solid ground". Huts specifically
// are kept well clear of the castle, since visiting one is meant to be
// its own small side trip, not something you stumble on right at the gate.
function placeScatteredLandmarks(g, rand, castleR, castleC) {
  var placements = [
    { type: T.HUT, count: 3, minDistFromCastle: 15 },
    { type: T.MOAI, count: 2 },
    { type: T.SHRINE, count: 2 },
    { type: T.GRAVE, count: 2 }
  ];
  placements.forEach(function (p) {
    var placed = 0, tries = 0;
    while (placed < p.count && tries < 800) {
      tries++;
      var r = 2 + Math.floor(rand() * (OW_H - 4));
      var c = 2 + Math.floor(rand() * (OW_W - 4));
      if (g[r][c] !== T.GRASS) continue;
      if (p.minDistFromCastle) {
        var d = Math.sqrt((r - castleR) * (r - castleR) + (c - castleC) * (c - castleC));
        if (d < p.minDistFromCastle) continue;
      }
      g[r][c] = p.type;
      placed++;
    }
  });
}

// Finds the nearest grass tile to (r,c) (spiraling outward) and places
// the given landmark tile there — used so hardcoded-feeling landmark
// placement still always resolves onto solid ground on the generated
// continent, wherever it actually ended up.
function placeOnNearestGrass(g, r, c, tileType, rand) {
  for (var radius = 0; radius < 40; radius++) {
    for (var dr = -radius; dr <= radius; dr++) {
      for (var dc = -radius; dc <= radius; dc++) {
        if (Math.abs(dr) !== radius && Math.abs(dc) !== radius) continue; // only the ring edge
        var rr = r + dr, cc = c + dc;
        if (g[rr] && g[rr][cc] === T.GRASS) { g[rr][cc] = tileType; return; }
      }
    }
  }
}

// A handful of extra freely-boardable wild ships scattered around the
// coastline, in addition to the one from placeHorseAndShip — since ships
// are no longer pirate-gated, there should be more than one to stumble on.
function placeExtraWildShips(g, rand) {
  var placed = 0, tries = 0;
  while (placed < 4 && tries < 2000) {
    tries++;
    var r = 1 + Math.floor(rand() * (OW_H - 2));
    var c = 1 + Math.floor(rand() * (OW_W - 2));
    if (g[r][c] === T.GRASS && hasAdjacentWater(g, r, c)) {
      g[r][c] = T.SHIP;
      placed++;
    }
  }
}

// Places one wild horse somewhere reachable on open grass, and one derelict
// ship along a coastline tile (grass tile adjacent to water) — both are
// fixed one-time pickups on the overworld.
function placeHorseAndShip(g, rand) {
  for (var tries = 0; tries < 200; tries++) {
    var r = 2 + Math.floor(rand() * (OW_H - 4));
    var c = 2 + Math.floor(rand() * (OW_W - 4));
    if (g[r][c] === T.GRASS) { g[r][c] = T.HORSE; break; }
  }
  for (var tries2 = 0; tries2 < 300; tries2++) {
    var r2 = 2 + Math.floor(rand() * (OW_H - 4));
    var c2 = 2 + Math.floor(rand() * (OW_W - 4));
    if (g[r2][c2] === T.GRASS && hasAdjacentWater(g, r2, c2)) { g[r2][c2] = T.SHIP; break; }
  }
}
function hasAdjacentWater(g, r, c) {
  var deltas = [[-1, 0], [1, 0], [0, -1], [0, 1]];
  for (var i = 0; i < deltas.length; i++) {
    var rr = r + deltas[i][0], cc = c + deltas[i][1];
    if (g[rr] && g[rr][cc] === T.WATER) return true;
  }
  return false;
}

// Carves a walled rectangular room (walls on the border, floor inside)
// into the grid, with a door punched through one specific wall tile.
// doorSide: "N" | "S" | "E" | "W" — which wall the door sits on.
// Carves a walled rectangular room (walls on the border, floor inside)
// into the grid. openSide/openOffset punches a plain FLOOR gap through
// that wall (not a T.DOOR) so walking in/out is purely cosmetic — only
// the town's main gate should trigger the "leave to overworld" behavior.
function carveRoom(g, x0, y0, w, h, openSide, openOffset) {
  for (var r = y0; r < y0 + h; r++) {
    for (var c = x0; c < x0 + w; c++) {
      var isEdge = (r === y0 || r === y0 + h - 1 || c === x0 || c === x0 + w - 1);
      g[r][c] = isEdge ? T.WALL : T.FLOOR;
    }
  }
  var off = openOffset || Math.floor((openSide === "N" || openSide === "S" ? w : h) / 2);
  if (openSide === "N") g[y0][x0 + off] = T.FLOOR;
  else if (openSide === "S") g[y0 + h - 1][x0 + off] = T.FLOOR;
  else if (openSide === "W") g[y0 + off][x0] = T.FLOOR;
  else if (openSide === "E") g[y0 + off][x0 + w - 1] = T.FLOOR;
}

function buildTown() {
  // Mainland castle: much larger and more spread out than before — a
  // big open grass courtyard with real breathing room between the
  // profession rooms, plus a dedicated garden (fountain, flowers, a
  // small bridge over a stream) and a separate graveyard area.
  var w = 44, h = 40;
  var g = mkMap(w, h, T.GRASS);
  for (var c = 0; c < w; c++) { g[0][c] = T.WALL; g[h - 1][c] = T.WALL; }
  for (var r = 0; r < h; r++) { g[r][0] = T.WALL; g[r][w - 1] = T.WALL; }
  g[h - 1][22] = T.DOOR; // main gate, south wall, centered

  // Treasure vault — a small sealed room at the very north edge, directly
  // behind the throne room. Reaching it requires walking around through
  // the throne room's own back wall opening. Chests inside are guarded:
  // taking one summons elite guards, far stronger than an ordinary rare
  // town scuffle.
  carveRoom(g, 18, 1, 8, 5, "S", 4);
  var vaultChestSpots = [[19, 2], [21, 2], [23, 2], [20, 4]];
  vaultChestSpots.forEach(function (spot) { g[spot[1]][spot[0]] = T.CHEST; });

  // Throne room — north side, largest room, King inside, directly south
  // of (and connected to) the vault above
  carveRoom(g, 15, 6, 14, 8, "S", 7);
  g[6][22] = T.FLOOR; // punch through the throne room's own north wall so
  // it actually connects to the vault's door directly above it — the
  // two rooms would otherwise share a solid wall with no way through
  g[10][22] = T.KING;

  // Weaponsmith — far west (shopkeeper wanders the room; not a fixed tile)
  carveRoom(g, 3, 18, 8, 6, "E", 3);

  // Armory — far east, mirrors the weaponsmith (shopkeeper wanders too)
  carveRoom(g, 33, 18, 8, 6, "W", 3);

  // Tavern — southwest, well clear of the weaponsmith
  carveRoom(g, 3, 29, 9, 7, "N", 4);
  g[35][7] = T.TAVERN;

  // Healer / hospital — southeast, mirrors the tavern
  carveRoom(g, 32, 29, 9, 7, "N", 4);
  g[32][36] = T.HEALER;
  g[31][34] = T.BED;
  g[31][38] = T.BED;
  g[33][34] = T.BED;
  g[33][38] = T.BED;

  // Stable — south-center, between tavern and healer
  carveRoom(g, 18, 30, 8, 6, "N", 4);
  g[34][22] = T.STABLE;

  // ---------- Garden — its own walled-off area, west-center, between the
  // throne room and the tavern, with the new ornate fountain, flowers,
  // and a small stream crossed by a bridge ----------
  carveRoom(g, 3, 7, 10, 10, "S", 5);
  for (var gr = 8; gr < 16; gr++) {
    for (var gc = 4; gc < 12; gc++) {
      if (g[gr][gc] === T.FLOOR) g[gr][gc] = T.GRASS; // grass floor, not stone, inside the garden
    }
  }
  // a short stream running through the garden, with a bridge crossing it
  for (var sr = 9; sr < 15; sr++) g[sr][8] = T.WATER;
  g[12][8] = T.BRIDGE;
  g[11][6] = T.GARDEN_FOUNTAIN;

  // ---------- Graveyard — its own walled area, east-center, mirroring
  // the garden, with a scatter of graves ----------
  carveRoom(g, 31, 7, 10, 10, "S", 5);
  for (var vr = 8; vr < 16; vr++) {
    for (var vc = 32; vc < 40; vc++) {
      if (g[vr][vc] === T.FLOOR) g[vr][vc] = T.GRASS;
    }
  }
  var graveSpots = [[34, 9], [36, 10], [38, 9], [34, 13], [37, 13], [35, 11]];
  graveSpots.forEach(function (spot) { g[spot[1]][spot[0]] = T.GRAVE; });
  var mournerSpots = [[35, 10], [37, 10]];
  mournerSpots.forEach(function (spot) {
    if (g[spot[1]][spot[0]] === T.GRASS) g[spot[1]][spot[0]] = T.MOURNER;
  });

  // scattered courtyard trees, with a dense cluster specifically placed
  // to obscure the OLD hidden fountain spot no longer used — trees here
  // are now just general courtyard atmosphere since the garden fountain
  // has its own dedicated garden room instead of being hidden in the open
  var seed = 42;
  function rand() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  for (var tr = 0; tr < 20; tr++) {
    var tx = 14 + Math.floor(rand() * (w - 28));
    var ty = 12 + Math.floor(rand() * (h - 24));
    if (g[ty][tx] === T.GRASS) g[ty][tx] = T.FOREST;
  }

  return g;
}

function buildDungeon() {
  var w = 22, h = 16;
  var g = mkMap(w, h, T.WALL);
  for (var r = 1; r < h - 1; r++) for (var c = 1; c < 9; c++) g[r][c] = T.FLOOR;
  for (var c2 = 9; c2 < w - 1; c2++) g[7][c2] = T.FLOOR;
  for (var r2 = 1; r2 < h - 1; r2++) for (var c3 = 13; c3 < w - 1; c3++) g[r2][c3] = T.FLOOR;
  g[1][1] = T.DOOR;
  return g;
}

// ---------- the special island, only reachable by ship ----------
var ISLAND_W = 50, ISLAND_H = 40;
function buildIslandOverworld() {
  var g = mkMap(ISLAND_W, ISLAND_H, T.WATER);
  var seed = 77;
  function rand() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  var isOpenWater = function (t) { return t === T.WATER; };
  var isOpenLand = function (t) { return t === T.GRASS; };

  // grow one big landmass roughly in the middle of this much larger grid
  var midR = Math.floor(ISLAND_H / 2), midC = Math.floor(ISLAND_W / 2);
  growBlob(g, ISLAND_W, ISLAND_H, midR, midC, T.GRASS, Math.floor(ISLAND_W * ISLAND_H * 0.35), rand, isOpenWater);

  // a mountain range or two, giving the island some real terrain variety
  for (var mr = 0; mr < 2; mr++) {
    var startRow = midR - 12 + Math.floor(rand() * 24);
    var startCol = midC - 15 + Math.floor(rand() * 30);
    var chainLen = 3 + Math.floor(rand() * 3);
    for (var seg = 0; seg < chainLen; seg++) {
      growBlob(g, ISLAND_W, ISLAND_H, startRow, startCol, T.MOUNTAIN, 4 + Math.floor(rand() * 5), rand, isOpenLand);

// ---------- wind ----------
// Wind blows from one of 4 directions (or calm/none) and shifts randomly
// every 3-7 sailing moves. Moving WITH the wind is fast, AGAINST it is
// slow, calm means you can't move at all that turn, and perpendicular or
// no-wind-set has no effect.
var WIND_DIRS = ["N", "S", "E", "W", "CALM"];
var wind = { dir: "N", movesLeft: 5 };
function rollWindDuration() { return 3 + Math.floor(Math.random() * 5); } // 3-7 inclusive
function maybeShiftWind() {

    wind.movesLeft = rollWindDuration();

    pushLog(windLabel);

// Returns { tiles: N, blocked: bool } — tiles is how many steps to attempt

// two slow cases: dead calm (can't move at all) and sailing dead against
// the wind (50% chance the step just doesn't happen, like wading through

function sailSpeedFor(dir) {

// Checks whether the player is currently at or adjacent to a given tile
// type — used to gate terrain-specific monster spawns (forest/mountain

function nearTileType(tileType) {

  var deltas = [[-1, 0], [1, 0], [0, -1], [0, 1]];
  for (var i = 0; i < deltas.length; i++) {
    if (tileAt(state.x + deltas[i][0], state.y + deltas[i][1]) === tileType) return true;

function spawnMapMonster(screenKey) {

  // In the dungeon, Wizard or Bat can appear instead of the land pool.

  // Giant Eagle/Yeti (forest or mountain) instead of the general pool.
  var def;
  if (state.sailing) {
    def = Math.random() < 0.06 ? KRAKEN_DEF : SEA_SERPENT_DEF;
  } else if (screenKey === "dungeon" && Math.random() < 0.35) {
    def = Math.random() < 0.5 ? WIZARD_DEF : BAT_DEF;
  } else if (nearTileType(T.FOREST) && Math.random() < 0.3) {
    var forestPool = [GIANT_WASP_DEF, MONKEY_DEF, GIANT_EAGLE_DEF, YETI_DEF];

  } else if (nearTileType(T.MOUNTAIN) && Math.random() < 0.3) {
    var mountainPool = [GIANT_EAGLE_DEF, YETI_DEF];
    def = mountainPool[Math.floor(Math.random() * mountainPool.length)];
  } else {
    def = MONSTER_DEFS[Math.floor(Math.random() * MONSTER_DEFS.length)];

  var mx = state.x + (Math.random() < 0.5 ? -1 : 1) * (2 + Math.floor(Math.random() * 2));

// Moves each wandering monster one step toward the player. If a monster
// reaches the player's tile, combat begins immediately.
// Whether a specific wandering monster can step onto a given tile type —

// to be sailing at the time.
function monsterCanEnter(m, t) {

  if (t === T.WATER || t === T.ISLAND) return !!m.aquatic;
  return true;

function stepMapMonsters() {

  for (var i = 0; i < mapMonsters.length; i++) {
    var m = mapMonsters[i];
    if (m.screen !== screenKey) { stillAlive.push(m); continue; }
    var dx = state.x - m.x, dy = state.y - m.y;
    var stepX = dx === 0 ? 0 : (dx > 0 ? 1 : -1);
    var stepY = dy === 0 ? 0 : (dy > 0 ? 1 : -1);
    // move on whichever axis has the larger gap, one tile per turn
    if (Math.abs(dx) >= Math.abs(dy) && stepX !== 0) {
      var nx = m.x + stepX;
      var nt = tileAt(nx, m.y);
      if (monsterCanEnter(m, nt) && !(nt === T.FOREST && Math.random() < 0.5)) m.x = nx;
    } else if (stepY !== 0) {
      var ny = m.y + stepY;
      var nt2 = tileAt(m.x, ny);
      if (monsterCanEnter(m, nt2) && !(nt2 === T.FOREST && Math.random() < 0.5)) m.y = ny;
    }
    if (m.x === state.x && m.y === state.y) {
      startCombatWithMonster(m, screenKey);
      continue; // this monster is now "in combat", drop from the wandering list
    }

// Builds a live monster instance scaled by that monster type's current tier.
function makeMonsterInstance(def, x, y) {

    gold: [Math.round(def.gold[0] * (1 + tier * 0.4)), Math.round(def.gold[1] * (1 + tier * 0.4))],
    xp: Math.round(def.xp * (1 + tier * 0.4)),

function currentGrid() {
  if (state.mode === "town") return townGrid;
  if (state.mode === "dungeon") return dungeonGrid;
  if (state.mode === "island") return islandGrid;
  if (state.mode === "islandTown") return islandTownGrid;
  if (state.mode === "moon") return moonGrid;
  if (state.mode === "moonTown") return moonTownGrid;
  if (state.mode === "hutInterior") return hutInteriorGrid;
  if (state.mode === "churchInterior") return churchInteriorGrid;
  return overworldGrid;
}
function gridDims() {
  var g = currentGrid();
  return { w: g[0].length, h: g.length };
}
function tileAt(x, y) {
  var g = currentGrid();
  var d = gridDims();
  // The main overworld wraps around like a globe — sail (or walk) off one
  // edge and you appear on the opposite side. Every other map (town,
  // dungeon, island interior) stays a normal bounded room.
  if (state.mode === "overworld") {
    x = ((x % d.w) + d.w) % d.w;
    y = ((y % d.h) + d.h) % d.h;
    return g[y][x];
  }
  if (x < 0 || y < 0 || x >= d.w || y >= d.h) return null;
  return g[y][x];
}

// the player's own position would drift into unwrapped negative/overflow
// values even though tileAt() would still happen to read correctly.
function wrapPos(x, y) {
  if (state.mode !== "overworld") return { x: x, y: y };
  return { x: ((x % OW_W) + OW_W) % OW_W, y: ((y % OW_H) + OW_H) % OW_H };
}

  if (t === null) return false;
  var flyingFreely = state.mounted && state.vehicleType === "helicopter";
  if (t === T.WATER) return state.sailing || flyingFreely; // ship, or helicopter flying over it
  if (t === T.ISLAND) return state.sailing || flyingFreely;
  if (t === T.MOUNTAIN) return flyingFreely; // helicopter is the only thing that can cross mountains
  if (t === T.VOLCANO) return flyingFreely; // impassable on foot, just like a mountain
  if (t === T.WALL) return false;
  if (t === T.FOREST && state.mounted && state.vehicleType !== "helicopter") return false; // horses/cars can't push through forest, helicopter flies over
  return true;
}

  for (var i = 0; i < deltas.length; i++) {

// ============================================================
// CANVAS SETUP
// ============================================================
var canvas = document.getElementById("gameCanvas");
var ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

function resizeCanvasCss() {
  var wrap = document.getElementById("canvasWrap");
  var maxW = wrap.clientWidth, maxH = wrap.clientHeight;
  // Fractional scaling (not integer-only) so the canvas fills the
  // available space tightly. imageSmoothingEnabled stays false and all
  // drawing is done with flat fills/strokes (no photographic bitmaps),
  // so fractional scale doesn't introduce blur here.
  var scale = Math.max(0.1, Math.min(maxW / LW, maxH / LH));
  canvas.style.width = (LW * scale) + "px";
  canvas.style.height = (LH * scale) + "px";
}

function px(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

// ============================================================
// DECORATIVE BORDER (purple frame with corner/edge chevrons,
// like the reference screenshots)
// ============================================================
function drawChevron(cx, cy, dir, size, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  if (dir === "up") {
    ctx.moveTo(cx, cy - size); ctx.lineTo(cx + size, cy + size); ctx.lineTo(cx - size, cy + size);
  } else if (dir === "down") {
    ctx.moveTo(cx, cy + size); ctx.lineTo(cx + size, cy - size); ctx.lineTo(cx - size, cy - size);
  } else if (dir === "left") {
    ctx.moveTo(cx - size, cy); ctx.lineTo(cx + size, cy - size); ctx.lineTo(cx + size, cy + size);
  } else {
    ctx.moveTo(cx + size, cy); ctx.lineTo(cx - size, cy - size); ctx.lineTo(cx - size, cy + size);
  }
  ctx.closePath();
  ctx.fill();
}

function drawMapBorder() {
  // border ring
  px(MAP_X0, MAP_Y0, MAP_OUTER_W, BORDER, PAL.purple); // top
  px(MAP_X0, MAP_Y0 + MAP_OUTER_H - BORDER, MAP_OUTER_W, BORDER, PAL.purple); // bottom
  px(MAP_X0, MAP_Y0, BORDER, MAP_OUTER_H, PAL.purple); // left
  px(MAP_X0 + MAP_OUTER_W - BORDER, MAP_Y0, BORDER, MAP_OUTER_H, PAL.purple); // right

  // corner chevrons pointing outward, and edge-midpoint chevrons like reference
  var midX = MAP_X0 + MAP_OUTER_W / 2;
  var midY = MAP_Y0 + MAP_OUTER_H / 2;
  drawChevron(midX, MAP_Y0 - 2, "up", 8, PAL.purple);
  drawChevron(midX, MAP_Y0 + MAP_OUTER_H + 2, "down", 8, PAL.purple);
  drawChevron(MAP_X0 - 2, midY, "left", 8, PAL.purple);
  drawChevron(MAP_X0 + MAP_OUTER_W + 2, midY, "right", 8, PAL.purple);

  // coordinate readout above the map, e.g. "(7)(6)"
  ctx.fillStyle = PAL.white;
  ctx.font = "bold 13px 'Courier New', monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  var coordStr = "(" + state.x + ")(" + state.y + ")";
  ctx.fillText(coordStr, midX, MAP_Y0 - 12);
  ctx.textAlign = "left";

  // location name banner under the map
  ctx.fillStyle = PAL.white;
  ctx.font = "bold 13px 'Courier New', monospace";
  ctx.textAlign = "center";
  var label = modeLabel();
  if (state.mounted) label += "  (Mounted)";
  else if (state.sailing) label += "  (Sailing)";
  ctx.fillText(label, midX, LOCLABEL_Y + 12);
  ctx.textAlign = "left";
}

function modeLabel() {
  if (state.mode === "town") return "TOWN OF BRAMBLE";
  if (state.mode === "dungeon") return "DUNGEON DEPTHS";
  if (state.mode === "island") return "UNCHARTED ISLE";
  if (state.mode === "islandTown") return "PORT REVERIE";
  if (state.mode === "moon") return "GREY MOON";
  if (state.mode === "moonTown") return "LUNA STATION";
  if (state.mode === "combat") return "COMBAT";
  return "SOUTH WIND";
}

// ============================================================
// TILE DRAWING — chunky tiles with dense dot/cross/brick textures
// ============================================================
function drawTile(sx, sy, size, type, gx, gy) {
  px(sx, sy, size, size, PAL.black);
  var parity = (gx * 3 + gy * 7) % 4;

  if (type === T.GRASS) {
    px(sx, sy, size, size, PAL.black);
    ctx.fillStyle = PAL.green;
    // dense cross/dot pattern like the reference grass texture
    var step = Math.max(3, Math.floor(size / 4));
    for (var yy = 1; yy < size; yy += step) {
      for (var xx = 1; xx < size; xx += step) {
        var offset = ((gx + gy + xx + yy) % 3);
        if (offset !== 2) {
          drawCross(sx + xx, sy + yy, PAL.green);
        } else {
          px(sx + xx, sy + yy, 1, 1, PAL.greenDark);
        }
      }
    }
  } else if (type === T.WATER) {
    px(sx, sy, size, size, PAL.water);
    ctx.strokeStyle = PAL.waterLight;
    ctx.lineWidth = 1;
    for (var wy = 3; wy < size; wy += 5) {
      ctx.beginPath();
      for (var wx = 0; wx <= size; wx += 4) {
        var yOff = ((wx / 4 + gx) % 2 === 0) ? 0 : 2;
        if (wx === 0) ctx.moveTo(sx + wx, sy + wy + yOff);
        else ctx.lineTo(sx + wx, sy + wy + yOff);
      }
      ctx.stroke();
    }
  } else if (type === T.FOREST) {
    px(sx, sy, size, size, PAL.black);
    var cx = sx + size / 2, cy = sy + size / 2;
    ctx.fillStyle = PAL.greenDark;
    ctx.beginPath(); ctx.arc(cx, cy, size * 0.42, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = PAL.green;
    ctx.beginPath(); ctx.arc(cx - size * 0.15, cy - size * 0.1, size * 0.26, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + size * 0.15, cy - size * 0.15, size * 0.22, 0, Math.PI * 2); ctx.fill();
  } else if (type === T.MOUNTAIN) {
    px(sx, sy, size, size, PAL.black);
    ctx.fillStyle = PAL.gray;
    ctx.beginPath();
    ctx.moveTo(sx + size * 0.5, sy + size * 0.12);
    ctx.lineTo(sx + size * 0.88, sy + size * 0.85);
    ctx.lineTo(sx + size * 0.12, sy + size * 0.85);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = PAL.white;
    ctx.beginPath();
    ctx.moveTo(sx + size * 0.5, sy + size * 0.12);
    ctx.lineTo(sx + size * 0.62, sy + size * 0.4);
    ctx.lineTo(sx + size * 0.38, sy + size * 0.4);
    ctx.closePath();
    ctx.fill();
  } else if (type === T.ROAD) {
    px(sx, sy, size, size, PAL.black);
    px(sx + size * 0.15, sy + size * 0.35, size * 0.7, size * 0.3, "#665544");
    if (parity === 0) px(sx + size * 0.4, sy + size * 0.42, size * 0.12, size * 0.12, "#887766");
  } else if (type === T.SAND) {
    px(sx, sy, size, size, "#c8b878");
    ctx.fillStyle = "#b8a468";
    if (parity % 2 === 0) px(sx + size * 0.3, sy + size * 0.4, 1, 1, "#b8a468");
    px(sx + size * 0.6, sy + size * 0.65, 1, 1, "#b8a468");
  } else if (type === T.TOWN) {
    px(sx, sy, size, size, PAL.black);
    px(sx + size * 0.15, sy + size * 0.4, size * 0.7, size * 0.5, "#aa7733");
    px(sx + size * 0.25, sy + size * 0.15, size * 0.5, size * 0.35, PAL.gray);
    px(sx + size * 0.4, sy + size * 0.6, size * 0.2, size * 0.3, PAL.black);
  } else if (type === T.DUNGEON) {
    px(sx, sy, size, size, PAL.black);
    ctx.fillStyle = "#8833cc";
    ctx.beginPath(); ctx.arc(sx + size / 2, sy + size / 2, size * 0.32, 0, Math.PI * 2); ctx.fill();
    px(sx + size * 0.4, sy + size * 0.4, size * 0.2, size * 0.2, PAL.black);
  } else if (type === T.ISLAND) {
    px(sx, sy, size, size, PAL.water);
    ctx.strokeStyle = PAL.waterLight;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx + size * 0.05, sy + size * 0.85); ctx.lineTo(sx + size * 0.95, sy + size * 0.85);
    ctx.stroke();
    ctx.fillStyle = "#c8b878";
    ctx.beginPath(); ctx.arc(sx + size / 2, sy + size * 0.62, size * 0.32, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = PAL.greenDark;
    ctx.beginPath(); ctx.arc(sx + size * 0.4, sy + size * 0.42, size * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + size * 0.62, sy + size * 0.38, size * 0.14, 0, Math.PI * 2); ctx.fill();
  } else if (type === T.FLOOR) {
    px(sx, sy, size, size, "#141414");
    ctx.strokeStyle = "#2a2a2a";
    ctx.strokeRect(sx + 0.5, sy + 0.5, size - 1, size - 1);
  } else if (type === T.WALL) {
    drawBrick(sx, sy, size, gx, gy);
  } else if (type === T.DOOR) {
    px(sx, sy, size, size, "#553311");
    px(sx + size * 0.25, sy + size * 0.12, size * 0.5, size * 0.76, PAL.yellow);
  } else if (type === T.CHEST) {
    px(sx, sy, size, size, "#141414");
    px(sx + size * 0.15, sy + size * 0.4, size * 0.7, size * 0.45, "#664422");
    px(sx + size * 0.3, sy + size * 0.5, size * 0.4, size * 0.1, PAL.gold);
  } else if (type === T.SHOPKEEP || type === T.INNKEEPER) {
    px(sx, sy, size, size, "#141414");
    drawHuman(sx + size / 2, sy + size / 2, size, type === T.SHOPKEEP ? "#ff8833" : "#ffffff", "S");
  } else if (type === T.TAVERN) {
    px(sx, sy, size, size, "#141414");
    px(sx + size * 0.15, sy + size * 0.5, size * 0.7, size * 0.35, "#aa7733");
    px(sx + size * 0.3, sy + size * 0.2, size * 0.4, size * 0.35, "#664422");
  } else if (type === T.FOUNTAIN) {
    px(sx, sy, size, size, "#141414");
    ctx.fillStyle = PAL.waterLight;
    ctx.beginPath(); ctx.arc(sx + size / 2, sy + size / 2, size * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = PAL.white;
    ctx.beginPath(); ctx.arc(sx + size / 2, sy + size / 2, size * 0.14, 0, Math.PI * 2); ctx.fill();
  } else if (type === T.HEALER) {
    px(sx, sy, size, size, "#141414");
    drawHuman(sx + size / 2, sy + size / 2, size, "#ffee88", "S");
  } else if (type === T.ARMORY) {
    px(sx, sy, size, size, "#141414");
    drawHuman(sx + size / 2, sy + size / 2, size, PAL.gray, "S");
  } else if (type === T.KING) {
    px(sx, sy, size, size, "#141414");
    drawHuman(sx + size / 2, sy + size / 2, size, PAL.purple, "S");
    // small crown above the head
    ctx.fillStyle = PAL.yellow;
    px(sx + size * 0.42, sy + size * 0.06, size * 0.16, size * 0.08, PAL.yellow);
  } else if (type === T.STABLE) {
    px(sx, sy, size, size, "#141414");
    // simple stable-hand + a horse-head silhouette beside them
    drawHuman(sx + size * 0.32, sy + size / 2, size * 0.7, "#8a5a33", "S");
    ctx.fillStyle = "#8a5a33";
    px(sx + size * 0.6, sy + size * 0.35, size * 0.3, size * 0.2, "#8a5a33");
    px(sx + size * 0.78, sy + size * 0.25, size * 0.14, size * 0.18, "#8a5a33");
  } else if (type === T.PORTAL || type === T.MOON_PORTAL) {
    px(sx, sy, size, size, type === T.MOON_PORTAL ? "#2a2a3a" : PAL.black);
    var cx3 = sx + size / 2, cy3 = sy + size / 2;
    ctx.strokeStyle = "#cc66ff";
    ctx.lineWidth = 2;
    for (var ring = 0; ring < 3; ring++) {
      ctx.beginPath();
      ctx.arc(cx3, cy3, size * (0.14 + ring * 0.09), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.fillStyle = "#eeccff";
    ctx.beginPath();
    ctx.arc(cx3, cy3, size * 0.08, 0, Math.PI * 2);
    ctx.fill();
  } else if (type === T.MOON_GRASS) {
    px(sx, sy, size, size, "#4a4a52");
    ctx.fillStyle = "#5a5a62";
    var pat3 = (gx * 3 + gy * 7) % 5;
    px(sx + 1, sy + 1, 1, 1, "#6a6a72");
    if (pat3 === 0) px(sx + 5, sy + 3, 1, 1, "#6a6a72");
    if (pat3 === 1) px(sx + 3, sy + 5, 1, 1, "#3a3a42");
  } else if (type === T.MOON_SHOP) {
    px(sx, sy, size, size, "#1a1a22");
    drawHuman(sx + size / 2, sy + size / 2, size, "#66ccff", "S");
  } else if (type === T.HUT || type === T.MOAI || type === T.SHRINE || type === T.CHURCH ||
             type === T.GARDEN_FOUNTAIN || type === T.ASIA_CASTLE) {
    // these landmarks sit on ordinary grass — draw the grass texture
    // underneath, and let the emoji itself be drawn in a later pass
    // (see renderMap's second pass) so it can never be clipped by a
    // neighboring tile
    drawTile(sx, sy, size, T.GRASS, gx, gy);
  } else if (type === T.VOLCANO) {
    px(sx, sy, size, size, "#2a1a15");
  } else if (type === T.GRAVE) {
    px(sx, sy, size, size, "#1a1a1a");
  } else if (type === T.BRIDGE) {
    px(sx, sy, size, size, "#8a6a3a");
    ctx.strokeStyle = "#5a3a1a";
    ctx.lineWidth = 1;
    for (var bxi = 2; bxi < size; bxi += 4) {
      ctx.beginPath(); ctx.moveTo(sx + bxi, sy); ctx.lineTo(sx + bxi, sy + size); ctx.stroke();
    }
  } else if (type === T.BED) {
    // decoration on the room's normal floor — emoji drawn in the second
    // pass (see renderMap) to avoid the clipping bug
    drawTile(sx, sy, size, T.FLOOR, gx, gy);
  } else if (type === T.HUT_NPC) {
    px(sx, sy, size, size, "#241f18");
    drawHuman(sx + size / 2, sy + size / 2, size, "#cc8844", "S");
  } else if (type === T.MOURNER) {
    // decoration on grass (cemetery ground) — same reasoning
    drawTile(sx, sy, size, T.GRASS, gx, gy);
  } else if (type === T.HORSE) {
    px(sx, sy, size, size, PAL.greenDark);
    drawHorseSprite(sx, sy, size);
  } else if (type === T.SHIP) {
    drawShipSprite(sx, sy, size);
  }
}

// A proper little ship silhouette: hull, mast, sail, flag — used both for
// the map marker and the pirate arena's beached/anchored ship.
function drawShipSprite(sx, sy, size) {
  px(sx, sy, size, size, PAL.water);
  ctx.strokeStyle = PAL.waterLight;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(sx + size * 0.05, sy + size * 0.9);
  ctx.lineTo(sx + size * 0.95, sy + size * 0.9);
  ctx.stroke();

  // hull
  ctx.fillStyle = "#6a4526";
  ctx.beginPath();
  ctx.moveTo(sx + size * 0.1, sy + size * 0.62);
  ctx.lineTo(sx + size * 0.9, sy + size * 0.62);
  ctx.lineTo(sx + size * 0.72, sy + size * 0.86);
  ctx.lineTo(sx + size * 0.28, sy + size * 0.86);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#8a5a33";
  px(sx + size * 0.12, sy + size * 0.58, size * 0.76, size * 0.08, "#8a5a33");

  // mast
  ctx.fillStyle = "#4a3018";
  px(sx + size * 0.48, sy + size * 0.12, size * 0.05, size * 0.5, "#4a3018");

  // sail
  ctx.fillStyle = "#e8e0c8";
  ctx.beginPath();
  ctx.moveTo(sx + size * 0.5, sy + size * 0.14);
  ctx.lineTo(sx + size * 0.5, sy + size * 0.52);
  ctx.lineTo(sx + size * 0.78, sy + size * 0.5);
  ctx.closePath();
  ctx.fill();

  // small flag on top
  ctx.fillStyle = PAL.red;
  ctx.beginPath();
  ctx.moveTo(sx + size * 0.53, sy + size * 0.1);
  ctx.lineTo(sx + size * 0.68, sy + size * 0.14);
  ctx.lineTo(sx + size * 0.53, sy + size * 0.18);
  ctx.closePath();
  ctx.fill();
}

// Generic single-emoji landmark tile, used for the simpler new locations
// (hut, moai, shrine, church, garden fountain, volcano, grave, castle).
function drawEmojiTile(sx, sy, size, glyph) {
  ctx.save();
  ctx.font = Math.round(size * 0.7) + "px serif"; // slight margin against wide multi-part glyphs
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(glyph, sx + size / 2, sy + size / 2 + 1);
  ctx.restore();
}

function drawCross(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x - 1, y, 3, 1);
  ctx.fillRect(x, y - 1, 1, 3);
}

function drawBrick(sx, sy, size, gx, gy) {
  px(sx, sy, size, size, PAL.brickDark);
  var rows = 4;
  var rowH = size / rows;
  for (var r = 0; r < rows; r++) {
    var yOff = sy + r * rowH;
    var brickW = size / 2;
    var offsetX = (r % 2 === 0) ? 0 : brickW / 2;
    for (var bx = -brickW; bx < size + brickW; bx += brickW) {
      px(sx + bx + offsetX + 1, yOff + 1, brickW - 2, rowH - 2, PAL.brick);
    }
  }
}

// ============================================================
// SPRITES — small but visibly colored humanoids like the reference
// ============================================================
function drawHuman(cx, cy, tileSize, tunicColor, facing) {
  var s = tileSize / 32; // scale relative to a 32px baseline figure
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);

  // legs
  ctx.fillStyle = "#333333";
  ctx.fillRect(-5, 6, 4, 7);
  ctx.fillRect(1, 6, 4, 7);

  // tunic/body
  ctx.fillStyle = tunicColor;
  ctx.fillRect(-6, -5, 12, 12);

  // arms
  ctx.fillStyle = tunicColor;
  ctx.fillRect(-9, -3, 3, 8);
  ctx.fillRect(6, -3, 3, 8);

  // head
  ctx.fillStyle = PAL.skin;
  ctx.fillRect(-4, -13, 8, 8);

  // hair
  ctx.fillStyle = "#553322";
  ctx.fillRect(-4, -14, 8, 3);

  // weapon glint (small bright line) except when facing away
  if (facing !== "N") {
    ctx.fillStyle = "#dddddd";
    ctx.fillRect(9, -2, 2, 10);
  }

  ctx.restore();
}

function drawPartyLeader(cx, cy, tileSize, facing, mounted, sailing, vehicleType) {
  if (sailing) {
    drawShipSprite(cx - tileSize / 2, cy - tileSize / 2, tileSize);
  } else if (mounted && vehicleType === "car") {
    drawCarSprite(cx - tileSize / 2, cy - tileSize / 2, tileSize);
  } else if (mounted && vehicleType === "helicopter") {
    drawHelicopterSprite(cx - tileSize / 2, cy - tileSize / 2, tileSize);
  } else if (mounted) {
    drawMountedRider(cx, cy, tileSize, facing);
  } else {
    drawHuman(cx, cy, tileSize, party[0].color, facing);
  }
}

// Horse-and-rider look while mounted, drawn with emoji for a quick, clear
// "you are riding" read at a glance. Emoji glyphs are inherently one fixed
// orientation, so we flip horizontally when facing west for a bit of life.
function drawMountedRider(cx, cy, tileSize, facing) {
  ctx.save();
  ctx.translate(cx, cy);
  if (facing === "W") ctx.scale(-1, 1);
  ctx.font = Math.round(tileSize * 0.9) + "px serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("🐎", 0, 2);
  ctx.restore();
}

// Landmark tiles whose emoji is drawn in the second render pass (see
// renderMap) rather than baked into drawTile — avoids the clipping bug
// where a wide glyph bleeds into a neighboring tile that hasn't been
// painted yet.
var LANDMARK_EMOJI = {};
LANDMARK_EMOJI[T.HUT] = "🛖";
LANDMARK_EMOJI[T.MOAI] = "🗿";
LANDMARK_EMOJI[T.SHRINE] = "⛩️";
LANDMARK_EMOJI[T.CHURCH] = "⛪️";
LANDMARK_EMOJI[T.GARDEN_FOUNTAIN] = "⛲️";
LANDMARK_EMOJI[T.VOLCANO] = "🌋";
LANDMARK_EMOJI[T.ASIA_CASTLE] = "🏯";
LANDMARK_EMOJI[T.GRAVE] = "🪦";
LANDMARK_EMOJI[T.BED] = "🛏️";
LANDMARK_EMOJI[T.MOURNER] = "🧎";

var MONSTER_EMOJI = {
  "Orc": "👹",
  "Skeleton": "💀",
  "Giant Rat": "🐀",
  "Sea Serpent": "🐉",
  "Snake": "🐍",
  "Pirate": "🥷",
  "Alien": "👽",
  "Wizard": "🧙‍♂️",
  "Troll": "🧌",
  "Vampire": "🧛🏻",
  "Zombie": "🧟‍♂️",
  "Genie": "🧞‍♂️",
  "Fairy": "🧚🏻‍♀️",
  "Giant Wasp": "🦟",
  "Scorpion": "🦂",
  "Kraken": "🦑",
  "Bat": "🦇",
  "Wolf": "🐺",
  "Giant Eagle": "🦅",
  "Monkey": "🐒",
  "Yeti": "🫈"
  // Guard and Wild Horse are NOT in this map — they use their own drawn
  // pixel-art sprites (drawGuard/existing horse art), not emoji.
};

// Standalone horse silhouette (no rider, no assumed background) — the
// exact pixel-art look you approved, reused for both the map landmark
// and the Wild Horse combat encounter (no emoji needed here).
function drawHorseSprite(sx, sy, size) {
  ctx.fillStyle = "#8a5a33";
  px(sx + size * 0.2, sy + size * 0.35, size * 0.55, size * 0.3, "#8a5a33");
  px(sx + size * 0.65, sy + size * 0.2, size * 0.18, size * 0.25, "#8a5a33");
  px(sx + size * 0.25, sy + size * 0.62, size * 0.12, size * 0.28, "#5a3a1f");
  px(sx + size * 0.55, sy + size * 0.62, size * 0.12, size * 0.28, "#5a3a1f");
}

// Car and helicopter are simple emoji sprites — no need for hand-drawn
// pixel art like the horse/ship, they're new enough to keep lightweight.
function drawCarSprite(sx, sy, size) {
  ctx.save();
  ctx.font = Math.round(size * 0.72) + "px serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("🏎️", sx + size / 2, sy + size / 2 + 1);
  ctx.restore();
}
function drawHelicopterSprite(sx, sy, size) {
  ctx.save();
  ctx.font = Math.round(size * 0.72) + "px serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("🚁", sx + size / 2, sy + size / 2 + 1);
  ctx.restore();
}
function drawRocketSprite(sx, sy, size) {
  ctx.save();
  ctx.font = Math.round(size * 0.72) + "px serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("🚀", sx + size / 2, sy + size / 2 + 1);
  ctx.restore();
}

function drawMonster(cx, cy, tileSize, name) {
  if (name === "Guard") { drawHuman(cx, cy, tileSize, "#1a2a6a", "S"); return; } // dark blue uniform
  if (name === "Wild Horse") { drawHorseSprite(cx - tileSize / 2, cy - tileSize / 2, tileSize); return; }
  var glyph = MONSTER_EMOJI[name] || "👹";
  ctx.save();
  ctx.translate(cx, cy);
  // Slightly smaller than a full tile — some emoji are multi-codepoint
  // sequences (ZWJ, like the wizard/zombie/genie/fairy) that render wider
  // than a single glyph at the same font size, so this keeps a safety
  // margin on every side rather than assuming a uniform glyph width.
  ctx.font = Math.round(tileSize * 0.72) + "px serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(glyph, 0, 1);
  ctx.restore();
}

// ============================================================
// MAP RENDER
// ============================================================
// Effective vision radius: normally the full viewport half-width, but
// forest fog shrinks it a lot when you're standing in or right next to
// a forest patch.
function currentVisionRadius() {
  var half = Math.floor(VIEW_TILES / 2);
  if (state.mode !== "overworld") return half; // fog only applies outdoors
  var here = tileAt(state.x, state.y);
  if (here === T.FOREST) return 3;
  var deltas = [[-1, 0], [1, 0], [0, -1], [0, 1]];
  for (var i = 0; i < deltas.length; i++) {
    if (tileAt(state.x + deltas[i][0], state.y + deltas[i][1]) === T.FOREST) return 3;
  }
  return half;
}

// A tile is hidden behind a mountain if a mountain sits strictly between
// the player and that tile along the same rough line (simple radius-based
// occlusion, not full raycasting).
function blockedByMountain(gx, gy) {
  if (state.mode !== "overworld") return false;
  var dx = gx - state.x, dy = gy - state.y;
  var steps = Math.max(Math.abs(dx), Math.abs(dy));
  if (steps <= 1) return false;
  var stepX = dx / steps, stepY = dy / steps;
  for (var s = 1; s < steps; s++) {
    var px2 = Math.round(state.x + stepX * s);
    var py2 = Math.round(state.y + stepY * s);
    if (tileAt(px2, py2) === T.MOUNTAIN) return true;
  }
  return false;
}

function renderMap() {
  var half = Math.floor(VIEW_TILES / 2);
  var visionR = currentVisionRadius();
  var fogActive = visionR < half; // only carve the view down when fog is actually in effect (near forest)

  // Pass 1: terrain, ground items, parked ship/horse — every tile fully
  // painted before anything is drawn on top of it.
  for (var vy = 0; vy < VIEW_TILES; vy++) {
    for (var vx = 0; vx < VIEW_TILES; vx++) {
      var gx = state.x - half + vx;
      var gy = state.y - half + vy;
      var t = tileAt(gx, gy);
      var sx = MAP_INNER_X0 + vx * TILE;
      var sy = MAP_INNER_Y0 + vy * TILE;

      var outOfVision = fogActive && Math.max(Math.abs(gx - state.x), Math.abs(gy - state.y)) > visionR;
      var hiddenByMountain = blockedByMountain(gx, gy);

      if (t === null || outOfVision || hiddenByMountain) {
        px(sx, sy, TILE, TILE, PAL.black);
        continue;
      }
      drawTile(sx, sy, TILE, t, gx, gy);

      var ground = groundItemAt(state.mode, gx, gy);
      if (ground) drawGroundItem(sx, sy, TILE, ground);

      // the player's own ship, docked wherever they last left it — drawn
      // dynamically (not baked into the map grid) so it can move/park
      if (ship.owned && !state.sailing && ship.screen === state.mode && ship.x === gx && ship.y === gy) {
        drawShipSprite(sx, sy, TILE);
      }
      if (rocket.owned && rocket.screen === state.mode && rocket.x === gx && rocket.y === gy) {
        drawRocketSprite(sx, sy, TILE);
      }

      // the player's own horse, parked wherever they last dismounted
      if (horse.owned && !state.mounted && horse.screen === state.mode && horse.x === gx && horse.y === gy) {
        drawHorseSprite(sx, sy, TILE);
      }
      if (car.owned && !state.mounted && car.screen === state.mode && car.x === gx && car.y === gy) {
        drawCarSprite(sx, sy, TILE);
      }
      if (helicopter.owned && !state.mounted && helicopter.screen === state.mode && helicopter.x === gx && helicopter.y === gy) {
        drawHelicopterSprite(sx, sy, TILE);
      }

      if (wildHorseAt(gx, gy, state.mode)) {
        drawTile(sx, sy, TILE, T.HORSE, gx, gy);
      }

      var roamingNpcHere = roamingNpcs.find(function (e) { return e.screen === state.mode && e.x === gx && e.y === gy; });
      if (roamingNpcHere) {
        drawHuman(sx + TILE / 2, sy + TILE / 2, TILE, roamingNpcHere.kind === "armory" ? PAL.gray : "#ff8833", "S");
      }
      var stableHorseHere = stableHorses.find(function (e) { return e.screen === state.mode && e.x === gx && e.y === gy; });
      if (stableHorseHere) {
        drawHorseSprite(sx, sy, TILE);
      }

      var tornadoHere = tornadoes.find(function (t) { return t.screen === state.mode && t.x === gx && t.y === gy; });
      if (tornadoHere) {
        ctx.save();
        ctx.font = Math.round(TILE * 0.72) + "px serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("🌪️", sx + TILE / 2, sy + TILE / 2 + 1);
        ctx.restore();
      }
    }
  }

  // Pass 2: monsters, drawn on top of every already-finished tile, so an
  // emoji that renders slightly wider than one tile overlaps a neighbor
  // that's already fully painted instead of being clipped by it.
  for (var mi = 0; mi < mapMonsters.length; mi++) {
    var mm = mapMonsters[mi];
    if (mm.screen !== state.mode) continue;
    var mvx = mm.x - (state.x - half), mvy = mm.y - (state.y - half);
    if (mvx < 0 || mvx >= VIEW_TILES || mvy < 0 || mvy >= VIEW_TILES) continue;
    var msx = MAP_INNER_X0 + mvx * TILE, msy = MAP_INNER_Y0 + mvy * TILE;
    drawMonster(msx + TILE / 2, msy + TILE / 2, TILE, mm.name);
  }

  // Pass 2b: landmark emoji (hut, moai, shrine, church, garden fountain,
  // volcano, castle, grave) — same reasoning as monsters above.
  for (var lvy = 0; lvy < VIEW_TILES; lvy++) {
    for (var lvx = 0; lvx < VIEW_TILES; lvx++) {
      var lgx = state.x - half + lvx, lgy = state.y - half + lvy;
      var lt = tileAt(lgx, lgy);
      var glyph = LANDMARK_EMOJI[lt];
      if (!glyph) continue;
      var lsx = MAP_INNER_X0 + lvx * TILE, lsy = MAP_INNER_Y0 + lvy * TILE;
      drawEmojiTile(lsx, lsy, TILE, glyph);
    }
  }

  drawPartyLeader(MAP_INNER_X0 + half * TILE + TILE / 2, MAP_INNER_Y0 + half * TILE + TILE / 2, TILE, state.facing, state.mounted, state.sailing, state.vehicleType);
}

function wildHorseAt(gx, gy, screenKey) {
  for (var i = 0; i < wildHorses.length; i++) {
    var wh = wildHorses[i];
    if (wh.screen === screenKey && wh.x === gx && wh.y === gy) return true;
  }
  return false;
}

function drawGroundItem(sx, sy, size, ground) {
  if (ground.kind === "gold") {
    px(sx + size * 0.15, sy + size * 0.4, size * 0.7, size * 0.45, "#664422");
    px(sx + size * 0.3, sy + size * 0.5, size * 0.4, size * 0.1, PAL.gold);
  } else {
    ctx.fillStyle = ground.category === "potion" ? "#ff44ff" : (ground.category === "weapon" ? "#cccccc" : "#4488ff");
    ctx.beginPath();
    ctx.arc(sx + size / 2, sy + size / 2, size * 0.18, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ============================================================
// PARTY STRIPS — two members top (compact single-line cards side
// by side), two members bottom, matching "Name CLS M:xx L:xx
// H:xxxx F:xxxx" but condensed to fit a horizontal strip.
// ============================================================
function drawPartyMini(x, y, w, h, p) {
  ctx.strokeStyle = PAL.purple;
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);

  ctx.font = "bold 13px 'Courier New', monospace";
  ctx.fillStyle = p.alive ? PAL.white : PAL.red;
  ctx.textAlign = "left";
  ctx.fillText(p.name, x + 6, y + 15);

  ctx.font = "bold 11px 'Courier New', monospace";
  ctx.fillStyle = PAL.gold;
  ctx.textAlign = "right";
  ctx.fillText(sharedGold + "G", x + w - 4, y + 15);
  ctx.textAlign = "left";

  ctx.font = "11px 'Courier New', monospace";
  ctx.fillStyle = PAL.white;
  var line1 = p.cls + " M:" + pad2(p.mana) + " L:" + pad2(p.lvl);
  ctx.fillText(line1, x + 6, y + 29);

  var line2 = "H:" + pad4(Math.max(0, p.hp)) + " F:" + pad4(p.food);
  ctx.fillText(line2, x + 6, y + 42);
}

// hit-testable rect for each party slot's mini card — shared by the
// renderers below and the click handler that opens the character sheet
function partyMiniRect(idx) {
  var half = LW / 2;
  if (idx === 0) return { x: 2, y: 2, w: half - 4, h: TOPBAR_H - 4 };
  if (idx === 1) return { x: half + 2, y: 2, w: half - 4, h: TOPBAR_H - 4 };
  if (idx === 2) return { x: 2, y: BOTBAR_Y0, w: half - 4, h: BOTBAR_H - 2 };
  return { x: half + 2, y: BOTBAR_Y0, w: half - 4, h: BOTBAR_H - 2 };
}

function renderTopBar() {
  px(0, 0, LW, TOPBAR_H, PAL.black);
  var r0 = partyMiniRect(0), r1 = partyMiniRect(1);
  drawPartyMini(r0.x, r0.y, r0.w, r0.h, party[0]);
  drawPartyMini(r1.x, r1.y, r1.w, r1.h, party[1]);
}

function renderBottomBar() {
  px(0, BOTBAR_Y0, LW, BOTBAR_H, PAL.black);
  var r2 = partyMiniRect(2), r3 = partyMiniRect(3);
  drawPartyMini(r2.x, r2.y, r2.w, r2.h, party[2]);
  drawPartyMini(r3.x, r3.y, r3.w, r3.h, party[3]);
}

// ============================================================
// LOG / DESCRIPTION TEXT — bottom-most strip
// ============================================================
function renderLogArea() {
  px(0, LOG_Y0, LW, LH - LOG_Y0, PAL.black);
  ctx.strokeStyle = PAL.purpleDark;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, LOG_Y0 + 0.5);
  ctx.lineTo(LW, LOG_Y0 + 0.5);
  ctx.stroke();

  ctx.font = "12px 'Courier New', monospace";
  ctx.textAlign = "left";
  var lineH = 15;
  var maxLines = Math.floor((LH - LOG_Y0 - 6) / lineH);
  var maxWidth = LW - 12; // small margin on both sides

  // word-wrap each log entry into however many lines it actually needs,
  // so a long message (like the moai flavor text) never runs off the
  // edge of the canvas and gets silently clipped
  var wrapped = [];
  for (var k = Math.max(0, log.length - maxLines * 3); k < log.length; k++) {
    var msg = log[k];
    var isHeader = msg.indexOf("-----") === 0;
    var lines = wrapText(msg, maxWidth);
    lines.forEach(function (ln) { wrapped.push({ text: ln, header: isHeader }); });
  }
  var recent = wrapped.slice(-maxLines);
  for (var j = 0; j < recent.length; j++) {
    ctx.fillStyle = recent[j].header ? PAL.purple : PAL.white;
    ctx.fillText(recent[j].text, 6, LOG_Y0 + j * lineH + 13);
  }
}

// Splits a string into lines that each fit within maxWidth at the
// current canvas font, breaking on word boundaries (falls back to a
// hard character break only if a single "word" is wider than the line).
function wrapText(text, maxWidth) {
  var words = text.split(" ");
  var lines = [];
  var current = "";
  for (var i = 0; i < words.length; i++) {
    var candidate = current ? current + " " + words[i] : words[i];
    if (ctx.measureText(candidate).width <= maxWidth) {
      current = candidate;
    } else {
      if (current) lines.push(current);
      current = words[i];
      // extremely long single word — hard-break it so it doesn't just
      // overflow anyway
      while (ctx.measureText(current).width > maxWidth && current.length > 1) {
        var cut = current.length - 1;
        while (cut > 1 && ctx.measureText(current.slice(0, cut)).width > maxWidth) cut--;
        lines.push(current.slice(0, cut));
        current = current.slice(cut);
      }
    }
  }
  if (current) lines.push(current);
  return lines.length ? lines : [""];
}

function pad2(n) { n = Math.max(0, n); var s = "" + n; while (s.length < 2) s = "0" + s; return s; }
function pad4(n) { n = Math.max(0, n); var s = "" + n; while (s.length < 4) s = "0" + s; return s; }

function renderAll() {
  resizeCanvasCss();
  px(0, 0, LW, LH, PAL.black);
  if (state.mode === "combat") {
    renderCombatScreen();
  } else {
    renderTopBar();
    drawMapBorder();
    renderMap();
    renderBottomBar();
    renderLogArea();
  }
  if (townScreen) renderTownScreenOverlay();
  if (characterSheetIndex !== null) renderCharacterSheetOverlay();

  // FIRE button only makes sense while actually sailing, out on the map
  // (not in combat, not in a town popup)
  var fireBtn = document.getElementById("btnFire");
  fireBtn.style.display = (state.sailing && state.mode !== "combat") ? "inline-block" : "none";

  // DISMOUNT shows whenever mounted, out on the map
  var dismountBtn = document.getElementById("btnDismount");
  dismountBtn.style.display = (state.mounted && state.mode !== "combat") ? "inline-block" : "none";

  // TAME only shows when a wild horse is actually adjacent
  var tameBtn = document.getElementById("btnTame");
  tameBtn.style.display = (state.mode !== "combat" && !townScreen && wildHorseAdjacent()) ? "inline-block" : "none";

  // SHOOT only shows in combat, while a ranged weapon (Bow/Boomerang) is
  // actually equipped
  var shootBtn = document.getElementById("btnShoot");
  var leaderWeapon = party[0] && party[0].equippedWeapon;
  shootBtn.style.display = (state.mode === "combat" && leaderWeapon && leaderWeapon.ranged) ? "inline-block" : "none";
}

// ============================================================
// FULL-SCREEN COMBAT VIEW — replaces the map entirely during a fight
// ============================================================
function renderCombatScreen() {
  px(0, 0, LW, LH, PAL.black);

  renderTopBar(); // keep the top two party cards visible, same as the overworld
  drawMapBorder(); // reuse the same border chrome — coordinate readout + loc banner
  renderArena();
  renderBottomBar();
  renderLogArea();

  if (confirmingRun) renderRunConfirmDialog();
}

// The actual skirmish grid — same tile size/viewport as the overworld map,
// just rendering the bounded arena room instead of the world.
function renderArena() {
  var grid = combat.arenaGrid;
  for (var row = 0; row < ARENA_H; row++) {
    for (var col = 0; col < ARENA_W; col++) {
      var sx = MAP_INNER_X0 + col * TILE;
      var sy = MAP_INNER_Y0 + row * TILE;
      drawTile(sx, sy, TILE, grid[row][col], col, row);
    }
  }
  // monsters
  combat.monsters.forEach(function (m) {
    if (m.hp <= 0) return;
    var sx = MAP_INNER_X0 + m.x * TILE, sy = MAP_INNER_Y0 + m.y * TILE;
    drawMonster(sx + TILE / 2, sy + TILE / 2, TILE, m.name);
  });
  // party members, leader drawn with facing, others as plain humans
  party.forEach(function (p, i) {
    if (!p.alive) return;
    var sx = MAP_INNER_X0 + p.ax * TILE, sy = MAP_INNER_Y0 + p.ay * TILE;
    if (i === 0) drawPartyLeader(sx + TILE / 2, sy + TILE / 2, TILE, state.facing);
    else drawHuman(sx + TILE / 2, sy + TILE / 2, TILE, p.color, "S");
  });
}

function runConfirmRects() {

}

// ============================================================
// TOWN SERVICE OVERLAYS — shop / tavern / fountain, rendered as a

function renderTownScreenOverlay() {
  px(20, 60, LW - 40, LH - 200, "#0a0a0a");
  ctx.strokeStyle = PAL.purple;
  ctx.lineWidth = 3;
  ctx.strokeRect(21, 61, LW - 42, LH - 202);

  ctx.textAlign = "center";
  ctx.fillStyle = PAL.white;
  ctx.font = "bold 16px 'Courier New', monospace";
  var title = townScreen === "shop" ? "WEAPONSMITH" : townScreen === "armory" ? "ARMORY"
    : townScreen === "tavern" ? "TAVERN" : townScreen === "fountain" ? "FOUNTAIN"
    : townScreen === "king" ? "THRONE ROOM" : townScreen === "stable" ? "STABLE"
    : townScreen === "moonshop" ? "LUNAR ARMORY" : townScreen === "hutGift" ? "A KINDLY STRANGER" : "HEALER";
  ctx.fillText(title, LW / 2, 90);
  ctx.textAlign = "left";
  ctx.font = "12px 'Courier New', monospace";

  // close X, always top-right of the popup
  drawCloseX();

  var y = 115;
  if (townScreen === "shop") {
    ctx.fillStyle = PAL.gold;
    ctx.fillText("Gold: " + sharedGold, 36, y); y += 22;
    ctx.fillStyle = PAL.white;
    LOOT_TABLE.weapon.forEach(function (w, i) {
      var price = (i + 1) * 25;
      var rangedTag = w.ranged ? (" [range " + w.range + (w.returns ? ", returns" : "") + "]") : "";
      ctx.fillText((w.emoji || "") + " " + w.name + " (+" + w.dmgBonus + " dmg)" + rangedTag + " - " + price + "g  [tap W" + (i + 1) + "]", 36, y); y += 18;
    });
    ctx.fillText("Potion (heal 20) - 12g  [tap P]", 36, y); y += 18;
  } else if (townScreen === "armory") {
    ctx.fillStyle = PAL.gold;
    ctx.fillText("Gold: " + sharedGold, 36, y); y += 22;
    ctx.fillStyle = PAL.white;
    LOOT_TABLE.armor.forEach(function (a, i) {
      var price = (i + 1) * 30;
      ctx.fillText(a.name + " (+" + a.defBonus + " def) - " + price + "g  [tap A" + (i + 1) + "]", 36, y); y += 18;
    });
  } else if (townScreen === "king") {
    ctx.fillStyle = PAL.white;
    ctx.fillText("\"Welcome, traveler.\"", 36, y); y += 20;
    ctx.fillText("\"I have no task for thee at present.\"", 36, y); y += 20;
    ctx.fillStyle = PAL.gray;
    ctx.fillText("(quests coming soon)", 36, y); y += 18;
  } else if (townScreen === "stable") {
    ctx.fillStyle = PAL.gold;
    ctx.fillText("Gold: " + sharedGold, 36, y); y += 22;
    ctx.fillStyle = PAL.white;
    if (state.mounted) {
      ctx.fillText("You already have a horse.", 36, y); y += 18;
    } else {
      ctx.fillText("Horse - 50g  [tap H]", 36, y); y += 18;
    }
  } else if (townScreen === "moonshop") {
    ctx.fillStyle = PAL.gold;
    ctx.fillText("Gold: " + sharedGold, 36, y); y += 22;
    ctx.fillStyle = PAL.white;
    ctx.fillText(MOON_ARMOR.name + " (+" + MOON_ARMOR.defBonus + " def) - 200g  [tap M]", 36, y); y += 18;
  } else if (townScreen === "tavern") {
    if (tavernRecruit) {
      ctx.fillStyle = PAL.white;
      ctx.fillText("Name: " + tavernRecruit.name, 36, y); y += 18;
      ctx.fillText("Race: " + tavernRecruit.race, 36, y); y += 18;
      ctx.fillText("Class: " + tavernRecruit.clsLabel, 36, y); y += 18;
      ctx.fillText("HP: " + tavernRecruit.maxHp, 36, y); y += 26;
      ctx.fillStyle = PAL.yellow;
      ctx.fillText("Retire whom to make room?", 36, y); y += 20;
      party.forEach(function (p, i) {
        ctx.fillStyle = PAL.white;
        ctx.fillText((i + 1) + ". " + p.name + " (" + p.cls + ")  [tap R" + (i + 1) + "]", 36, y);
        y += 18;
      });
    }
  } else if (townScreen === "fountain") {
    ctx.fillStyle = PAL.waterLight;
    ctx.fillText("The water is free to all.", 36, y); y += 22;
    ctx.fillStyle = PAL.white;
    ctx.fillText("Drink & restore party HP  [tap H]", 36, y); y += 18;
  } else if (townScreen === "healer" || townScreen === "church") {
    ctx.fillStyle = PAL.white;
    ctx.fillText("\"Coin buys back a soul.\"", 36, y); y += 22;
    var anyDead = false;
    party.forEach(function (p, i) {
      if (!p.alive) {
        anyDead = true;
        ctx.fillStyle = PAL.red;
        ctx.fillText("Revive " + p.name + " (" + p.reviveCost + "g)  [tap V" + (i + 1) + "]", 36, y);
        y += 18;
      }
    });
    if (!anyDead) {
      ctx.fillStyle = PAL.gray;
      ctx.fillText("No one here needs reviving.", 36, y); y += 18;
    }
  } else if (townScreen === "hutGift") {
    ctx.fillStyle = PAL.white;
    ctx.fillText("Give a gift to be healed:", 36, y); y += 20;
    ctx.fillText("Gold (" + Math.min(sharedGold, 20) + "g)  [tap G]", 36, y); y += 18;
    ctx.fillText("Potion (have " + potionCount + ")  [tap P]", 36, y); y += 18;
    if (party[0].equippedWeapon) {
      ctx.fillText("Your " + party[0].equippedWeapon.name + "  [tap W]", 36, y); y += 18;
    }
    if (party[0].armorBonus > 0) {
      ctx.fillText("Your armor  [tap A]", 36, y); y += 18;
    }
  }
}

// ============================================================
// CHARACTER SHEET — opened by tapping a party member's mini card in
// the top/bottom bars; shows race/class, core stats, equipment, and
// known spells for that one character.
// ============================================================
function renderCharacterSheetOverlay() {
  var p = party[characterSheetIndex];
  if (!p) { characterSheetIndex = null; return; }

  px(20, 60, LW - 40, LH - 200, "#0a0a0a");

  ctx.strokeRect(21, 61, LW - 42, LH - 202);

  ctx.textAlign = "center";
  ctx.fillStyle = p.alive ? PAL.white : PAL.red;
  ctx.font = "bold 16px 'Courier New', monospace";
  ctx.fillText(p.name + (p.alive ? "" : " (fallen)"), LW / 2, 90);
  ctx.textAlign = "left";
  ctx.font = "12px 'Courier New', monospace";

  drawCloseX();

  var y = 115;
  ctx.fillStyle = PAL.gray;
  var subtitle = (p.race || "Unknown") + " " + (p.clsLabel || classLabel(p.cls));
  if (p.title) subtitle += " \"" + p.title + "\"";
  ctx.fillText(subtitle, 36, y); y += 24;

  ctx.fillStyle = PAL.white;
  ctx.fillText("Level " + p.lvl + "   XP " + p.xp, 36, y); y += 18;
  ctx.fillText("HP " + Math.max(0, p.hp) + "/" + p.maxHp + "   Mana " + p.mana, 36, y); y += 18;
  ctx.fillText("Food " + p.food, 36, y); y += 26;

  ctx.fillText("Equipment", 36, y); y += 18;
  ctx.fillStyle = PAL.white;
  ctx.fillText("Weapon: " + (p.equippedWeapon ? p.equippedWeapon.name + " (+" + p.equippedWeapon.dmgBonus + " dmg)" : "None"), 36, y); y += 18;
  ctx.fillText("Armor: " + (p.armorBonus > 0 ? "+" + p.armorBonus + " def" : "None"), 36, y); y += 26;

  ctx.fillStyle = PAL.yellow;
  ctx.fillText("Spells", 36, y); y += 18;
  var spells = SPELLS[p.cls] || [];
  if (spells.length === 0) {
    ctx.fillStyle = PAL.gray;
    ctx.fillText("No spells known", 36, y); y += 18;
  } else {
    ctx.fillStyle = PAL.white;
    spells.forEach(function (s) {
      ctx.fillText(s.name + " (" + s.cost + " mana)", 36, y); y += 18;
    });
