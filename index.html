}
// Turns in all 3 robot parts for the Moon King's reward — reassembles
// the future man and grants the rocket, parked out on the moon's
// surface (see ROCKET_MOON_PAD), to fly to Cyber World.
function turnInRobotParts() {
  if (!(hasGearPart && hasArmPart && hasLegPart) || futureManComplete) return;
  futureManComplete = true;
  hasCyberRocket = true;
  rocket.owned = true;
  rocket.screen = "moon";
  rocket.x = ROCKET_MOON_PAD.x; rocket.y = ROCKET_MOON_PAD.y;
  pushLog("-----Quest Complete!-----");
  pushLog("The Moon King assembles the parts before your eyes.");
  pushLog("The man of the future stirs, and speaks:");
  pushLog("\"I am from a world beyond your time — Cyber World.");
  pushLog("You must fly there by rocket ship to see it.\"");
  pushLog("\"Take this,\" says the Moon King. \"A rocket built for");
  pushLog("one more voyage. It awaits you out on the surface.\"");
  townScreen = null;
  renderAll();
}
function openRobotKing() {
  townScreen = "robotKing";
  pushLog("-----The Robot King-----");
  pushLog("\"Welcome, traveler. I am the one you rebuilt —");
  pushLog("a man of the future, sent to Earth long ago.\"");
  pushLog("\"This is Cyber World, and it is dying. The aliens,");
  pushLog("spiteful after their defeat, sent zombies to destroy us.");
  pushLog("We are not built to harm — we cannot fight them.\"");
  if (!cyberWeaponsGiven) {
    cyberWeaponsGiven = true;
    for (var i = 0; i < party.length; i++) inventory.push({ category: "weapon", item: CYBER_BLASTER });
    pushLog("\"But we have made you weapons. Use them well.\"");
    pushLog("Received " + party.length + " Cyber Blasters!");
  } else {
    pushLog("\"Stay sharp out there.\"");
  }
  renderAll();
}
function openVaultChest(x, y) {
  var grid = currentGrid();
  if (grid[y][x] !== T.CHEST) { renderAll(); return; } // already looted
  var gold = 20 + Math.floor(Math.random() * 61); // 20-80
  sharedGold += gold;
  grid[y][x] = T.FLOOR; // one-time loot, stays empty afterward
  pushLog("-----Royal Treasury-----");
  pushLog("You find " + gold + " gold!");
  pushLog("Guards burst in — you've triggered an alarm!");
  var count = 2 + Math.floor(Math.random() * 2); // 2-3 elite guards
  var group = [];
  for (var i = 0; i < count; i++) group.push(makeMonsterInstance(ELITE_GUARD_DEF, 0, 0));
  enterArena(group, state.mode, "guard");
}

function openHutGift() {
  townScreen = "hutGift";
  pushLog("-----A Kindly Stranger-----");
  if (state.inGearHut && hasTeddyBear && !hasGearPart) {
    pushLog("\"Is that... my teddy bear?! You found him!\"");

      pushLog("\"You've done it! 10 sea creatures, just as I asked.\"");

      pushLog("\"Keep at it — " + seaCreatureKillsForQuest + "/10 sea creatures defeated.\"");
    }
  } else {
    pushLog("\"Times are hard. A gift, and I'll tend your wounds.\"");

function giveHutGift(kind, itemOrIdx) {
  if (kind === "teddyBear") {
    if (!hasTeddyBear || hasGearPart) { pushLog("You have nothing like that to give."); renderAll(); return; }
    hasTeddyBear = false;
    hasGearPart = true;
    pushLog("\"My teddy bear! Oh, thank you!\" They press a gear into your hand.");
    pushLog("Received a gear " + ROBOT_PARTS.gear.emoji + "!");
    townScreen = null;
    renderAll();
    return;
  }
  if (kind === "treeHeart") {
    if (!hasTreeHeart || hasArmPart) { pushLog("You have nothing like that to give."); renderAll(); return; }
    hasTreeHeart = false;
    hasArmPart = true;
    pushLog("\"The tree's heart! Just what I needed.\" They fit it into a mechanical arm.");
    pushLog("Received a mechanical arm " + ROBOT_PARTS.arm.emoji + "!");
    townScreen = null;
    renderAll();
    return;
  }
  if (kind === "claimTrident") {
    if (seaCreatureKillsForQuest < 10 || hasTrident) { pushLog("You have nothing like that to give."); renderAll(); return; }
    hasTrident = true;
    inventory.push({ category: "weapon", item: TRIDENT });
    pushLog("\"Well fought!\" They hand you an ancient trident.");
    pushLog("\"Cannons won't scratch a Kraken — but this might.\"");
    pushLog("Received the " + TRIDENT.name + " " + TRIDENT.emoji + "!");
    townScreen = null;
    renderAll();
    return;
  }
  if (kind === "krakenSkull") {
    if (!hasKrakenSkull || hasLegPart) { pushLog("You have nothing like that to give."); renderAll(); return; }
    hasKrakenSkull = false;
    hasLegPart = true;
    pushLog("\"The Kraken's skull... you actually did it.\" They fit it into place.");
    pushLog("Received a mechanical leg " + ROBOT_PARTS.leg.emoji + "!");
    townScreen = null;
    renderAll();
    return;
  }
  var gaveSomething = false;
  if (kind === "gold" && sharedGold > 0) {
    var amt = Math.min(sharedGold, 20);
    sharedGold -= amt;
    pushLog("You give " + amt + " gold.");
    gaveSomething = true;
  } else if (kind === "potion" && inventory.some(function (e) { return e.category === "potion"; })) {
    var potionIdx = inventory.findIndex(function (e) { return e.category === "potion"; });
    inventory.splice(potionIdx, 1);
    pushLog("You give a potion.");
    gaveSomething = true;
  } else if (kind === "weapon" && party[0].equippedWeapon) {
    pushLog("You give your " + party[0].equippedWeapon.name + ".");
    party[0].equippedWeapon = null;
    party[0].weaponBonus = 0;
    gaveSomething = true;
  } else if (kind === "armor" && party[0].armorBonus > 0) {
    pushLog("You give a piece of armor.");
    party[0].armorBonus = 0;
    party[0].equippedArmor = null;
    gaveSomething = true;
  }
  if (!gaveSomething) { pushLog("You have nothing like that to give."); renderAll(); return; }
  var anyHurt = party.some(function (p) { return p.alive && p.hp < p.maxHp; });
  party.forEach(function (p) { if (p.alive) p.hp = p.maxHp; });
  pushLog(anyHurt ? "Touched, they tend your wounds. Party healed." : "Touched by the gift, though you're already well.");
  // a gift of anything but gold earns more than healing at some huts —
  // the stranger opens up. At the hut sheltering the lost dog, that's
  // the reward itself: they hand the dog over. Talking to the boy is
  // still the only thing that starts the tracked quest/story.
  if (state.inDogHut && !hasRescuedDog) {
    hasRescuedDog = true;
    pushLog("\"He's been trembling in the corner for days,\" they say.");
    pushLog("\"You've been so kind — take " + DOG_NAME + ". He'll want to go home.\"");
  } else if (kind !== "gold") {
    activateRobotHutQuest(kind);
  }
  townScreen = null;
  renderAll();
}
// Each robot-part hut wants one specific kind of gift (not just any
// non-gold one) — giving the right kind for the first time activates
// that hut's quest and the part appears at HUT_PROP_TILE to go collect;
// the wrong kind just hints at what they're actually after.
function activateRobotHutQuest(kind) {
  if (state.inGearHut && !gearQuestActivated) {
    if (kind === ROBOT_PARTS.gear.giftKind) {
      gearQuestActivated = true;
      hasShovel = true;
      pushLog("\"Ah, a potion — bless you.\" They fall quiet a moment.");
      pushLog("\"...Actually, one more kindness? My teddy bear is");
      pushLog("buried by the jester's grave in Bramble's graveyard.");
      pushLog("Take this shovel and dig him up for me?\"");
    } else {
      pushLog("\"Kind of you, but... it's a potion I could really use.\"");
    }
  } else if (state.inArmHut && !armQuestActivated) {
    if (kind === ROBOT_PARTS.arm.giftKind) {
      armQuestActivated = true;
      hasAxe = true;
      pushLog("\"A weapon — that'll do nicely.\" They press a");
      pushLog("lumberjack's axe into your hands. \"Sail to Port");
      pushLog("Reverie and find the red tree — cut it down.");
      pushLog("Its heart is something magical.\"");
    } else {
      pushLog("\"Kind of you, but... I could really use a good weapon.\"");
    }
  } else if (state.inLegHut && !legQuestActivated) {
    if (kind === ROBOT_PARTS.leg.giftKind) {
      legQuestActivated = true;
      pushLog("\"Armor — perfect, actually.\" They lean in, serious now.");
      pushLog("\"Out on the waves, sea creatures grow bolder by the");
      pushLog("day. Defeat 10 of them, and come back — I've got");
      pushLog("something for you.\"");
    } else {
      pushLog("\"Kind of you, but... it's armor I'm really after.\"");
    }
  }
}

function buyItem(category, item, price) {
  if (sharedGold < price) { pushLog("Not enough gold"); renderAll(); return; }

// ============================================================
// SHARED INVENTORY — weapons/armor picked up or bought go here rather
// than auto-equipping the leader; equipping/unequipping is done per
// character from their character sheet (see the EQUIP picker overlay).
// ============================================================
function addToInventory(category, item) {
  inventory.push({ category: category, item: item });
  pushLog(item.name + " added to inventory. " + (category === "potion" ? "Drink" : "Equip") + " it from a character's sheet.");
}

function equipItemFromInventory(idx, entry) {
  var p = party[idx];
  var cat = entry.category;
  // swap out whatever's already in that slot, back into inventory, first
  if (cat === "weapon" && p.equippedWeapon) inventory.push({ category: "weapon", item: p.equippedWeapon });
  if (cat === "armor" && p.equippedArmor) inventory.push({ category: "armor", item: p.equippedArmor });
  var i = inventory.indexOf(entry);
  if (i !== -1) inventory.splice(i, 1);
  if (cat === "weapon") { p.equippedWeapon = entry.item; p.weaponBonus = entry.item.dmgBonus; }
  else { p.equippedArmor = entry.item; p.armorBonus = entry.item.defBonus; }
  pushLog(p.name + " equips " + entry.item.name + "!");
  equipPickerFor = null;
  renderAll();
}

function unequipItem(idx, cat) {
  var p = party[idx];
  if (cat === "weapon" && p.equippedWeapon) {
    inventory.push({ category: "weapon", item: p.equippedWeapon });
    pushLog(p.name + " unequips " + p.equippedWeapon.name + ".");
    p.equippedWeapon = null; p.weaponBonus = 0;
  } else if (cat === "armor" && p.equippedArmor) {
    inventory.push({ category: "armor", item: p.equippedArmor });
    pushLog(p.name + " unequips " + p.equippedArmor.name + ".");
    p.equippedArmor = null; p.armorBonus = 0;
  }
  renderAll();
}

// Drinking a potion works from any character's own sheet — that
// character is the one who drinks it and gets healed, whether in or
// out of combat (the character sheet is reachable in both).
function drinkPotion(idx, entry) {
  var p = party[idx];
  if (!p.alive) { potionPickerFor = null; renderAll(); return; }
  var i = inventory.indexOf(entry);
  if (i !== -1) inventory.splice(i, 1);
  var healed = Math.min(entry.item.heal, p.maxHp - p.hp);
  p.hp = Math.min(p.maxHp, p.hp + entry.item.heal);
  pushLog(p.name + " drinks a " + entry.item.name + " and recovers " + healed + " HP.");
  potionPickerFor = null;
  renderAll();
}

function recruitJoin(retireIdx) {
  if (!tavernRecruit) return;
  party[retireIdx] = tavernRecruit;
  pushLog(tavernRecruit.name + " joins the party!");
  tavernRecruit = null;
  townScreen = null;
  renderAll();
}

function fountainDrink() {
  var anyHurt = party.some(function (p) { return p.alive && p.hp < p.maxHp; });
  party.forEach(function (p) { if (p.alive) p.hp = p.maxHp; });
  pushLog(anyHurt ? "Refreshing! Party fully healed." : "The water sparkles. You feel fine already.");
  renderAll();
}

function healerRevive(idx) {
  var p = party[idx];
  if (p.alive) { pushLog(p.name + " is not dead"); renderAll(); return; }
  if (sharedGold < p.reviveCost) { pushLog("Not enough gold"); renderAll(); return; }
  sharedGold -= p.reviveCost;
  p.alive = true;
  p.hp = p.maxHp;
  pushLog(p.name + " is revived! -" + p.reviveCost + "g");
  p.reviveCost *= 2;
  renderAll();
}

// ============================================================
// INPUT
// ============================================================
document.getElementById("btnN").onclick = function () { if (state.mode === "spaceflight") spaceThrust(); else if (awaitingShotDirection) fireRangedWeapon("N"); else if (awaitingCannonDirection) fireCannon("N"); else if (state.mode === "combat") arenaMove(0, -1); else move(0, -1); };
document.getElementById("btnS").onclick = function () { if (state.mode === "spaceflight") spaceThrust(); else if (awaitingShotDirection) fireRangedWeapon("S"); else if (awaitingCannonDirection) fireCannon("S"); else if (state.mode === "combat") arenaMove(0, 1); else move(0, 1); };
document.getElementById("btnE").onclick = function () { if (state.mode === "spaceflight") spaceTurnRight(); else if (awaitingShotDirection) fireRangedWeapon("E"); else if (awaitingCannonDirection) fireCannon("E"); else if (state.mode === "combat") arenaMove(1, 0); else move(1, 0); };
document.getElementById("btnW").onclick = function () { if (state.mode === "spaceflight") spaceTurnLeft(); else if (awaitingShotDirection) fireRangedWeapon("W"); else if (awaitingCannonDirection) fireCannon("W"); else if (state.mode === "combat") arenaMove(-1, 0); else move(-1, 0); };
document.getElementById("btnAttack").onclick = function () {
  if (state.mode === "combat") { combatPlayerAttack(); return; }
  if (townScreen || confirmingRun) return;
  // attacking a townsperson is the other way (besides the vault) to
  // actually bring guards down on you — no more random ambient guards
  if ((state.mode === "town" || state.mode === "islandTown") && roamingNpcAdjacent()) {
    pushLog("You attack a townsperson! Guards rush in!");
    triggerGuards();
    return;
  }
  pushLog("Nothing to attack");
  renderAll();
};
document.getElementById("btnCast").onclick = cmdCast;
document.getElementById("btnAction").onclick = cmdAction;
document.getElementById("btnMenu").onclick = cmdMenu;
document.getElementById("btnRun").onclick = cmdRun;
document.getElementById("btnFire").onclick = cmdFire;
document.getElementById("btnDismount").onclick = cmdDismount;
document.getElementById("btnTame").onclick = cmdTame;
document.getElementById("btnShoot").onclick = cmdShoot;

document.addEventListener("keydown", function (e) {
  if (state.mode === "spaceflight") {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") spaceTurnLeft();
    else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") spaceTurnRight();
    else if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") spaceThrust();
    else if (e.key === " " || e.key === "f" || e.key === "F") spaceFire();
    return;
  }
  if (awaitingShotDirection) {
    if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") fireRangedWeapon("N");
    else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") fireRangedWeapon("S");
    else if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") fireRangedWeapon("W");
    else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") fireRangedWeapon("E");
    return;
  }
  if (awaitingCannonDirection) {
    if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") fireCannon("N");
    else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") fireCannon("S");
    else if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") fireCannon("W");
    else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") fireCannon("E");
    return;
  }
  if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") { if (state.mode === "combat") arenaMove(0, -1); else move(0, -1); }
  else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { if (state.mode === "combat") arenaMove(0, 1); else move(0, 1); }
  else if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { if (state.mode === "combat") arenaMove(-1, 0); else move(-1, 0); }
  else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { if (state.mode === "combat") arenaMove(1, 0); else move(1, 0); }
  else if (e.key === "g" || e.key === "G") cmdAction();
  else if (e.key === "c" || e.key === "C") cmdCast();
  else if (e.key === "m" || e.key === "M") cmdMenu();
  else if (e.key === "r" || e.key === "R") cmdRun();
  else if (e.key === "f" || e.key === "F") cmdFire();
});

// ============================================================
// TOWN SCREEN TAP HANDLING — maps a canvas click to logical
// coordinates and dispatches to the right button region, since
// the shop/tavern/fountain screens are drawn text, not DOM buttons
// ============================================================
canvas.addEventListener("click", function (e) {
  var rect = canvas.getBoundingClientRect();
  var scaleX = LW / rect.width;
  var scaleY = LH / rect.height;
  var lx = (e.clientX - rect.left) * scaleX;
  var ly = (e.clientY - rect.top) * scaleY;

  if (confirmingCyberDrive) { handleCyberDriveConfirmTap(lx, ly); return; }
  if (confirmingRun) { handleRunConfirmTap(lx, ly); return; }
  if (equipPickerFor) { handleEquipPickerTap(lx, ly); return; }
  if (potionPickerFor !== null) { handlePotionPickerTap(lx, ly); return; }
  if (characterSheetIndex !== null) { handleCharacterSheetTap(lx, ly); return; }
  if (menuScreen) { handleMenuTap(lx, ly); return; }
  if (actionChoices) { handleActionChoiceTap(lx, ly); return; }
  if (townScreen) { handleTownTap(lx, ly); return; }

  // nothing open — tapping a party member's mini card opens their character sheet
  for (var i = 0; i < party.length; i++) {
    if (inRect(lx, ly, partyMiniRect(i))) { characterSheetIndex = i; renderAll(); return; }
  }
});

function inRect(lx, ly, r) {
  return lx >= r.x && lx <= r.x + r.w && ly >= r.y && ly <= r.y + r.h;
}

function handleRunConfirmTap(lx, ly) {
  var r = runConfirmRects();
  if (inRect(lx, ly, r.close) || inRect(lx, ly, r.no)) { confirmRunNo(); return; }
  if (inRect(lx, ly, r.yes)) { confirmRunYes(); return; }
}

function handleTownTap(lx, ly) {
  // close-X, top-right of the popup, same rect used to draw it
  var xr = closeXRect();
  if (lx >= xr.x && lx <= xr.x + xr.w && ly >= xr.y && ly <= xr.y + xr.h) { closeTownScreen(); return; }

  if (townScreen === "shop") {
    var y = 115 + 22; // after gold line
    for (var i = 0; i < LOOT_TABLE.weapon.length; i++) {
      if (ly >= y - 12 && ly < y + 6) { buyItem("weapon", LOOT_TABLE.weapon[i], (i + 1) * 25); return; }
      y += 18;
    }
    if (ly >= y - 12 && ly < y + 6) { buyItem("potion", LOOT_TABLE.potion[1], 12); return; }
  } else if (townScreen === "armory") {
    var ay = 115 + 22; // after gold line
    for (var j = 0; j < LOOT_TABLE.armor.length; j++) {
      if (ly >= ay - 12 && ly < ay + 6) { buyItem("armor", LOOT_TABLE.armor[j], (j + 1) * 30); return; }
      ay += 18;
    }
  } else if (townScreen === "stable") {
    var sy2 = 115 + 22; // after gold line, the "Horse - 50g" row (only when not already mounted)
    if (!state.mounted && ly >= sy2 - 12 && ly < sy2 + 6) { buyHorseFromStable(); return; }
  } else if (townScreen === "moonshop") {
    var my2 = 115 + 22; // after gold line
    if (ly >= my2 - 12 && ly < my2 + 6) { buyMoonArmor(); return; }
  } else if (townScreen === "king") {
    // "You have the wand! [tap T]" only appears (and is only tappable)
    // on the mainland, quest not yet complete, wand in hand — see the
    // matching render branch above for how this y is reached
    if (state.mode === "town" && !wizardQuestComplete && hasWizardsWand) {
      var ky = 115 + 18 + 20 + 18 + 22; // past the 4 quest-blurb lines to the wand row
      if (ly >= ky - 12 && ly < ky + 6) { turnInWizardsWand(); return; }
    }
  } else if (townScreen === "tavern") {
    var ry = 115 + 18 + 18 + 18 + 26 + 20; // Name/Race/Class/HP lines + "Retire whom" line
    for (var k = 0; k < party.length; k++) {
      if (ly >= ry - 12 && ly < ry + 6) { recruitJoin(k); return; }
      ry += 18;
    }
  } else if (townScreen === "fountain") {
    var fy = 115 + 22; // "water is free" line, then the drink prompt
    if (ly >= fy - 12 && ly < fy + 6) { fountainDrink(); return; }
  } else if (townScreen === "healer" || townScreen === "church") {
    var hy = 115 + 22; // quote line, then revive rows (only for dead members)
    for (var m = 0; m < party.length; m++) {
      if (!party[m].alive) {
        if (ly >= hy - 12 && ly < hy + 6) { healerRevive(m); return; }
        hy += 18;
      }
    }
  } else if (townScreen === "hutGift") {
    if (state.inGearHut && hasTeddyBear && !hasGearPart) {
      var ty = 115 + 20; // "Give back the teddy bear:" line, then the trade row
      if (ly >= ty - 12 && ly < ty + 6) { giveHutGift("teddyBear"); return; }
    } else if (state.inArmHut && hasTreeHeart && !hasArmPart) {
      var hy2 = 115 + 20; // "Give back the tree's heart:" line, then the trade row
      if (ly >= hy2 - 12 && ly < hy2 + 6) { giveHutGift("treeHeart"); return; }
    } else if (state.inLegHut && hasKrakenSkull && !hasLegPart) {
      var ky = 115 + 20; // "Give back the Kraken Skull:" line, then the trade row
      if (ly >= ky - 12 && ly < ky + 6) { giveHutGift("krakenSkull"); return; }
    } else if (state.inLegHut && legQuestActivated && !hasLegPart && !hasTrident && seaCreatureKillsForQuest >= 10) {
      var dy = 115 + 20; // "Claim your reward:" line, then the trade row
      if (ly >= dy - 12 && ly < dy + 6) { giveHutGift("claimTrident"); return; }
    } else {
      var gy2 = 115 + 20; // "Give a gift" line, then Gold, Potion, [Weapon], [Armor]
      if (ly >= gy2 - 12 && ly < gy2 + 6) { giveHutGift("gold"); return; }
      gy2 += 18;
      if (ly >= gy2 - 12 && ly < gy2 + 6) { giveHutGift("potion"); return; }
      gy2 += 18;
      if (party[0].equippedWeapon) {
        if (ly >= gy2 - 12 && ly < gy2 + 6) { giveHutGift("weapon"); return; }
        gy2 += 18;
      }
      if (party[0].armorBonus > 0) {
        if (ly >= gy2 - 12 && ly < gy2 + 6) { giveHutGift("armor"); return; }
      }
    }
  } else if (townScreen === "questBoy") {
    // "Hand over the dog [tap H]" only appears (and is only tappable)
    // once the dog's been rescued and the quest isn't already turned in —
    // see the matching render branch above for how this y is reached
    if (hasRescuedDog && !dogQuestComplete) {
      var by = 115 + 22; // past the "Is that... found him!" line to the hand-over row
      if (ly >= by - 12 && ly < by + 6) { turnInDog(); return; }
    }
  } else if (townScreen === "moonKing") {
    // "Hand them over [tap H]" only appears (and is only tappable) once
    // all 3 robot parts are found and the quest isn't already turned in —
    // see the matching render branch above for how this y is reached
    if (alienQuestComplete && !futureManComplete && hasGearPart && hasArmPart && hasLegPart) {
      var mky = 115 + 20; // past the "found all his parts!" line to the hand-over row
      if (ly >= mky - 12 && ly < mky + 6) { turnInRobotParts(); return; }
    }
  }
}

window.addEventListener("resize", renderAll);

requestAnimationFrame(function () { renderAll(); });

})();
</script>
