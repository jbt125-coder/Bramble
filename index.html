<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ultima-Style RPG</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden;
    font-family: 'Courier New', monospace; color: #fff; user-select: none;
  }
  #app {
    width: 100%; height: 100vh; height: 100dvh; max-width: 700px; margin: 0 auto;
    display: flex; flex-direction: column; background: #000;
  }
  #canvasWrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: #000; min-height: 0; overflow: hidden;
  }
  #gameCanvas {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }
  #controlsRow {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 8px; background: #000; border-top: 1px solid #333; flex-shrink: 0;
    gap: 6px;
  }
  #dpadWrap {
    display: grid;
    grid-template-areas: ". n ." "w c e" ". s .";
    grid-template-columns: 42px 42px 42px;
    grid-template-rows: 42px 42px 42px;
    gap: 3px;
  }
  .dpadBtn {
    background: #000; border: 2px solid #6666ff; color: #6666ff;
    font-size: 18px; cursor: pointer; touch-action: manipulation; font-family: inherit;
  }
  .dpadBtn:active { background: #111144; }
  #cmdBtns {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px;
    flex: 1; align-content: center; justify-content: flex-end;
  }
  .cmdBtn {
    background: #000; border: 2px solid #ff5555; color: #ff5555;
    font-size: 11px; padding: 9px 10px; cursor: pointer; touch-action: manipulation;
    font-family: inherit; font-weight: bold; min-width: 64px;
  }
  .cmdBtn:active { background: #331111; }
  #errBox {
    position: fixed; bottom: 0; left: 0; right: 0; background: #400; color: #fdd;
    font-size: 11px; padding: 8px; z-index: 999; display: none; white-space: pre-wrap;
    max-height: 40vh; overflow: auto;
  }
</style>
</head>
<body>

<div id="app">
  <div id="canvasWrap">
    <canvas id="gameCanvas" width="380" height="620"></canvas>
  </div>
  <div id="controlsRow">
    <div id="dpadWrap">
      <button class="dpadBtn" style="grid-area:n" id="btnN">^</button>
      <button class="dpadBtn" style="grid-area:w" id="btnW">&lt;</button>
      <div style="grid-area:c"></div>
      <button class="dpadBtn" style="grid-area:e" id="btnE">&gt;</button>
      <button class="dpadBtn" style="grid-area:s" id="btnS">v</button>
    </div>
    <div id="cmdBtns">
      <button class="cmdBtn" id="btnAttack">ATTACK</button>
      <button class="cmdBtn" id="btnCast">CAST</button>
      <button class="cmdBtn" id="btnAction">ACTION</button>
      <button class="cmdBtn" id="btnMenu">MENU</button>
      <button class="cmdBtn" id="btnRun">RUN</button>
      <button class="cmdBtn" id="btnFire" style="display:none;">FIRE</button>
      <button class="cmdBtn" id="btnDismount" style="display:none;">DISMOUNT</button>
      <button class="cmdBtn" id="btnTame" style="display:none;">TAME</button>
      <button class="cmdBtn" id="btnShoot" style="display:none;">SHOOT</button>
    </div>
  </div>
</div>

<div id="errBox"></div>

<script>
window.onerror = function (msg, src, line, col, err) {
  var box = document.getElementById('errBox');
  box.style.display = 'block';
  box.textContent = 'JS ERROR: ' + msg + '\n@ line ' + line + ':' + col + '\n' + (err && err.stack ? err.stack : '');
};

(function () {
"use strict";

// ============================================================
// LOGICAL CANVAS LAYOUT
// Matches the reference: a big square map viewport on the left
// (~60% width) with a decorative border, and a party-card panel
// on the right (~40% width), stacked cards with divider bars.
// ============================================================
var LW = 380, LH = 620; // fixed logical resolution — tall/narrow to match phone portrait, minimizing letterbox black bars

// ---------- layout: party strips top & bottom, map fills the space between ----------
var TOPBAR_H = 56;      // top party strip (2 members side by side) — flush to y=0
var BOTBAR_H = 56;      // bottom party strip (2 members side by side)
var LOG_H = 70;         // description/log text area, below everything
var BORDER = 8;
var COORD_GAP = 20;     // room for the "(x)(y)" readout above the map border
var LOC_GAP = 34;       // room for the location-name banner (plus an optional active-quest line) below the map border

var MAP_X0 = 6;
var MAP_OUTER_W = LW - 12;
var MAP_Y0 = TOPBAR_H + COORD_GAP;
var MAP_OUTER_H = LH - TOPBAR_H - COORD_GAP - LOC_GAP - BOTBAR_H - LOG_H;

var MAP_INNER_X0 = MAP_X0 + BORDER;
var MAP_INNER_Y0 = MAP_Y0 + BORDER;
var MAP_INNER_W = MAP_OUTER_W - BORDER * 2;
var MAP_INNER_H = MAP_OUTER_H - BORDER * 2;

var VIEW_TILES = 11;    // tile viewport count (width-limited since LW < LH now)
var TILE = Math.floor(Math.min(MAP_INNER_W / VIEW_TILES, MAP_INNER_H / VIEW_TILES));

var LOCLABEL_Y = MAP_Y0 + MAP_OUTER_H;
var BOTBAR_Y0 = LOCLABEL_Y + LOC_GAP;
var LOG_Y0 = BOTBAR_Y0 + BOTBAR_H;

// ---------- palette ----------
var PAL = {
  black: "#000000",
  purple: "#6666ee",
  purpleDark: "#3a3aa0",
  green: "#22cc44",
  greenDark: "#116622",
  white: "#ffffff",
  brick: "#aa2222",
  brickDark: "#661111",
  water: "#2244aa",
  waterLight: "#3a66cc",
  gray: "#888888",
  yellow: "#ffee55",
  red: "#ff4444",
  skin: "#e0a878",
  gold: "#ffcc33"
};

// ============================================================
// TILE TYPES
// ============================================================
var T = {
  GRASS: 0, WATER: 1, FOREST: 2, MOUNTAIN: 3, ROAD: 4,
  TOWN: 5, DUNGEON: 6, FLOOR: 7, WALL: 8, DOOR: 9, CHEST: 10, INNKEEPER: 11, SHOPKEEP: 12,
  TAVERN: 13, FOUNTAIN: 14, HEALER: 15, HORSE: 16, SHIP: 17, ISLAND: 18, ARMORY: 19, KING: 20,
  STABLE: 21, PORTAL: 22, MOON_GRASS: 23, MOON_SHOP: 24, MOON_PORTAL: 25, ROCKET: 26,
  HUT: 27, MOAI: 28, SHRINE: 29, CHURCH: 30, GARDEN_FOUNTAIN: 31, VOLCANO: 32, ASIA_CASTLE: 33,
  GRAVE: 34, BRIDGE: 35, BED: 36, MOURNER: 37, HUT_NPC: 38,
  STAIRS_DOWN: 39, STAIRS_UP: 40, BOSS: 41, QUEST_BOY: 42, MOON_KING: 43,
  ROBOT_KING: 44, CYBER_WALL: 45, CYBER_FLOOR: 46,
  CYBER_DISC: 47, CYBER_PHONE: 48, CYBER_TV: 49, CYBER_ANTENNA: 50, CYBER_PAGER: 51,
  CYBER_DIAL: 52, CYBER_SLIDER: 53, CYBER_PRINTER: 54, CYBER_CD: 55,
  RED_TREE: 56
};

function mkMap(w, h, fill) {
  var g = [];
  for (var r = 0; r < h; r++) {
    var row = [];
    for (var c = 0; c < w; c++) row.push(fill);
    g.push(row);
  }
  return g;
}

var OW_W = 100, OW_H = 90;
// the player's starting position matches the safe-zone carved at the
// continent's center in buildOverworld() — a few tiles west of the town
var OW_START_X = Math.floor(OW_W / 2) - 12, OW_START_Y = Math.floor(OW_H / 2);
// positions of the 3 scattered huts, recorded as placeScatteredLandmarks()
// runs during buildOverworld() below, so a specific hut can later be
// designated for a quest (e.g. the dog hut)
var hutPositions = [];
var dogHutPos = null; // set right after buildOverworld() runs, below
var gearHutPos = null; // ditto — the other 2 mainland huts' robot-part quests
var armHutPos = null;
var legHutPos = null; // set after buildIslandOverworld() runs — the lone island hut
// fixed spot in Port Reverie (the island town), forced red instead of the
// usual green — needs to exist before buildIslandTown() runs, below
var RED_TREE_POS = { x: 5, y: 8 };
// the Thief King's tornado, a few tiles off the uncharted isle — needs to
// exist before placeIslandEntry() runs, below
var PIRATE_TORNADO_POS = null;
// ---------- clustered terrain generation ----------
// Instead of rolling each tile independently (which scatters single tiles
// everywhere), we seed a handful of "blob centers" per feature type and
// grow each outward with falling probability, so forests clump into
// patches, water clumps into lakes/coastline, and mountains form ranges.
function growBlob(g, w, h, startR, startC, tileType, size, rand, overwritable) {
  var frontier = [{ r: startR, c: startC }];
  var placed = 0;
  var seen = {};
  seen[startR + "," + startC] = true;
  while (frontier.length && placed < size) {
    var idx = Math.floor(rand() * frontier.length);
    var cell = frontier.splice(idx, 1)[0];
    if (cell.r <= 0 || cell.c <= 0 || cell.r >= h - 1 || cell.c >= w - 1) continue;
    if (!overwritable(g[cell.r][cell.c])) continue;
    g[cell.r][cell.c] = tileType;
    placed++;
    var neighbors = [[cell.r - 1, cell.c], [cell.r + 1, cell.c], [cell.r, cell.c - 1], [cell.r, cell.c + 1]];
    neighbors.forEach(function (n) {
      var key = n[0] + "," + n[1];
      if (!seen[key] && rand() < 0.72) { // fall-off chance keeps blobs roughly round, not perfect squares
        seen[key] = true;
        frontier.push({ r: n[0], c: n[1] });
      }
    });
  }
}

function buildOverworld() {
  // Much larger world: start as one big ocean, then grow a single
  // compact continent roughly in the middle, leaving a lot of open sea
  // around it in every direction — matching "much larger ocean" rather
  // than just a bigger map overall.
  var g = mkMap(OW_W, OW_H, T.WATER);
  var seed = 11;
  function rand() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  var isOpenWater = function (t) { return t === T.WATER; };
  var isOpenLand = function (t) { return t === T.GRASS; };

  // the continent: one big grass blob, centered, sized to leave generous
  // ocean margins on every side
  var contCenterR = Math.floor(OW_H / 2), contCenterC = Math.floor(OW_W / 2);
  growBlob(g, OW_W, OW_H, contCenterR, contCenterC, T.GRASS, Math.floor(OW_W * OW_H * 0.09), rand, isOpenWater);

  // a few inland lakes, scaled up for the bigger continent
  for (var lk = 0; lk < 5; lk++) {
    var lr = contCenterR - 20 + Math.floor(rand() * 40);
    var lc = contCenterC - 25 + Math.floor(rand() * 50);
    growBlob(g, OW_W, OW_H, lr, lc, T.WATER, 10 + Math.floor(rand() * 20), rand, isOpenLand);
  }

  // mountain ranges
  for (var mr = 0; mr < 4; mr++) {
    var startRow = contCenterR - 20 + Math.floor(rand() * 40);
    var startCol = contCenterC - 25 + Math.floor(rand() * 50);
    var chainLen = 4 + Math.floor(rand() * 4);
    for (var seg = 0; seg < chainLen; seg++) {
      growBlob(g, OW_W, OW_H, startRow, startCol, T.MOUNTAIN, 5 + Math.floor(rand() * 6), rand, isOpenLand);
      startRow += Math.floor(rand() * 3) - 1;
      startCol += Math.floor(rand() * 3) - 1;
    }
  }

  // the main road to town: a clean straight line from the start zone to
  // the town gate, laid down BEFORE forests grow so nothing can cut
  // across it later — trees are then grown to line either side of it,
  // rather than scattered randomly and occasionally overwriting it
  var roadRow = contCenterR;
  var roadStartC = contCenterC - 12, roadEndC = contCenterC + 2;
  for (var rc = roadStartC; rc <= roadEndC; rc++) {
    g[roadRow][rc] = T.ROAD;
  }
  // tree-lined edges: a row of forest directly above and below the road
  for (var tc = roadStartC; tc <= roadEndC; tc++) {
    if (g[roadRow - 1][tc] === T.GRASS && Math.random() < 0.8) g[roadRow - 1][tc] = T.FOREST;
    if (g[roadRow + 1][tc] === T.GRASS && Math.random() < 0.8) g[roadRow + 1][tc] = T.FOREST;
  }
  // the town gate sits exactly at the road's end, so the road always
  // visibly leads straight to it
  placeOnNearestGrass(g, roadRow, roadEndC + 1, T.TOWN, rand);

  // forest patches — kept away from the road corridor (and its tree-lined
  // edges) so they never grow across and break the straight line
  for (var fp = 0; fp < 16; fp++) {
    var fr = contCenterR - 22 + Math.floor(rand() * 44);
    var fc = contCenterC - 27 + Math.floor(rand() * 54);
    if (Math.abs(fr - roadRow) <= 2 && fc >= roadStartC - 2 && fc <= roadEndC + 2) continue; // skip anything that would encroach on the road
    growBlob(g, OW_W, OW_H, fr, fc, T.FOREST, 6 + Math.floor(rand() * 10), rand, isOpenLand);
  }

  placeOnNearestGrass(g, contCenterR - 12, contCenterC + 15, T.DUNGEON, rand);

  // safe starting zone right at the continent's center
  g[contCenterR - 1][contCenterC - 12] = T.GRASS;
  g[contCenterR][contCenterC - 12] = T.GRASS;
  g[contCenterR + 1][contCenterC - 12] = T.GRASS;

  placeHorseAndShip(g, rand);
  placeExtraWildShips(g, rand);
  placeScatteredLandmarks(g, rand, contCenterR, contCenterC + 3);
  placeVolcanoes(g, rand, OW_W, OW_H, 2);
  return g;
}

// Scatters the smaller flavor landmarks (huts, moai, shrine, grave) at
// random grass spots — cheap one-tile features, no special generation
// needed beyond "somewhere reasonable on solid ground". Huts specifically
// are kept well clear of the castle, since visiting one is meant to be
// its own small side trip, not something you stumble on right at the gate.
function placeScatteredLandmarks(g, rand, castleR, castleC) {
  var placements = [
    { type: T.HUT, count: 3, minDistFromCastle: 15 },
    { type: T.MOAI, count: 2 },
    { type: T.SHRINE, count: 2 },
    { type: T.GRAVE, count: 2 }
  ];
  placements.forEach(function (p) {
    var placed = 0, tries = 0;
    while (placed < p.count && tries < 800) {
      tries++;
      var r = 2 + Math.floor(rand() * (OW_H - 4));
      var c = 2 + Math.floor(rand() * (OW_W - 4));
      if (g[r][c] !== T.GRASS) continue;
      if (p.minDistFromCastle) {
        var d = Math.sqrt((r - castleR) * (r - castleR) + (c - castleC) * (c - castleC));
        if (d < p.minDistFromCastle) continue;
      }
      g[r][c] = p.type;
      if (p.type === T.HUT) hutPositions.push({ x: c, y: r });
      placed++;
    }
  });
}

// Finds the nearest grass tile to (r,c) (spiraling outward) and places
// the given landmark tile there — used so hardcoded-feeling landmark
// placement still always resolves onto solid ground on the generated
// continent, wherever it actually ended up.
function placeOnNearestGrass(g, r, c, tileType, rand) {
  for (var radius = 0; radius < 40; radius++) {
    for (var dr = -radius; dr <= radius; dr++) {
      for (var dc = -radius; dc <= radius; dc++) {
        if (Math.abs(dr) !== radius && Math.abs(dc) !== radius) continue; // only the ring edge
        var rr = r + dr, cc = c + dc;
        if (g[rr] && g[rr][cc] === T.GRASS) { g[rr][cc] = tileType; return; }
      }
    }
  }
}

// A handful of extra freely-boardable wild ships scattered around the
// coastline, in addition to the one from placeHorseAndShip — since ships
// are no longer pirate-gated, there should be more than one to stumble on.
function placeExtraWildShips(g, rand) {
  var placed = 0, tries = 0;
  while (placed < 4 && tries < 2000) {
    tries++;
    var r = 1 + Math.floor(rand() * (OW_H - 2));
    var c = 1 + Math.floor(rand() * (OW_W - 2));
    if (g[r][c] === T.GRASS && hasAdjacentWater(g, r, c)) {
      g[r][c] = T.SHIP;
      placed++;
    }
  }
}

// Places one wild horse somewhere reachable on open grass, and one derelict
// ship along a coastline tile (grass tile adjacent to water) — both are
// fixed one-time pickups on the overworld.
function placeHorseAndShip(g, rand) {
  for (var tries = 0; tries < 200; tries++) {
    var r = 2 + Math.floor(rand() * (OW_H - 4));
    var c = 2 + Math.floor(rand() * (OW_W - 4));
    if (g[r][c] === T.GRASS) { g[r][c] = T.HORSE; break; }
  }
  for (var tries2 = 0; tries2 < 300; tries2++) {
    var r2 = 2 + Math.floor(rand() * (OW_H - 4));
    var c2 = 2 + Math.floor(rand() * (OW_W - 4));
    if (g[r2][c2] === T.GRASS && hasAdjacentWater(g, r2, c2)) { g[r2][c2] = T.SHIP; break; }
  }
}
function hasAdjacentWater(g, r, c) {
  var deltas = [[-1, 0], [1, 0], [0, -1], [0, 1]];
  for (var i = 0; i < deltas.length; i++) {
    var rr = r + deltas[i][0], cc = c + deltas[i][1];
    if (g[rr] && g[rr][cc] === T.WATER) return true;
  }
  return false;
}

// Carves a walled rectangular room (walls on the border, floor inside)
// into the grid, with a door punched through one specific wall tile.
// doorSide: "N" | "S" | "E" | "W" — which wall the door sits on.
// Carves a walled rectangular room (walls on the border, floor inside)
// into the grid. openSide/openOffset punches a plain FLOOR gap through
// that wall (not a T.DOOR) so walking in/out is purely cosmetic — only
// the town's main gate should trigger the "leave to overworld" behavior.
function carveRoom(g, x0, y0, w, h, openSide, openOffset) {
  for (var r = y0; r < y0 + h; r++) {
    for (var c = x0; c < x0 + w; c++) {
      var isEdge = (r === y0 || r === y0 + h - 1 || c === x0 || c === x0 + w - 1);
      g[r][c] = isEdge ? T.WALL : T.FLOOR;
    }
  }
  var off = openOffset || Math.floor((openSide === "N" || openSide === "S" ? w : h) / 2);
  if (openSide === "N") g[y0][x0 + off] = T.FLOOR;
  else if (openSide === "S") g[y0 + h - 1][x0 + off] = T.FLOOR;
  else if (openSide === "W") g[y0 + off][x0] = T.FLOOR;
  else if (openSide === "E") g[y0 + off][x0 + w - 1] = T.FLOOR;
}

function buildTown() {
  // Mainland castle: much larger and more spread out than before — a
  // big open grass courtyard with real breathing room between the
  // profession rooms, plus a dedicated garden (fountain, flowers, a
  // small bridge over a stream) and a separate graveyard area.
  var w = 44, h = 40;
  var g = mkMap(w, h, T.GRASS);
  for (var c = 0; c < w; c++) { g[0][c] = T.WALL; g[h - 1][c] = T.WALL; }
  for (var r = 0; r < h; r++) { g[r][0] = T.WALL; g[r][w - 1] = T.WALL; }
  g[h - 1][22] = T.DOOR; // main gate, south wall, centered

  // Treasure vault — a small sealed room at the very north edge, directly
  // behind the throne room. Reaching it requires walking around through
  // the throne room's own back wall opening. Chests inside are guarded:
  // taking one summons elite guards, far stronger than an ordinary rare
  // town scuffle.
  carveRoom(g, 18, 1, 8, 5, "S", 4);
  var vaultChestSpots = [[19, 2], [21, 2], [23, 2], [20, 4]];
  vaultChestSpots.forEach(function (spot) { g[spot[1]][spot[0]] = T.CHEST; });

  // Throne room — north side, largest room, King inside, directly south
  // of (and connected to) the vault above
  carveRoom(g, 15, 6, 14, 8, "S", 7);
  g[6][22] = T.FLOOR; // punch through the throne room's own north wall so
  // it actually connects to the vault's door directly above it — the
  // two rooms would otherwise share a solid wall with no way through
  g[10][22] = T.KING;

  // Weaponsmith — far west (shopkeeper wanders the room; not a fixed tile)
  carveRoom(g, 3, 18, 8, 6, "E", 3);

  // Armory — far east, mirrors the weaponsmith (shopkeeper wanders too)
  carveRoom(g, 33, 18, 8, 6, "W", 3);

  // Tavern — southwest, well clear of the weaponsmith
  // (the tavern keeper wanders the room; not a fixed tile — see
  // setupRoamingEntities, kind "tavern")
  carveRoom(g, 3, 29, 9, 7, "N", 4);

  // Healer / hospital — southeast, mirrors the tavern
  carveRoom(g, 32, 29, 9, 7, "N", 4);
  g[32][36] = T.HEALER;
  g[31][34] = T.BED;
  g[31][38] = T.BED;
  g[33][34] = T.BED;
  g[33][38] = T.BED;

  // Stable — south-center, between tavern and healer
  carveRoom(g, 18, 30, 8, 6, "N", 4);
  g[34][22] = T.STABLE;

  // ---------- Garden — its own walled-off area, west-center, between the
  // throne room and the tavern, with the new ornate fountain, flowers,
  // and a small stream crossed by a bridge ----------
  carveRoom(g, 3, 7, 10, 10, "S", 5);
  for (var gr = 8; gr < 16; gr++) {
    for (var gc = 4; gc < 12; gc++) {
      if (g[gr][gc] === T.FLOOR) g[gr][gc] = T.GRASS; // grass floor, not stone, inside the garden
    }
  }
  // a short stream running through the garden, with a bridge crossing it
  for (var sr = 9; sr < 15; sr++) g[sr][8] = T.WATER;
  g[12][8] = T.BRIDGE;
  g[11][6] = T.GARDEN_FOUNTAIN;
  g[10][5] = T.QUEST_BOY; // a boy waiting by the fountain, looking for his lost dog

  // ---------- Graveyard — its own walled area, east-center, mirroring
  // the garden, with a scatter of graves ----------
  carveRoom(g, 31, 7, 10, 10, "S", 5);
  for (var vr = 8; vr < 16; vr++) {
    for (var vc = 32; vc < 40; vc++) {
      if (g[vr][vc] === T.FLOOR) g[vr][vc] = T.GRASS;
    }
  }
  var graveSpots = [[34, 9], [36, 10], [38, 9], [34, 13], [37, 13], [35, 11]];
  graveSpots.forEach(function (spot) { g[spot[1]][spot[0]] = T.GRAVE; });
  var mournerSpots = [[35, 10], [37, 10]];
  mournerSpots.forEach(function (spot) {
    if (g[spot[1]][spot[0]] === T.GRASS) g[spot[1]][spot[0]] = T.MOURNER;
  });

  // scattered courtyard trees, with a dense cluster specifically placed
  // to obscure the OLD hidden fountain spot no longer used — trees here
  // are now just general courtyard atmosphere since the garden fountain
  // has its own dedicated garden room instead of being hidden in the open
  var seed = 42;
  function rand() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  for (var tr = 0; tr < 20; tr++) {
    var tx = 14 + Math.floor(rand() * (w - 28));
    var ty = 12 + Math.floor(rand() * (h - 24));
    if (g[ty][tx] === T.GRASS) g[ty][tx] = T.FOREST;
  }

  return g;
}

// ---------- the mainland dungeon: 8 randomly-generated levels ----------
// Each level is a chain of random rooms connected by L-shaped corridors
// (guaranteed connected, since every room links straight to the last).
// Level 1 has the door out (back to the overworld) plus a stairway down.
// Levels 2-7 have a stairway up (back) and a stairway down (onward).
// Level 8 has only a stairway up — its far room holds the Archwizard
// boss instead of a stairway down, since there's nowhere further to go.
function buildDungeonLevel(levelNum) {
  var w = 24, h = 18;
  var g = mkMap(w, h, T.WALL);
  var roomCount = 5 + Math.floor(Math.random() * 3); // 5-7 rooms
  var rooms = [];
  for (var i = 0; i < roomCount; i++) {
    var rw = 4 + Math.floor(Math.random() * 4); // 4-7 wide
    var rh = 4 + Math.floor(Math.random() * 4); // 4-7 tall
    var rx = 1 + Math.floor(Math.random() * (w - rw - 2));
    var ry = 1 + Math.floor(Math.random() * (h - rh - 2));
    for (var r = ry; r < ry + rh; r++) for (var c = rx; c < rx + rw; c++) g[r][c] = T.FLOOR;
    rooms.push({ x: rx + Math.floor(rw / 2), y: ry + Math.floor(rh / 2) });
  }
  for (var j = 1; j < rooms.length; j++) {
    var a = rooms[j - 1], b = rooms[j];
    var cx = a.x, cy = a.y;
    while (cx !== b.x) { g[cy][cx] = T.FLOOR; cx += cx < b.x ? 1 : -1; }
    while (cy !== b.y) { g[cy][cx] = T.FLOOR; cy += cy < b.y ? 1 : -1; }
    g[cy][cx] = T.FLOOR;

  var first = rooms[0], last = rooms[rooms.length - 1];
  g[first.y][first.x] = levelNum === 1 ? T.DOOR : T.STAIRS_UP;
  g[last.y][last.x] = levelNum === 8 ? T.BOSS : T.STAIRS_DOWN;

}

// Places a single hut on a random walkable tile of the given type — a

function placeOneHut(g, rand, openTile, w, h, avoidR, avoidC, minDist) {
  for (var tries = 0; tries < 300; tries++) {
    var r = 2 + Math.floor(rand() * (h - 4));
    var c = 2 + Math.floor(rand() * (w - 4));
    if (g[r][c] !== openTile) continue;
    if (minDist && avoidR !== undefined) {

// Hides the magic portal somewhere inside one of the island's forest

// Places the ISLAND marker at a random open-water tile on the main
// overworld, far enough from the mainland's coastline to feel like a real
// voyage. Falls back to any water tile if a far one can't be found.
function placeIslandEntry() {
  // With the much larger ocean, the island should sit far out from the
  // mainland — require real distance from the continent's center, not
  // just barely clear of the coastline, so reaching it is a real voyage.
  var contCenterR = Math.floor(OW_H / 2), contCenterC = Math.floor(OW_W / 2);
  var minDistFromCenter = Math.min(OW_W, OW_H) * 0.38; // well out past the continent's edge
  var candidates = [];
  for (var r = 2; r < OW_H - 2; r++) {
    for (var c = 2; c < OW_W - 2; c++) {
      if (overworldGrid[r][c] !== T.WATER) continue;
      var distFromCenter = Math.sqrt((r - contCenterR) * (r - contCenterR) + (c - contCenterC) * (c - contCenterC));
      if (distFromCenter >= minDistFromCenter && farFromLand(r, c, 3)) candidates.push({ r: r, c: c });
    }
  }
  if (candidates.length === 0) {
    // fall back to "just clear of any coastline" if the distant ring
    // somehow found nothing (shouldn't normally happen at this map size)
    for (var r2 = 1; r2 < OW_H - 1; r2++) for (var c2 = 1; c2 < OW_W - 1; c2++) {
      if (overworldGrid[r2][c2] === T.WATER && farFromLand(r2, c2, 3)) candidates.push({ r: r2, c: c2 });
    }
  }
  if (candidates.length === 0) return;
  var pick = candidates[Math.floor(Math.random() * candidates.length)];
  overworldGrid[pick.r][pick.c] = T.ISLAND;
  // the Thief King's tornado lurks a few tiles off from the island itself
  var tornadoOffsets = [[3, 3], [-3, 3], [3, -3], [-3, -3], [4, 0], [-4, 0], [0, 4], [0, -4]];
  for (var oi = 0; oi < tornadoOffsets.length; oi++) {
    var tr = pick.r + tornadoOffsets[oi][0], tc = pick.c + tornadoOffsets[oi][1];
    if (overworldGrid[tr] && overworldGrid[tr][tc] === T.WATER) {
      PIRATE_TORNADO_POS = { x: tc, y: tr };
      break;
    }
  }
}
function farFromLand(r, c, radius) {

    }

  return true;
}
